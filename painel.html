<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EF">
<title>KEVIMA · Painel profissional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   KEVIMA · PAINÉIS (profissional · empresa · anunciante · organizador)
   ============================================================ */
:root{
  --paper:#F7F4EF; --surface:#FDFCFA; --surface-2:#F1ECE3; --surface-3:#E9E3D7;
  --ink:#1C1A16; --ink-2:#57534A; --ink-3:#8A8478; --line:#E7E1D6; --line-2:#EFEAE0;
  --clay:#C25A3A; --clay-deep:#A8432A; --clay-soft:#F3E4DB; --clay-tint:#FBF1EB;
  --sage:#3E6B5A; --sage-soft:#E4EEE8; --gold:#B4842B; --gold-soft:#F6EDD8;
  --sky:#37618E; --sky-soft:#E3EAF2; --danger:#B23A2E; --danger-soft:#F6E3E0;
  --accent:var(--clay); --accent-soft:var(--clay-soft); --accent-tint:var(--clay-tint);
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px; --r-full:999px;
  --sh-sm:0 1px 2px rgba(28,26,22,.05); --sh:0 4px 20px -8px rgba(28,26,22,.16); --sh-lg:0 24px 60px -20px rgba(28,26,22,.26);
  --nav-w:252px; --max:1280px; --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --paper:#16140F; --surface:#1E1B15; --surface-2:#26221A; --surface-3:#2F2A21;
  --ink:#F3EFE6; --ink-2:#B8B2A4; --ink-3:#867F70; --line:#302B22; --line-2:#2A251D;
  --clay:#E0794F; --clay-deep:#C25A3A; --clay-soft:#3A2419; --clay-tint:#241812;
  --sage:#6FA98F; --sage-soft:#1E2C25; --gold:#D0A150; --gold-soft:#2B2415;
  --sky:#6E9CCB; --sky-soft:#1B2531; --danger:#E27366; --danger-soft:#331B18;
  --sh-sm:0 1px 2px rgba(0,0,0,.3); --sh:0 6px 24px -8px rgba(0,0,0,.5); --sh-lg:0 24px 60px -20px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.15;letter-spacing:-.02em}
.h1{font-size:clamp(1.5rem,3vw,2rem)} .h2{font-size:1.35rem} .h3{font-size:1.06rem;font-weight:600}
.eyebrow{font-family:var(--sans);font-size:.7rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)} .fw6{font-weight:600} .fw5{font-weight:550}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:inherit;text-decoration:none}
.i{width:1.15em;height:1.15em;flex:none;vertical-align:middle}
svg{stroke-linecap:round;stroke-linejoin:round}

.btn{font-family:var(--sans);font-size:.86rem;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.62em 1.05em;border-radius:var(--r-full);border:1px solid transparent;cursor:pointer;transition:transform .16s var(--ease),background .18s,border-color .18s,color .18s;white-space:nowrap;background:none;color:var(--ink);line-height:1}
.btn:active{transform:scale(.97)} .btn .i{width:1.1em;height:1.1em}
.btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{filter:brightness(.93)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)} .btn-ghost:hover{border-color:var(--ink-3)}
.btn-quiet{background:transparent;color:var(--ink-2)} .btn-quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn-sage{background:var(--sage-soft);color:var(--sage)} .btn-sage:hover{background:var(--sage);color:#fff}
.btn-boost{background:var(--gold-soft);color:var(--gold)} .btn-boost:hover{background:var(--gold);color:#fff}

/* imagens do anúncio */
.img-grelha{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.img-mini{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.img-mini img{width:100%;height:100%;object-fit:cover;display:block}
.img-x{position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:var(--r-full);
  background:rgba(20,17,12,.62);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.img-x svg{width:12px;height:12px}
.img-capa{position:absolute;bottom:4px;left:4px;font-size:.6rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--accent);color:#fff;padding:.14em .38em;border-radius:4px}
.img-add{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:var(--r);background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-3);
  font-family:var(--sans);font-size:.7rem;transition:border-color .18s,color .18s}
.img-add:hover{border-color:var(--accent);color:var(--accent)}
.img-add svg{width:16px;height:16px}
/* miniatura na listagem */
.linha-thumb{width:44px;height:34px;border-radius:6px;object-fit:cover;flex:none;background:var(--surface-2)}
.btn-boost svg{width:1em;height:1em}
.btn-danger{background:var(--danger-soft);color:var(--danger)} .btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:.46em .8em;font-size:.8rem} .btn-xs{padding:.34em .62em;font-size:.75rem}
.btn-icon{padding:.5em;width:2.3em;height:2.3em;border-radius:var(--r)} .btn-block{width:100%}

.pill{display:inline-flex;align-items:center;gap:.4em;font-size:.72rem;font-weight:600;padding:.3em .6em;border-radius:var(--r-full);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-ok{background:var(--sage-soft);color:var(--sage)}
.pill-pend{background:var(--gold-soft);color:var(--gold)}
.pill-anal{background:var(--sky-soft);color:var(--sky)}
.pill-rej{background:var(--danger-soft);color:var(--danger)}
.pill-off{background:var(--surface-3);color:var(--ink-2)}
.pill-boost{background:var(--gold-soft);color:var(--gold)}
.pill-boost svg{width:.85em;height:.85em}
/* cartão de escolha de destaque */
.pack{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all .18s var(--ease);position:relative;background:var(--surface)}
.pack:hover{border-color:var(--ink-3)}
.pack.on{border-color:var(--accent);background:var(--accent-tint);box-shadow:0 0 0 3px var(--accent-soft)}
.pack .pk-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pack .pk-n{font-weight:650}
.pack .pk-p{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--accent)}
.pack .pk-d{font-size:.78rem;color:var(--ink-3);margin-top:3px;line-height:1.4}
.pack .pk-tag{position:absolute;top:-9px;right:14px;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:var(--accent);color:#fff;padding:.2em .5em;border-radius:4px}
/* Marca de país. Substitui bandeiras emoji, que não renderizam no Windows
   e variam de forma entre sistemas — isto é idêntico em todo o lado. */
.cc{display:inline-flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--serif);font-size:.64rem;font-weight:600;letter-spacing:.07em;
  min-width:2.05em;height:1.5em;padding:0 .36em;border:1px solid var(--line);
  border-radius:4px;color:var(--ink-2);background:var(--surface);line-height:1}

.tag{display:inline-flex;align-items:center;gap:.35em;font-size:.72rem;font-weight:550;padding:.28em .58em;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

.shell{display:flex;min-height:100vh}
.sidebar{width:var(--nav-w);flex:none;position:fixed;inset:0 auto 0 0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.sb-brand{display:flex;align-items:center;gap:.55em;padding:16px 16px 10px;font-family:var(--serif);font-size:1.15rem;font-weight:600}
/* selector de papel */
.role-sel{margin:0 12px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:9px 11px;cursor:pointer;position:relative;transition:border-color .18s}
.role-sel:hover{border-color:var(--ink-3)}
.role-sel .rl{font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.role-sel .rn{font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:.4em;margin-top:2px}
.role-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);z-index:60;overflow:hidden;display:none}
.role-menu.on{display:block}
.role-menu>div{padding:10px 12px;font-size:.84rem;display:flex;align-items:center;gap:.6em;cursor:pointer;line-height:1.25}
.role-menu>div:hover{background:var(--surface-2)}
.role-menu>div>div{min-width:0}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px 16px}
.sb-item{display:flex;align-items:center;gap:.7em;padding:.56em .7em;border-radius:var(--r);color:var(--ink-2);font-weight:500;font-size:.86rem;cursor:pointer;transition:all .14s var(--ease);margin-bottom:1px}
.sb-item .i{width:17px;height:17px;opacity:.8}
.sb-item:hover{background:var(--surface-2);color:var(--ink)}
.sb-item.on{background:var(--ink);color:var(--paper)} .sb-item.on .i{opacity:1}
.sb-item .c{margin-left:auto;font-size:.68rem;font-weight:700;background:var(--accent);color:#fff;min-width:17px;height:17px;padding:0 5px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center}
.sb-item.on .c{background:var(--paper);color:var(--ink)}
.sb-foot{border-top:1px solid var(--line);padding:10px}
.sb-user{display:flex;align-items:center;gap:.6em;padding:.5em;border-radius:var(--r)}

.main{flex:1;margin-left:var(--nav-w);min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 84%,transparent);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 clamp(16px,3vw,30px)}
.content{flex:1;padding:clamp(18px,3vw,30px);max-width:var(--max);width:100%;margin:0 auto;animation:fadeUp .4s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}

.av{border-radius:var(--r-full);object-fit:cover;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink-2);overflow:hidden}
.av-xs{width:26px;height:26px;font-size:.66rem}
.av-sm{width:34px;height:34px;font-size:.76rem}
.av-md{width:44px;height:44px;font-size:.9rem}
.av-lg{width:64px;height:64px;font-size:1.2rem;font-family:var(--serif)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.card-pad{padding:20px}
.card-hover{cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s var(--ease)}
.card-hover:hover{border-color:var(--ink-3);box-shadow:var(--sh);transform:translateY(-2px)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;align-items:center} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column} .flex1{flex:1} .mla{margin-left:auto}
.section{margin-top:24px} .divider{height:1px;background:var(--line);border:0}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap16{gap:16px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.fs-sm{font-size:.82rem}.fs-xs{font-size:.74rem}.tc{text-align:center}.tr{text-align:right}
.clay{color:var(--clay)}.sage{color:var(--sage)}.danger{color:var(--danger)}.sky{color:var(--sky)}.gold{color:var(--gold)}
.accent{color:var(--accent)}.hide{display:none!important}
.line-clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.stat{padding:18px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);position:relative}
.stat .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat .v{font-family:var(--serif);font-size:1.8rem;font-weight:600;line-height:1;letter-spacing:-.02em}
.stat .l{color:var(--ink-3);font-size:.8rem;margin-top:5px}
.stat .d{position:absolute;top:18px;right:18px;font-size:.74rem;font-weight:650}
.up{color:var(--sage)} .down{color:var(--danger)}

/* tabelas */
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead th{text-align:left;font-size:.68rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.t-actions{display:flex;gap:5px;justify-content:flex-end}
.tbl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}

.input,.select{font-family:var(--sans);font-size:.86rem;color:var(--ink);width:100%;padding:.6em .85em;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .16s,box-shadow .16s}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:.35em;margin-bottom:12px}
.field label{font-size:.78rem;font-weight:550;color:var(--ink-2)}
textarea.input{resize:vertical;min-height:80px}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap .i{position:absolute;left:12px;width:16px;height:16px;color:var(--ink-3);pointer-events:none}
.search-wrap .input{padding-left:36px}

.chip{display:inline-flex;align-items:center;gap:.35em;font-size:.78rem;font-weight:500;padding:.4em .8em;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.65em .95em;font-weight:550;font-size:.86rem;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--accent)}

/* KANBAN candidaturas */
.kan{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kan-col{background:var(--surface-2);border-radius:var(--r-lg);padding:10px;min-height:120px}
.kan-col h4{font-family:var(--sans);font-size:.74rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:2px 4px 10px;display:flex;justify-content:space-between}
.kan-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:8px;cursor:pointer;transition:box-shadow .18s,transform .18s var(--ease)}
.kan-card:hover{box-shadow:var(--sh);transform:translateY(-1px)}

/* AGENDA / calendário */
.agenda{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ag-day{background:var(--surface-2);border-radius:var(--r);padding:10px;min-height:150px}
.ag-day .dh{text-align:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.ag-day .dh .dn{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.ag-day .dh .dd{font-family:var(--serif);font-size:1.2rem;font-weight:600}
.ag-day.today .dh .dd{color:var(--accent)}
.slot{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:7px 8px;margin-top:8px;font-size:.75rem;cursor:pointer;transition:transform .15s}
.slot:hover{transform:translateX(2px)}
.slot .st{font-weight:650} .slot .sn{color:var(--ink-3);font-size:.7rem}

/* MENSAGENS */
.msg-wrap{display:grid;grid-template-columns:290px 1fr;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);height:calc(100vh - 190px);min-height:440px}
.conv-list{border-right:1px solid var(--line);overflow-y:auto}
.conv{display:flex;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .14s}
.conv:hover{background:var(--surface-2)}
.conv.on{background:var(--accent-tint);border-left:3px solid var(--accent);padding-left:11px}
.conv .cn{font-weight:600;font-size:.85rem;display:flex;justify-content:space-between;gap:6px}
.conv .cp{color:var(--ink-3);font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;flex:none;align-self:center}
.thread{display:flex;flex-direction:column;min-width:0}
.thread-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.thread-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.bub{max-width:74%;padding:10px 13px;border-radius:16px;font-size:.86rem;line-height:1.45;position:relative}
.bub .tm{font-size:.66rem;opacity:.6;margin-top:4px}
.bub.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.bub.me{background:var(--accent);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.bub.auto{background:var(--sage-soft);color:var(--sage);align-self:center;font-size:.78rem;max-width:88%;text-align:center;border-radius:10px}
.composer{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border:1px solid var(--line);border-radius:16px;padding:9px 13px;font-family:var(--sans);font-size:.86rem;resize:none;background:var(--surface);color:var(--ink);max-height:110px;min-height:38px}
.composer textarea:focus{outline:none;border-color:var(--accent)}

.callout{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);font-size:.84rem;line-height:1.5}
.callout .i{width:18px;height:18px;flex:none;margin-top:1px}
.callout-info{background:var(--sky-soft);color:var(--sky)}
.callout-warn{background:var(--gold-soft);color:var(--gold)}
.callout-sage{background:var(--sage-soft);color:var(--sage)}
.callout-accent{background:var(--accent-tint);color:var(--accent)}

.progrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.progrow .pl{width:130px;font-size:.82rem;flex:none}
.progrow .pt{flex:1;height:8px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden}
.progrow .pt i{display:block;height:100%;background:var(--accent);border-radius:var(--r-full);transition:width .8s var(--ease)}
.progrow .pv{width:48px;text-align:right;font-size:.8rem;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b .bar{width:100%;max-width:32px;background:var(--accent);border-radius:5px 5px 2px 2px}
.bars .b .lb{font-size:.66rem;color:var(--ink-3)}

.state{text-align:center;padding:48px 20px;max-width:400px;margin:0 auto}
.state .ill{width:52px;height:52px;margin:0 auto 14px;color:var(--ink-3);opacity:.6}
.state .ill svg{width:100%;height:100%}

.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:.8em 1.15em;border-radius:var(--r-full);font-size:.86rem;font-weight:500;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:.55em;animation:tin .35s var(--ease)}
.toast.err{background:var(--danger)} .toast.ok2{background:var(--sage)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:rgba(20,17,12,.44);backdrop-filter:blur(3px);z-index:100;opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:110;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-lg);width:min(560px,94vw);max-height:88vh;overflow-y:auto;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:all .3s var(--ease)}
.modal.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.modal-pad{padding:24px} .modal-x{position:absolute;top:14px;right:14px}

.menu-btn{display:none}
@media (max-width:960px){
  .sidebar{transform:translateX(-100%);transition:transform .3s var(--ease);box-shadow:var(--sh-lg)}
  .sidebar.open{transform:none}
  .main{margin-left:0} .menu-btn{display:inline-flex}
  .g4{grid-template-columns:repeat(2,1fr)} .g3,.g2{grid-template-columns:1fr}
  .content{padding:16px}
  .msg-wrap{grid-template-columns:1fr;height:auto}
  .conv-list{border-right:0;border-bottom:1px solid var(--line);max-height:220px}
  .thread-body{min-height:300px}
  .agenda{grid-template-columns:1fr;gap:10px} .ag-day{min-height:auto}
  .modal{top:auto;bottom:0;left:0;transform:translateY(100%);width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;max-width:100%}
  .modal.on{transform:translateY(0)}
  .hide-m,.lbl-m{display:none!important}
}
@media (max-width:560px){.g4{grid-template-columns:1fr}}

function destaqueAtivo(item){
  if(!item||!item.destaque)return null;

  const ate=new Date(base.getTime()+p.dias*86400000);

/* Marca KEVIMA: azulejo escuro com o K metálico facetado.
   Cada face do K é um polígono com o seu próprio gradiente — é isso que
   dá o aspeto de metal dobrado em vez de uma letra chapada. */
function markK(s,mono){
  const p='k'+Math.random().toString(36).slice(2,7);
  const f=n=>mono?'currentColor':`url(#${p}${n})`;
  const K=`<path d="M132 96h44v320h-44z" fill="${f(1)}"/>
    <path d="M176 96h28v320h-28z" fill="${f(2)}"/>
    <path d="M204 175 256 96h41L204 230z" fill="${f(3)}"/>
    <path d="M297 96h41L204 285v-55z" fill="${f(4)}"/>
    <path d="M204 285 380 416h-55L204 326z" fill="${f(5)}"/>
    <path d="M204 326 325 416h-55l-66-49z" fill="${f(6)}"/>`;
  const abre=`<svg width="${s}" height="${s}" viewBox="0 0 512 512" fill="none" role="img" aria-label="KEVIMA">`;
  if(mono)return abre+K+`</svg>`;
  return abre+`<defs>
      <linearGradient id="${p}t" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3E3E3E"/><stop offset=".36" stop-color="#1B1B1B"/><stop offset="1" stop-color="#070707"/>
      </linearGradient>
      <linearGradient id="${p}r" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9A9A9A" stop-opacity=".75"/><stop offset=".4" stop-color="#9A9A9A" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="${p}1" x1="0" y1="0" x2="1" y2=".2">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#DCDCDC"/><stop offset="1" stop-color="#ADADAD"/>
      </linearGradient>
      <linearGradient id="${p}2" x1="0" y1="0" x2="1" y2=".25">
        <stop offset="0" stop-color="#8E8E8E"/><stop offset="1" stop-color="#5A5A5A"/>
      </linearGradient>
      <linearGradient id="${p}3" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#6B6B6B"/><stop offset="1" stop-color="#A9A9A9"/>
      </linearGradient>
      <linearGradient id="${p}4" x1="0" y1="1" x2=".7" y2="0">
        <stop offset="0" stop-color="#C4C4C4"/><stop offset=".55" stop-color="#F6F6F6"/><stop offset="1" stop-color="#FFFFFF"/>
      </linearGradient>
      <linearGradient id="${p}5" x1="0" y1="0" x2="1" y2=".7">
        <stop offset="0" stop-color="#FBFBFB"/><stop offset=".55" stop-color="#D5D5D5"/><stop offset="1" stop-color="#A2A2A2"/>
      </linearGradient>
      <linearGradient id="${p}6" x1="0" y1="0" x2="1" y2=".7">
        <stop offset="0" stop-color="#8A8A8A"/><stop offset=".6" stop-color="#666666"/><stop offset="1" stop-color="#464646"/>
      </linearGradient>
    </defs>
    <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#${p}t)"/>
    <rect x="17.5" y="17.5" width="477" height="477" rx="116.5" fill="none" stroke="url(#${p}r)" stroke-width="3"/>`+K+`</svg>`;
}

/* As tabelas do painel foram escritas sobre os arrays de demonstração.
   Com sessão, esses arrays passam a ser os anúncios reais da empresa —
   assim as vistas, o editor e a compra de destaque continuam iguais e
   deixam de mostrar dados de outra empresa a quem entra na sua conta. */
const ESTADO_DEMO={published:'live',draft:'draft',review:'pend',paused:'pend'};
function adaptarTabelas(){
  const vivos=ANUNCIOS_DB.filter(x=>x.status!=='removed');
  const base=x=>({id:x.id,details:x.details||{},destaque:x.destaque,
    status:ESTADO_DEMO[x.status]||'draft',posted:dataCurta(x.published_at||x.created_at),
    /* métricas de audiência ainda não são recolhidas: zero é o valor honesto */
    views:0});
  VAGAS=vivos.filter(x=>x.kind==='job').map(x=>{const d=x.details||{};return Object.assign(base(x),{
    role:x.title,city:x.city||'—',salary:d.salario||'A combinar',type:d.tipo||'Tempo inteiro',apps:0})});
  ANUNCIOS=vivos.filter(x=>x.kind==='home').map(x=>{const d=x.details||{};return Object.assign(base(x),{
    title:x.title,city:x.city||'—',price:Math.round((x.price_cents||0)/100),
    type:d.tipo||'Apartamento',favs:0,leads:0})});
  MEUS_EVENTOS=vivos.filter(x=>x.kind==='event').map(x=>{const d=x.details||{};return Object.assign(base(x),{
    title:x.title,date:dataCurta(d.data)||'A definir',time:d.hora||'—',
    venue:d.local||(x.city||'A anunciar'),
    price:x.price_cents?((x.price_cents/100)+'€'):'Gratuito',
    going:0,cap:Number(d.lotacao)||0})});
}
function dataCurta(iso){
  if(!iso)return '';
  const d=new Date(iso); if(isNaN(d))return String(iso);
  return d.toLocaleDateString('pt-PT',{day:'numeric',month:'short',year:'numeric'});
}

/* Compra real: passa pela Edge Function, que confirma o pagamento
   antes de gravar. Nunca escreve o destaque a partir do cliente. */
async function comprarDestaqueRemoto(listingId,packageId){
  const {data}=await sb.auth.getSession();
  const token=data?.session?.access_token;
  if(!token)throw new Error('sem_sessao');
  const r=await fetch(SB_URL+'/functions/v1/comprar-destaque',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SB_ANON},
    body:JSON.stringify({listing_id:listingId,package_id:packageId})
  });
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.erro||'falhou'),{detalhe:j.mensagem,estado:r.status});
  return j;
}

   Guardadas em `empresas/{company_id}/`, que é o balde onde os
   membros da empresa podem escrever. O anúncio guarda os URLs em
   details.imagens — array, porque um quarto sem fotografias
   praticamente não recebe contactos. */
const MAX_IMG=5*1024*1024, MAX_IMAGENS=5;
let IMGS=[];        // URLs da edição em curso

function grelhaImagens(){
  const g=el('imgGrelha'); if(!g)return;
  g.innerHTML=IMGS.map((u,i)=>`<div class="img-mini">
      <img src="${esc(u)}" alt="">
      <button type="button" class="img-x" onclick="removerImagem(${i})" title="Remover">${svg('x')}</button>
      ${i===0?'<span class="img-capa">capa</span>':''}
    </div>`).join('')
   +(IMGS.length<MAX_IMAGENS?`<button type="button" class="img-add" onclick="el('imgInput').click()">
      ${svg('plus')}<span>Adicionar</span></button>`:'');
}
function removerImagem(i){ IMGS.splice(i,1); grelhaImagens() }

async function enviarImagens(input){
  const ficheiros=[...(input.files||[])]; input.value='';
  if(!ficheiros.length)return;
  if(!ligado())return toast('Entra na conta da empresa para enviar imagens','err');
  if(IMGS.length+ficheiros.length>MAX_IMAGENS)
    return toast(`No máximo ${MAX_IMAGENS} imagens por anúncio`,'err');

  for(const f of ficheiros){
    if(!/^image\/(jpeg|png|webp|avif)$/.test(f.type)){ toast(`"${f.name}" não é uma imagem suportada`,'err'); continue }
    if(f.size>MAX_IMG){ toast(`"${f.name}" passa de 5 MB`,'err'); continue }
    const ext=f.type.split('/')[1].replace('jpeg','jpg');
    const caminho=`${EMPRESA.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
    try{
      const {error}=await sb.storage.from('empresas').upload(caminho,f,{contentType:f.type});
      if(error)throw error;
      IMGS.push(sb.storage.from('empresas').getPublicUrl(caminho).data.publicUrl);
      grelhaImagens();
    }catch(e){ toast(`Falhou o envio de "${f.name}"`,'err') }
  }
}

/* Ao remover um anúncio, as imagens não devem ficar a ocupar espaço
   nem acessíveis por URL. */
async function apagarImagensDe(item){
  const urls=((item&&item.details)||{}).imagens||[];
  if(!urls.length||!ligado())return;
  const caminhos=urls.map(u=>{const p=u.split('/empresas/')[1];return p?p.split('?')[0]:null}).filter(Boolean);
  if(caminhos.length){ try{ await sb.storage.from('empresas').remove(caminhos) }catch(e){} }
}

const MAX_FOTO=2*1024*1024;   // igual ao limite do balde `avatars`
async function enviarFoto(input){
  const f=input.files&&input.files[0]; input.value='';
  if(!f)return;
  if(!['image/jpeg','image/png','image/webp'].includes(f.type))
    return toast('A fotografia tem de ser JPG, PNG ou WEBP','err');
  if(f.size>MAX_FOTO)
    return toast('A fotografia não pode passar de 2 MB','err');
  if(!ligado()&&!comSessao())
    return toast('Entra na tua conta para guardar a fotografia','err');

  const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[f.type];
  /* O logótipo pertence à empresa, não a quem o enviou. Se ficasse na
     pasta pessoal, uma empresa com dois gestores teria o logótipo
     debaixo de um deles — e apagar essa conta levava-o atrás. */
  const balde=EMPRESA?'empresas':'avatars';
  const pasta=EMPRESA?EMPRESA.id:SB_USER.id;
  const caminho=`${pasta}/logo.${ext}`;
  toast('A enviar…');
  try{
    const {error}=await sb.storage.from(balde).upload(caminho,f,{upsert:true,contentType:f.type});
    if(error)throw error;
    const {data}=sb.storage.from(balde).getPublicUrl(caminho);
    FOTO_URL=data.publicUrl+'?v='+Date.now();   // rebenta a cache do CDN
    if(EMPRESA){
      try{
        await sb.from('companies').update({logo_url:FOTO_URL}).eq('id',EMPRESA.id);
        EMPRESA.logo_url=FOTO_URL;
      }catch(e){}
    }else{
      try{ await sb.from('profiles').update({avatar_url:FOTO_URL}).eq('id',SB_USER.id) }catch(e){}
    }
    renderShell(); go(P.route);
    toast('Fotografia actualizada','ok2');
  }catch(e){
    toast(/exceeded|size/i.test(e.message)?'Ficheiro demasiado grande':'Não foi possível enviar','err');
  }
}
let FOTO_URL=null;
/* A que acabou de ser enviada tem prioridade sobre a que veio da BD,
   para a mudança se ver sem esperar por um recarregamento. */
const fotoAtual=()=>FOTO_URL||(EMPRESA&&EMPRESA.logo_url)||null;

/* ============================================================
   ANÚNCIOS — criar e editar
   ------------------------------------------------------------
   Um formulário só para os três tipos. Os campos comuns vivem em
   colunas (title, city, price_cents) e os próprios de cada tipo em
   `details`, que é jsonb — por isso a definição abaixo diz onde
   cada campo pertence com o prefixo "d.".
   ============================================================ */
const CAMPOS={
  vaga:[
    {k:'title', l:'Cargo', ph:'Ex: Servente / Ajudante de construção', req:true},
    {k:'city',  l:'Localização', ph:'Almada'},
    {k:'d.salario', l:'Salário', ph:'1.000€–1.200€'},
    {k:'d.tipo', l:'Tipo de contrato', t:'select', op:['Tempo inteiro','Part-time','Turnos','Temporário']},
    {k:'d.sem_experiencia', l:'Aceita candidatos sem experiência', t:'check',
     nota:'É o filtro mais usado por quem procura o primeiro emprego em Portugal.'},
    {k:'d.descricao', l:'Descrição', t:'textarea', ph:'A função, o ambiente e o que oferece.'},
  ],
  anuncio:[
    {k:'title', l:'Título', ph:'Ex: T1 renovado perto do centro', req:true},
    {k:'d.tipo', l:'Tipo', t:'select', op:['Quarto','Apartamento','Casa','Alojamento temporário']},
    {k:'price',  l:'Renda mensal (€)', t:'number', ph:'750'},
    {k:'city',   l:'Cidade', ph:'Setúbal'},
    {k:'d.caucao', l:'Caução', t:'select', op:['1 mês','2 meses','Sem caução']},
    {k:'d.despesas', l:'Despesas', t:'select', op:['Incluídas','Não incluídas','Parcialmente incluídas']},
    {k:'d.descricao', l:'Descrição', t:'textarea', ph:'O imóvel, a zona e as condições, com honestidade.'},
  ],
  evento:[
    {k:'title', l:'Título', ph:'Ex: Noite de Kizomba & Semba', req:true},
    {k:'d.categoria', l:'Categoria', t:'select',
     op:['Música','Cultura','Comunidade','Networking','Negócios','Desporto','Formação','Gastronomia']},
    {k:'d.data', l:'Data', t:'date'},
    {k:'d.hora', l:'Hora', t:'time'},
    {k:'d.local', l:'Local', ph:'Espaço e morada'},
    {k:'city', l:'Cidade', ph:'Lisboa'},
    {k:'price', l:'Preço (€, vazio = gratuito)', t:'number', ph:'10'},
    {k:'d.descricao', l:'Descrição', t:'textarea', ph:'O que vai acontecer e para quem é.'},
  ],
};
const TITULOS={vaga:['Nova vaga','Editar vaga'],anuncio:['Novo anúncio','Editar anúncio'],evento:['Novo evento','Editar evento']};

/* Lê um campo do item, seja de coluna ou de details. */
function valorDe(item,k){
  if(!item)return '';
  if(k.startsWith('d.'))return (item.details||{})[k.slice(2)] ?? (item[k.slice(2)] ?? '');
  if(k==='price')return item.price_cents!=null?item.price_cents/100:(item.price ?? '');
  return item[k] ?? '';
}
function formAnuncio(tipo,id){
  const item=id?itemPorTipo(tipo,id):null;
  IMGS=[...(((item||{}).details||{}).imagens||[])];
  const campos=CAMPOS[tipo];
  openModal(`<div class="modal-pad"><button class="btn btn-quiet btn-icon modal-x" onclick="closeModal()">${svg('x')}</button>
    <h2 class="h2 mb16">${TITULOS[tipo][id?1:0]}</h2>
    ${campos.map((c,i)=>{
      const v=valorDe(item,c.k), cid='f'+i;
      if(c.t==='check')return `<label class="row gap8 mb12" style="cursor:pointer;align-items:flex-start">
        <input type="checkbox" id="${cid}" ${v?'checked':''} style="accent-color:var(--accent);margin-top:3px">
        <span><span class="fw5 fs-sm">${esc(c.l)}</span>${c.nota?`<br><span class="muted fs-xs">${esc(c.nota)}</span>`:''}</span></label>`;
      if(c.t==='select')return `<div class="field"><label>${esc(c.l)}</label><select class="select" id="${cid}">
        ${c.op.map(o=>`<option ${String(v)===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
      if(c.t==='textarea')return `<div class="field"><label>${esc(c.l)}</label>
        <textarea class="input" id="${cid}" placeholder="${esc(c.ph||'')}">${esc(v)}</textarea></div>`;
      return `<div class="field"><label>${esc(c.l)}</label>
        <input class="input" id="${cid}" type="${c.t||'text'}" placeholder="${esc(c.ph||'')}" value="${esc(v)}"></div>`;
    }).join('')}
    <div class="field">
      <label>Imagens ${tipo==='anuncio'?'<span class="muted fs-xs">— sem fotografias, um anúncio de casa quase não recebe contactos</span>':'<span class="muted fs-xs">— opcional</span>'}</label>
      <div class="img-grelha" id="imgGrelha"></div>
      <input type="file" id="imgInput" accept="image/jpeg,image/png,image/webp,image/avif" multiple
             style="display:none" onchange="enviarImagens(this)">
      ${!ligado()?`<p class="muted fs-xs mt8">${svg('info')} Entra na conta da empresa para poderes enviar imagens.</p>`:''}
    </div>
    <div id="fErro"></div>
    <div class="callout callout-sage mb16">${svg('info')}<div>Publicar é gratuito e sem limite. O destaque é opcional e paga-se à parte.</div></div>
    <div class="row gap8">
      ${id?`<button class="btn btn-danger" onclick="apagarAnuncio('${tipo}','${id}')">${svg('trash')}</button>`:''}
      <button class="btn btn-primary flex1" onclick="guardarAnuncio('${tipo}',${id?`'${id}'`:'null'})">${id?'Guardar alterações':'Publicar'}</button>
    </div>
  </div>`);
  grelhaImagens();
  setTimeout(()=>{const p=el('f0');if(p)p.focus()},220);
}
async function guardarAnuncio(tipo,id){
  const campos=CAMPOS[tipo], dados={details:{}};
  campos.forEach((c,i)=>{
    const e=el('f'+i); if(!e)return;
    const v=c.t==='check'?e.checked:(c.t==='number'?(e.value===''?null:Number(e.value)):e.value.trim());
    if(c.k.startsWith('d.'))dados.details[c.k.slice(2)]=v;
    else if(c.k==='price')dados.price_cents=v==null?null:Math.round(v*100);
    else dados[c.k]=v;
  });
  dados.details.imagens=IMGS;
  if(!dados.title){el('fErro').innerHTML=`<div class="callout" style="background:var(--danger-soft);color:var(--danger);margin-bottom:12px">${svg('warn')}<div>O título é obrigatório.</div></div>`;return}

  const kind={vaga:'job',anuncio:'home',evento:'event'}[tipo];

  if(ligado()){
    try{
      if(id&&String(id).includes('-')){
        const {error}=await sb.from('listings').update({...dados,updated_at:new Date().toISOString()}).eq('id',id);
        if(error)throw error;
      }else{
        const {error}=await sb.from('listings').insert({
          ...dados, company_id:EMPRESA.id, kind,
          status:'published', published_at:new Date().toISOString()
        });
        if(error)throw error;
      }
      await carregarAnuncios(); closeModal(); go(P.route);
      return toast(id?'Alterações guardadas':'Anúncio publicado','ok2');
    }catch(e){
      el('fErro').innerHTML=`<div class="callout" style="background:var(--danger-soft);color:var(--danger);margin-bottom:12px">${svg('warn')}<div>${esc(e.message||'Não foi possível guardar.')}</div></div>`;
      return;
    }
  }

  /* Sem sessão: actualiza os dados de demonstração, para o fluxo ser
     visível na mesma. */
  const lista={vaga:VAGAS,anuncio:ANUNCIOS,evento:MEUS_EVENTOS}[tipo];
  const d=dados.details;
  if(id){
    const it=lista.find(x=>x.id===id);
    if(it){
      it.title=dados.title; if(dados.city)it.city=dados.city;
      if(tipo==='vaga'){it.role=dados.title; it.salary=d.salario||it.salary; it.type=d.tipo||it.type}
      if(tipo==='anuncio'&&dados.price_cents!=null)it.price=dados.price_cents/100;
      if(tipo==='evento'){it.venue=d.local||it.venue; it.price=dados.price_cents?(dados.price_cents/100)+'€':'Gratuito'}
    }
  }else{
    const novo={id:tipo[0]+Date.now(),status:'live',city:dados.city||'—',title:dados.title,destaque:null};
    if(tipo==='vaga')Object.assign(novo,{role:dados.title,salary:d.salario||'A combinar',type:d.tipo||'Tempo inteiro',apps:0,views:0,posted:'hoje'});
    if(tipo==='anuncio')Object.assign(novo,{price:dados.price_cents?dados.price_cents/100:0,type:d.tipo||'Apartamento',views:0,favs:0,leads:0,posted:'hoje'});
    if(tipo==='evento')Object.assign(novo,{venue:d.local||'A anunciar',date:d.data||'',time:d.hora||'',price:dados.price_cents?(dados.price_cents/100)+'€':'Gratuito',going:0,views:0,cap:100});
    lista.unshift(novo);
  }
  closeModal(); go(P.route);
  toast(id?'Alterações guardadas':'Anúncio publicado','ok2');
}
function apagarAnuncio(tipo,id){
  openModal(`<div class="modal-pad"><button class="btn btn-quiet btn-icon modal-x" onclick="closeModal()">${svg('x')}</button>
    <h2 class="h2 mb8">Remover anúncio?</h2>
    <p class="muted mb24">Deixa de aparecer nas pesquisas. Se tiver destaque activo, o período não é reembolsado.</p>
    <div class="row gap8"><button class="btn btn-ghost flex1" onclick="formAnuncio('${tipo}','${id}')">Cancelar</button>
    <button class="btn btn-danger flex1" onclick="confirmarRemocao('${tipo}','${id}')">Remover</button></div></div>`);
}
async function confirmarRemocao(tipo,id){
  if(ligado()&&String(id).includes('-')){
    try{
      await apagarImagensDe(itemPorTipo(tipo,id));   // não deixar ficheiros órfãos no balde
      await sb.from('listings').update({status:'removed'}).eq('id',id); await carregarAnuncios(); }
    catch(e){ closeModal(); return toast('Não foi possível remover','err') }
  }else{
    const lista={vaga:VAGAS,anuncio:ANUNCIOS,evento:MEUS_EVENTOS}[tipo];
    const i=lista.findIndex(x=>x.id===id); if(i>=0)lista.splice(i,1);
  }
  closeModal(); go(P.route); toast('Anúncio removido');
}

/* ============================================================
   REGISTAR EMPRESA — gratuito, sem cartão
   ============================================================ */
/* Dados escritos no formulário antes de haver conta. Sem isto, quem vinha
   da escolha de perfil na app preenchia tudo, era mandado criar conta e
   perdia o que tinha escrito. */
let EMPRESA_PENDENTE=null;
/* `cat` chega da escolha de perfil na app; a categoria fica pré-seleccionada
   mas editável — quem se enganou no ecrã anterior corrige aqui.
   `d` repõe o formulário depois do desvio pela criação de conta. */
function registarEmpresa(cat,d){
  d=d||EMPRESA_PENDENTE||{};
  cat=cat||d.cat;
  openModal(`<div class="modal-pad"><button class="btn btn-quiet btn-icon modal-x" onclick="closeModal()">${svg('x')}</button>
    <div class="av av-lg" style="background:var(--accent-soft);color:var(--accent);border-radius:16px;width:52px;height:52px">${svg('building')}</div>
    <h2 class="h2 mt12 mb4">Registar empresa</h2>
    <p class="muted mb16">O registo é gratuito e não pede cartão. Publicar anúncios também não custa nada.</p>
    <div class="field"><label>Nome da empresa</label><input class="input" id="reNome" placeholder="Ex: Edifer Obras" value="${esc(d.nome||'')}"></div>
    <div class="field"><label>Categoria</label>
      <select class="select" id="reCat">${CATEGORIAS.map(c=>`<option${c===cat?' selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="row gap8">
      <div class="field flex1"><label>Cidade</label><input class="input" id="reCidade" placeholder="Ex: Almada" value="${esc(d.cidade||'')}"></div>
      <div class="field flex1"><label>NIF</label><input class="input" id="reNif" placeholder="Nove dígitos" value="${esc(d.nif||'')}"></div>
    </div>
    <div class="field"><label>Email de contacto</label><input class="input" id="reEmail" type="email" placeholder="geral@empresa.pt" value="${esc(d.email||'')}"></div>
    <div id="reErro"></div>
    <div class="callout callout-sage mb16">${svg('shield')}<div>Sem mensalidade e sem compromisso. Só paga se um dia decidir destacar um anúncio.</div></div>
    <button class="btn btn-primary btn-block btn-lg" onclick="submeterEmpresa()">Criar conta gratuita</button>
  </div>`);
  setTimeout(()=>{const n=el('reNome');if(n)n.focus()},240);
}
async function submeterEmpresa(){
  const nome=(el('reNome').value||'').trim(), email=(el('reEmail').value||'').trim();
  const erro=(m)=>{el('reErro').innerHTML=`<div class="callout" style="background:var(--danger-soft);color:var(--danger);margin-bottom:12px">${svg('warn')}<div>${esc(m)}</div></div>`};
  if(!nome)return erro('Indique o nome da empresa.');
  if(!email||!email.includes('@'))return erro('Indique um email de contacto válido.');

  // Sem sessão não há onde guardar: pede a conta primeiro, sem perder o
  // que já foi escrito.
  if(SB_ON&&!comSessao()){
    EMPRESA_PENDENTE={nome,email,cat:el('reCat').value,
      cidade:(el('reCidade').value||'').trim(),nif:(el('reNif').value||'').trim()};
    closeModal();toast('Falta criar a tua conta — os dados ficam guardados');
    return contaModal('criar');
  }

  if(ligado()||comSessao()){
    try{
      /* Uma só chamada: a função cria a empresa e o vínculo do dono na
         mesma transação. Em dois passos separados, uma falha no segundo
         deixava a empresa órfã e inacessível a quem a criou. */
      const {data:co,error}=await sb.rpc('registar_empresa',{
        p_name:nome, p_category:el('reCat').value,
        p_city:(el('reCidade').value||'').trim()||null,
        p_nif:(el('reNif').value||'').trim()||null,
        p_email:email
      });
      if(error)throw error;
      EMPRESA=Array.isArray(co)?co[0]:co; EMPRESA_PENDENTE=null; await carregarAnuncios();
      closeModal(); renderShell(); go(P.route);
      return toast('Empresa registada. Já pode publicar anúncios','ok2');
    }catch(e){return erro('Não foi possível registar: '+(e.message||'erro'))}
  }
  closeModal();
  toast('Empresa registada localmente (sem sessão)');
}

/* ============================================================
   DESTACAR ANÚNCIO — único fluxo de pagamento
   ============================================================ */
let DEST_SEL='d15';
function itemPorTipo(tipo,id){
  return tipo==='vaga'?VAGAS.find(x=>x.id===id)
    :tipo==='anuncio'?ANUNCIOS.find(x=>x.id===id)
    :tipo==='evento'?MEUS_EVENTOS.find(x=>x.id===id):null;
}
const nomeItem=i=>i?(i.role||i.title||'Anúncio'):'';
function modalDestaque(tipo,id){
  const item=itemPorTipo(tipo,id); if(!item)return;
  DEST_SEL='d15'; pintarDestaque(tipo,id);
}
function pintarDestaque(tipo,id){
  const item=itemPorTipo(tipo,id); const at=destaqueAtivo(item);
  const p=DESTAQUES.find(x=>x.id===DEST_SEL);
  const fim=new Date((at?new Date(at.ate):HOJE()).getTime()+p.dias*86400000);
  openModal(`<div class="modal-pad"><button class="btn btn-quiet btn-icon modal-x" onclick="closeModal()">${svg('x')}</button>
    <div class="av av-lg" style="background:var(--accent-soft);color:var(--accent);border-radius:16px;width:52px;height:52px">${svg('star')}</div>
    <h2 class="h2 mt12 mb4">${at?'Prolongar destaque':'Destacar anúncio'}</h2>
    <p class="muted mb16">${esc(nomeItem(item))}</p>
    ${at?`<div class="callout callout-warn mb16">${svg('info')}<div>Este anúncio já está destacado por mais <b>${at.faltam} ${at.faltam===1?'dia':'dias'}</b>. O período que escolher é somado ao que falta.</div></div>`:''}
    <div class="eyebrow mb8">Escolha o período</div>
    <div class="stack gap8 mb16">
      ${DESTAQUES.map(d=>`<div class="pack ${DEST_SEL===d.id?'on':''}" onclick="DEST_SEL='${d.id}';pintarDestaque('${tipo}','${id}')">
        ${d.popular?`<span class="pk-tag">Mais escolhido</span>`:''}
        <div class="pk-top"><span class="pk-n">${d.nome}</span><span class="pk-p">${d.preco}€</span></div>
        <div class="pk-d">${esc(d.desc)}</div>
      </div>`).join('')}
    </div>
    <div class="card card-pad mb16" style="padding:14px 16px;background:var(--surface-2)">
      <div class="row between fs-sm"><span class="muted">Período</span><span class="fw6">${p.dias} dias</span></div>
      <div class="row between fs-sm mt4"><span class="muted">Termina a</span><span class="fw6">${fmtCurto(fim)}</span></div>
      <hr class="divider" style="margin:10px 0">
      <div class="row between"><span class="fw6">Total a pagar hoje</span><span class="num fw6" style="font-size:1.3rem;color:var(--accent)">${p.preco}€</span></div>
    </div>
    <div class="callout callout-sage mb16">${svg('shield')}<div><b>Pagamento único.</b> Não há mensalidade nem renovação automática: quando os ${p.dias} dias terminarem, o anúncio volta ao normal e continua publicado de graça.</div></div>
    <div class="row gap8">
      <button class="btn btn-ghost flex1" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary flex1" onclick="confirmarDestaque('${tipo}','${id}')">Pagar ${p.preco}€ e destacar</button>
    </div>
  </div>`);
}
async function confirmarDestaque(tipo,id){
  const item=itemPorTipo(tipo,id);
  const btn=document.querySelector('#modalBody .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='A processar…'}

  // Com sessão e anúncio real, a compra passa sempre pelo servidor.
  if(ligado()&&String(id).includes('-')){
    try{
      const r=await comprarDestaqueRemoto(id,DEST_SEL);
      await carregarAnuncios();
      closeModal();
      toast(`Destaque ativo durante ${r.pacote.dias} dias`,'ok2');
      return go(P.route);
    }catch(e){
      closeModal();
      const msg={pagamento_nao_configurado:'Falta configurar o método de pagamento.',
                 pagamento_por_implementar:'A integração de pagamento ainda não está feita.',
                 sem_permissao_neste_anuncio:'Este anúncio não é da sua empresa.',
                 sem_sessao:'Sessão expirada. Entre novamente.'}[e.message]||('Não foi possível concluir: '+e.message);
      return toast(msg,'err');
    }
  }

  // Sem sessão: dados de demonstração, apenas no ecrã.
  const p=aplicarDestaque(item,DEST_SEL);
  closeModal();
  if(!p)return toast('Não foi possível aplicar o destaque','err');
  toast(`Destaque ativo durante ${p.dias} dias`,'ok2');
  go(P.route);
}

V.faturacao=()=>{
  const r=R();
  // itens da conta que podem ser destacados, conforme o papel
  const itens=P.role==='empresa'?VAGAS.filter(v=>v.status==='live').map(v=>({t:'vaga',id:v.id,n:v.role,o:v}))
    :P.role==='anunciante'?ANUNCIOS.filter(a=>a.status==='live').map(a=>({t:'anuncio',id:a.id,n:a.title,o:a}))
    :P.role==='organizador'?MEUS_EVENTOS.filter(e=>e.status==='live').map(e=>({t:'evento',id:e.id,n:e.title,o:e}))
    :[];
  const ativos=itens.filter(i=>destaqueAtivo(i.o));
  const gasto=COMPRAS.reduce((s,c)=>s+parseInt(c.valor,10),0);
  const rows=COMPRAS.map(c=>`<tr><td class="fw6">${esc(c.id)}</td><td class="muted fs-sm">${esc(c.data)}</td>
    <td class="fs-sm">${esc(c.item)}</td><td class="fs-sm">${esc(c.periodo)}</td><td class="num fw6">${esc(c.valor)}</td>
    <td><span class="pill pill-ok"><i class="dot"></i>${esc(c.estado)}</span></td>
    <td><div class="t-actions"><button class="btn btn-quiet btn-icon" onclick="toast('Recibo ${esc(c.id)} descarregado')">${svg('dl')}</button></div></td></tr>`).join('');

  return `${head('Destaques','A conta é gratuita. Só paga quando escolher destacar um anúncio.')}

  <div class="grid g3 mb24">
    ${statTile('Conta','Gratuita','shield','var(--sage)')}
    ${statTile('Destaques ativos',ativos.length,'star','var(--gold)')}
    ${statTile('Gasto total',gasto+'€','card',r.accent)}
  </div>

  <div class="callout callout-sage mb24">${svg('info')}<div><b>Não há mensalidade.</b> Registar a empresa, publicar anúncios e receber contactos é gratuito e sem limite. O pagamento existe apenas quando decide destacar um anúncio, é único e não renova sozinho.</div></div>

  <div class="section-head mb16"><div><div class="eyebrow mb4">Em curso</div><div class="h3">Destaques ativos</div></div></div>
  ${ativos.length?`<div class="stack gap8 mb24">${ativos.map(i=>{const d=destaqueAtivo(i.o);
    return `<div class="card card-pad row between wrap gap12" style="padding:14px 18px">
      <div class="row gap12"><div class="av av-md" style="background:var(--gold-soft);color:var(--gold);border-radius:12px">${svg('star')}</div>
      <div><div class="fw6">${esc(i.n)}</div><div class="muted fs-sm">Termina a ${fmtCurto(d.ate)} · pacote de ${d.dias} dias</div></div></div>
      <div class="row gap8"><span class="pill pill-boost">${svg('star')}faltam ${d.faltam} ${d.faltam===1?'dia':'dias'}</span>
      <button class="btn btn-ghost btn-sm" onclick="modalDestaque('${i.t}','${i.id}')">Prolongar</button></div>
    </div>`}).join('')}</div>`
  :`<div class="card card-pad mb24"><p class="muted fs-sm">Nenhum anúncio destacado neste momento. Os seus anúncios continuam publicados normalmente.</p>
     ${itens.length?`<button class="btn btn-boost btn-sm mt12" onclick="modalDestaque('${itens[0].t}','${itens[0].id}')">${svg('star')} Destacar um anúncio</button>`:''}</div>`}

  <div class="section-head mb16"><div><div class="eyebrow mb4">Preços</div><div class="h3">Períodos disponíveis</div></div></div>
  <div class="grid g3 mb24">
    ${DESTAQUES.map(d=>`<div class="card card-pad" style="position:relative">
      ${d.popular?`<span class="pill pill-boost" style="position:absolute;top:14px;right:14px">Mais escolhido</span>`:''}
      <div class="num" style="font-size:2rem;color:var(--accent)">${d.preco}€</div>
      <div class="fw6 mt4">${d.nome}</div>
      <div class="muted fs-sm mt4">${esc(d.desc)}</div>
      <div class="muted fs-xs mt12">Pagamento único · sem renovação</div>
    </div>`).join('')}
  </div>

  ${tableWrap('Compras de destaque',`${COMPRAS.length} ${COMPRAS.length===1?'registo':'registos'}`,['Nº','Data','Anúncio','Período','Valor','Estado',''],rows)}

  <div class="card card-pad mt24">
    <div class="h3 mb4">Método de pagamento</div><p class="muted fs-sm mb16">Usado apenas quando confirma um destaque. Não há cobranças automáticas.</p>
    <div class="card card-pad row gap12" style="padding:14px;background:var(--surface-2)">
      ${svg('card')}<div style="flex:1"><div class="fw6 fs-sm">Cartão terminado em 4821</div><div class="muted fs-xs">Validade 09/28</div></div>
      <button class="btn btn-quiet btn-xs" onclick="toast('Alteração de cartão por implementar')">Alterar</button>
    </div>
    <div class="callout callout-info mt16">${svg('info')}<div>Os dados de pagamento são tratados por um fornecedor certificado. A KEVIMA não guarda o número do seu cartão.</div></div>
  </div>`;
};

applyTheme();applyAccent();renderShell();go(P.route||'dash');
sbInit();   // assíncrono: o painel já está utilizável

   na app, que já traz a categoria: /painel?registar=1&cat=Advogados */
if(/[?&]registar=1/.test(location.search))setTimeout(()=>{
  const c=new URLSearchParams(location.search).get('cat');
  registarEmpresa(CATEGORIAS.includes(c)?c:null);
},320);
el('scrim').addEventListener('click',()=>{if(RECUPERACAO)return;closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
