<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EF">
<title>Bússola · Painel profissional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BÚSSOLA · PAINÉIS (profissional · empresa · anunciante · organizador)
   ============================================================ */
:root{
  --paper:#F7F4EF; --surface:#FDFCFA; --surface-2:#F1ECE3; --surface-3:#E9E3D7;
  --ink:#1C1A16; --ink-2:#57534A; --ink-3:#8A8478; --line:#E7E1D6; --line-2:#EFEAE0;
  --clay:#C25A3A; --clay-deep:#A8432A; --clay-soft:#F3E4DB; --clay-tint:#FBF1EB;
  --sage:#3E6B5A; --sage-soft:#E4EEE8; --gold:#B4842B; --gold-soft:#F6EDD8;
  --sky:#37618E; --sky-soft:#E3EAF2; --danger:#B23A2E; --danger-soft:#F6E3E0;
  --accent:var(--clay); --accent-soft:var(--clay-soft); --accent-tint:var(--clay-tint);
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px; --r-full:999px;
  --sh-sm:0 1px 2px rgba(28,26,22,.05); --sh:0 4px 20px -8px rgba(28,26,22,.16); --sh-lg:0 24px 60px -20px rgba(28,26,22,.26);
  --nav-w:252px; --max:1280px; --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --paper:#16140F; --surface:#1E1B15; --surface-2:#26221A; --surface-3:#2F2A21;
  --ink:#F3EFE6; --ink-2:#B8B2A4; --ink-3:#867F70; --line:#302B22; --line-2:#2A251D;
  --clay:#E0794F; --clay-deep:#C25A3A; --clay-soft:#3A2419; --clay-tint:#241812;
  --sage:#6FA98F; --sage-soft:#1E2C25; --gold:#D0A150; --gold-soft:#2B2415;
  --sky:#6E9CCB; --sky-soft:#1B2531; --danger:#E27366; --danger-soft:#331B18;
  --sh-sm:0 1px 2px rgba(0,0,0,.3); --sh:0 6px 24px -8px rgba(0,0,0,.5); --sh-lg:0 24px 60px -20px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.15;letter-spacing:-.02em}
.h1{font-size:clamp(1.5rem,3vw,2rem)} .h2{font-size:1.35rem} .h3{font-size:1.06rem;font-weight:600}
.eyebrow{font-family:var(--sans);font-size:.7rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)} .fw6{font-weight:600} .fw5{font-weight:550}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:inherit;text-decoration:none}
.i{width:1.15em;height:1.15em;flex:none;vertical-align:middle}
svg{stroke-linecap:round;stroke-linejoin:round}

.btn{font-family:var(--sans);font-size:.86rem;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.62em 1.05em;border-radius:var(--r-full);border:1px solid transparent;cursor:pointer;transition:transform .16s var(--ease),background .18s,border-color .18s,color .18s;white-space:nowrap;background:none;color:var(--ink);line-height:1}
.btn:active{transform:scale(.97)} .btn .i{width:1.1em;height:1.1em}
.btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{filter:brightness(.93)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)} .btn-ghost:hover{border-color:var(--ink-3)}
.btn-quiet{background:transparent;color:var(--ink-2)} .btn-quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn-sage{background:var(--sage-soft);color:var(--sage)} .btn-sage:hover{background:var(--sage);color:#fff}
.btn-danger{background:var(--danger-soft);color:var(--danger)} .btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:.46em .8em;font-size:.8rem} .btn-xs{padding:.34em .62em;font-size:.75rem}
.btn-icon{padding:.5em;width:2.3em;height:2.3em;border-radius:var(--r)} .btn-block{width:100%}

.pill{display:inline-flex;align-items:center;gap:.4em;font-size:.72rem;font-weight:600;padding:.3em .6em;border-radius:var(--r-full);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-ok{background:var(--sage-soft);color:var(--sage)}
.pill-pend{background:var(--gold-soft);color:var(--gold)}
.pill-anal{background:var(--sky-soft);color:var(--sky)}
.pill-rej{background:var(--danger-soft);color:var(--danger)}
.pill-off{background:var(--surface-3);color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:.35em;font-size:.72rem;font-weight:550;padding:.28em .58em;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

.shell{display:flex;min-height:100vh}
.sidebar{width:var(--nav-w);flex:none;position:fixed;inset:0 auto 0 0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.sb-brand{display:flex;align-items:center;gap:.55em;padding:16px 16px 10px;font-family:var(--serif);font-size:1.15rem;font-weight:600}
/* selector de papel */
.role-sel{margin:0 12px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:9px 11px;cursor:pointer;position:relative;transition:border-color .18s}
.role-sel:hover{border-color:var(--ink-3)}
.role-sel .rl{font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.role-sel .rn{font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:.4em;margin-top:2px}
.role-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);z-index:60;overflow:hidden;display:none}
.role-menu.on{display:block}
.role-menu>div{padding:10px 12px;font-size:.84rem;display:flex;align-items:center;gap:.6em;cursor:pointer;line-height:1.25}
.role-menu>div:hover{background:var(--surface-2)}
.role-menu>div>div{min-width:0}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px 16px}
.sb-item{display:flex;align-items:center;gap:.7em;padding:.56em .7em;border-radius:var(--r);color:var(--ink-2);font-weight:500;font-size:.86rem;cursor:pointer;transition:all .14s var(--ease);margin-bottom:1px}
.sb-item .i{width:17px;height:17px;opacity:.8}
.sb-item:hover{background:var(--surface-2);color:var(--ink)}
.sb-item.on{background:var(--ink);color:var(--paper)} .sb-item.on .i{opacity:1}
.sb-item .c{margin-left:auto;font-size:.68rem;font-weight:700;background:var(--accent);color:#fff;min-width:17px;height:17px;padding:0 5px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center}
.sb-item.on .c{background:var(--paper);color:var(--ink)}
.sb-foot{border-top:1px solid var(--line);padding:10px}
.sb-user{display:flex;align-items:center;gap:.6em;padding:.5em;border-radius:var(--r)}

.main{flex:1;margin-left:var(--nav-w);min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 84%,transparent);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 clamp(16px,3vw,30px)}
.content{flex:1;padding:clamp(18px,3vw,30px);max-width:var(--max);width:100%;margin:0 auto;animation:fadeUp .4s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}

.av{border-radius:var(--r-full);object-fit:cover;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink-2);overflow:hidden}
.av-xs{width:26px;height:26px;font-size:.66rem}
.av-sm{width:34px;height:34px;font-size:.76rem}
.av-md{width:44px;height:44px;font-size:.9rem}
.av-lg{width:64px;height:64px;font-size:1.2rem;font-family:var(--serif)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.card-pad{padding:20px}
.card-hover{cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s var(--ease)}
.card-hover:hover{border-color:var(--ink-3);box-shadow:var(--sh);transform:translateY(-2px)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;align-items:center} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column} .flex1{flex:1} .mla{margin-left:auto}
.section{margin-top:24px} .divider{height:1px;background:var(--line);border:0}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap16{gap:16px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.fs-sm{font-size:.82rem}.fs-xs{font-size:.74rem}.tc{text-align:center}.tr{text-align:right}
.clay{color:var(--clay)}.sage{color:var(--sage)}.danger{color:var(--danger)}.sky{color:var(--sky)}.gold{color:var(--gold)}
.accent{color:var(--accent)}.hide{display:none!important}
.line-clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.stat{padding:18px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);position:relative}
.stat .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat .v{font-family:var(--serif);font-size:1.8rem;font-weight:600;line-height:1;letter-spacing:-.02em}
.stat .l{color:var(--ink-3);font-size:.8rem;margin-top:5px}
.stat .d{position:absolute;top:18px;right:18px;font-size:.74rem;font-weight:650}
.up{color:var(--sage)} .down{color:var(--danger)}

/* tabelas */
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead th{text-align:left;font-size:.68rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.t-actions{display:flex;gap:5px;justify-content:flex-end}
.tbl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}

.input,.select{font-family:var(--sans);font-size:.86rem;color:var(--ink);width:100%;padding:.6em .85em;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .16s,box-shadow .16s}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:.35em;margin-bottom:12px}
.field label{font-size:.78rem;font-weight:550;color:var(--ink-2)}
textarea.input{resize:vertical;min-height:80px}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap .i{position:absolute;left:12px;width:16px;height:16px;color:var(--ink-3);pointer-events:none}
.search-wrap .input{padding-left:36px}

.chip{display:inline-flex;align-items:center;gap:.35em;font-size:.78rem;font-weight:500;padding:.4em .8em;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.65em .95em;font-weight:550;font-size:.86rem;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--accent)}

/* KANBAN candidaturas */
.kan{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kan-col{background:var(--surface-2);border-radius:var(--r-lg);padding:10px;min-height:120px}
.kan-col h4{font-family:var(--sans);font-size:.74rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:2px 4px 10px;display:flex;justify-content:space-between}
.kan-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:8px;cursor:pointer;transition:box-shadow .18s,transform .18s var(--ease)}
.kan-card:hover{box-shadow:var(--sh);transform:translateY(-1px)}

/* AGENDA / calendário */
.agenda{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ag-day{background:var(--surface-2);border-radius:var(--r);padding:10px;min-height:150px}
.ag-day .dh{text-align:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.ag-day .dh .dn{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.ag-day .dh .dd{font-family:var(--serif);font-size:1.2rem;font-weight:600}
.ag-day.today .dh .dd{color:var(--accent)}
.slot{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:7px 8px;margin-top:8px;font-size:.75rem;cursor:pointer;transition:transform .15s}
.slot:hover{transform:translateX(2px)}
.slot .st{font-weight:650} .slot .sn{color:var(--ink-3);font-size:.7rem}

/* MENSAGENS */
.msg-wrap{display:grid;grid-template-columns:290px 1fr;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);height:calc(100vh - 190px);min-height:440px}
.conv-list{border-right:1px solid var(--line);overflow-y:auto}
.conv{display:flex;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .14s}
.conv:hover{background:var(--surface-2)}
.conv.on{background:var(--accent-tint);border-left:3px solid var(--accent);padding-left:11px}
.conv .cn{font-weight:600;font-size:.85rem;display:flex;justify-content:space-between;gap:6px}
.conv .cp{color:var(--ink-3);font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;flex:none;align-self:center}
.thread{display:flex;flex-direction:column;min-width:0}
.thread-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.thread-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.bub{max-width:74%;padding:10px 13px;border-radius:16px;font-size:.86rem;line-height:1.45;position:relative}
.bub .tm{font-size:.66rem;opacity:.6;margin-top:4px}
.bub.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.bub.me{background:var(--accent);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.bub.auto{background:var(--sage-soft);color:var(--sage);align-self:center;font-size:.78rem;max-width:88%;text-align:center;border-radius:10px}
.composer{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border:1px solid var(--line);border-radius:16px;padding:9px 13px;font-family:var(--sans);font-size:.86rem;resize:none;background:var(--surface);color:var(--ink);max-height:110px;min-height:38px}
.composer textarea:focus{outline:none;border-color:var(--accent)}

.callout{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);font-size:.84rem;line-height:1.5}
.callout .i{width:18px;height:18px;flex:none;margin-top:1px}
.callout-info{background:var(--sky-soft);color:var(--sky)}
.callout-warn{background:var(--gold-soft);color:var(--gold)}
.callout-sage{background:var(--sage-soft);color:var(--sage)}
.callout-accent{background:var(--accent-tint);color:var(--accent)}

.progrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.progrow .pl{width:130px;font-size:.82rem;flex:none}
.progrow .pt{flex:1;height:8px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden}
.progrow .pt i{display:block;height:100%;background:var(--accent);border-radius:var(--r-full);transition:width .8s var(--ease)}
.progrow .pv{width:48px;text-align:right;font-size:.8rem;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b .bar{width:100%;max-width:32px;background:var(--accent);border-radius:5px 5px 2px 2px}
.bars .b .lb{font-size:.66rem;color:var(--ink-3)}

.state{text-align:center;padding:48px 20px;max-width:400px;margin:0 auto}
.state .ill{width:52px;height:52px;margin:0 auto 14px;color:var(--ink-3);opacity:.6}
.state .ill svg{width:100%;height:100%}

.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:.8em 1.15em;border-radius:var(--r-full);font-size:.86rem;font-weight:500;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:.55em;animation:tin .35s var(--ease)}
.toast.err{background:var(--danger)} .toast.ok2{background:var(--sage)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:rgba(20,17,12,.44);backdrop-filter:blur(3px);z-index:100;opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:110;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-lg);width:min(560px,94vw);max-height:88vh;overflow-y:auto;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:all .3s var(--ease)}
.modal.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.modal-pad{padding:24px} .modal-x{position:absolute;top:14px;right:14px}

.menu-btn{display:none}
@media (max-width:960px){
  .sidebar{transform:translateX(-100%);transition:transform .3s var(--ease);box-shadow:var(--sh-lg)}
  .sidebar.open{transform:none}
  .main{margin-left:0} .menu-btn{display:inline-flex}
  .g4{grid-template-columns:repeat(2,1fr)} .g3,.g2{grid-template-columns:1fr}
  .content{padding:16px}
  .msg-wrap{grid-template-columns:1fr;height:auto}
  .conv-list{border-right:0;border-bottom:1px solid var(--line);max-height:220px}
  .thread-body{min-height:300px}
  .agenda{grid-template-columns:1fr;gap:10px} .ag-day{min-height:auto}
  .modal{top:auto;bottom:0;left:0;transform:translateY(100%);width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;max-width:100%}
  .modal.on{transform:translateY(0)}
  .hide-m,.lbl-m{display:none!important}
}
@media (max-width:560px){.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="scrim" class="scrim"></div>
<div id="modal" class="modal"><div id="modalBody"></div></div>
<div id="toasts" class="toasts"></div>
<script>

function toast(msg,type){const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.innerHTML=`${type==='err'?svg('warn'):svg('check')}<span>${esc(msg)}</span>`;el('toasts').appendChild(t);setTimeout(()=>{t.style.transition='opacity .3s,transform .3s';t.style.opacity='0';t.style.transform='translateY(10px)';setTimeout(()=>t.remove(),300)},2600)}
function openModal(h){el('modalBody').innerHTML=h;el('modal').classList.add('on');el('scrim').classList.add('on');document.body.style.overflow='hidden'}
function closeModal(){el('modal').classList.remove('on');el('scrim').classList.remove('on');document.body.style.overflow=''}
function pill(s){const M={live:['pill-ok','Publicado'],ok:['pill-ok','Ativo'],draft:['pill-off','Rascunho'],pend:['pill-pend','Em aprovação'],novo:['pill-anal','Novo'],aceite:['pill-ok','Aceite'],concluido:['pill-off','Concluído']};const[c,l]=M[s]||['pill-off',s];return `<span class="pill ${c}"><i class="dot"></i>${l}</span>`}

  el('sidebar').innerHTML=`
    <div class="sb-brand">${mark(24)} <span>Bússola</span></div>
    <div class="role-sel" onclick="event.stopPropagation();el('roleMenu').classList.toggle('on')">
      <div class="rl">A ver como</div>
      <div class="rn"><span style="color:${r.accent}">${svg(r.ic)}</span>${esc(r.who)} <span class="mla muted">${svg('chevd')}</span></div>
      <div class="role-menu" id="roleMenu">
        ${Object.values(ROLES).map(x=>`<div onclick="event.stopPropagation();setRole('${x.id}')"><span style="color:${x.accent}">${svg(x.ic)}</span>
          <div><div class="fw6">${esc(x.who)}</div><div class="muted fs-xs">${esc(x.label)}</div></div>
          ${x.id===P.role?`<span class="mla" style="color:${x.accent}">${svg('check')}</span>`:''}</div>`).join('')}
      </div>
    </div>
    <nav class="sb-nav">
      ${NAVS[P.role].map(n=>`<div class="sb-item ${P.route===n.r?'on':''}" data-r="${n.r}" onclick="go('${n.r}')">${svg(n.ic)}<span>${n.l}</span>${n.c&&n.c()?`<span class="c">${n.c()}</span>`:''}</div>`).join('')}
    </nav>
    <div class="sb-foot">
      <div class="sb-item" onclick="toggleTheme()">${svg(P.theme==='dark'?'sun':'moon')}<span>${P.theme==='dark'?'Tema claro':'Tema escuro'}</span></div>
      <div class="sb-user">
        <div class="av av-sm" style="background:${r.accent};color:#fff">${initials(r.who)}</div>
        <div style="line-height:1.2;min-width:0"><div class="fw6 fs-sm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.who)}</div><div class="muted fs-xs">${esc(r.label)}</div></div>
      </div>
    </div>`;
  el('topbar').innerHTML=`
    <button class="btn btn-ghost btn-icon menu-btn" onclick="el('sidebar').classList.toggle('open')">${svg('menu')}</button>
    <div class="row gap8 hide-m"><span class="pill pill-ok"><i class="dot"></i>Perfil verificado</span>
      <span class="muted fs-sm">${esc(r.plan)}</span></div>
    <div class="row gap8 mla">
      <button class="btn btn-quiet btn-icon" onclick="go('msgs')" style="position:relative">${svg('chat')}${unread()?`<span style="position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:2px solid var(--paper)"></span>`:''}</button>
      <button class="btn btn-primary btn-sm" onclick="primaryAction()" title="${primaryLabel()}">${svg('plus')}<span class="lbl-m">${primaryLabel()}</span></button>
    </div>`;
}
function mark(s){return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="var(--accent)" stroke-width="2.6"/><path d="M26 14l-4 9-9 4 4-9z" fill="var(--accent)"/><circle cx="20" cy="20" r="2" fill="var(--surface)"/></svg>`}
function primaryLabel(){return {pro:'Nova consulta',empresa:'Nova vaga',anunciante:'Novo anúncio',organizador:'Novo evento'}[P.role]}
function primaryAction(){({pro:newConsulta,empresa:newVaga,anunciante:newAnuncio,organizador:newEvento})[P.role]()}
function setRole(id){P.role=id;P.route='dash';P.conv=(CONVS[id][0]||{}).id;applyAccent();save();renderShell();go('dash');toast('A ver o painel de '+ROLES[id].who)}
document.addEventListener('click',()=>{const m=el('roleMenu');if(m)m.classList.remove('on')});

const V={};
function go(route){
  P.route=route;save();closeModal();
  if(window.innerWidth<=960)el('sidebar').classList.remove('open');
  $$('.sb-item[data-r]').forEach(i=>i.classList.toggle('on',i.dataset.r===route));
  const key=P.role+':'+route;
  const fn=V[key]||V[route]||V[P.role+':dash'];
  el('view').innerHTML=fn?fn():'';
  window.scrollTo(0,0);
  el('view').style.animation='none';void el('view').offsetWidth;el('view').style.animation='';
  if(route==='msgs')setTimeout(scrollThread,30);
}
function head(t,s,a){return `<div class="page-head"><div><h1 class="h1">${esc(t)}</h1>${s?`<p class="muted mt4">${esc(s)}</p>`:''}</div>${a?`<div class="row gap8 wrap">${a}</div>`:''}</div>`}
function statTile(l,v,ic,c,d){return `<div class="stat">${d?`<div class="d ${d[0]==='+'?'up':'down'}">${d}</div>`:''}
  <div class="ic" style="background:color-mix(in srgb,${c} 14%,transparent);color:${c}">${svg(ic)}</div>
  <div class="v">${v}</div><div class="l">${l}</div></div>`}
function tableWrap(title,meta,cols,rows,tools){
  return `<div class="tbl-wrap"><div class="tbl-head"><div><div class="fw6">${esc(title)}</div><div class="muted fs-xs">${esc(meta)}</div></div>${tools?`<div class="row gap6 wrap">${tools}</div>`:''}</div>
    <div class="tbl-scroll"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows||`<tr><td colspan="${cols.length}"><div class="tc muted" style="padding:32px 0">Sem registos.</div></td></tr>`}</tbody></table></div></div>`;
}
function emptyState(ic,t,m,cta){return `<div class="state"><div class="ill">${svg(ic)}</div><h3 class="h3 mb4">${esc(t)}</h3><p class="muted mb16">${esc(m)}</p>${cta||''}</div>`}

V.msgs=()=>{
  const list=CONVS[P.role]||[];
  if(!list.length)return head('Mensagens','')+emptyState('chat','Ainda sem conversas','Quando alguém o contactar, a conversa aparece aqui.','');
  if(!list.find(c=>c.id===P.conv))P.conv=list[0].id;
  const c=list.find(x=>x.id===P.conv);
  return `${head('Mensagens','Conversas com pessoas que o contactaram através da Bússola')}
  <div class="msg-wrap">
    <div class="conv-list">
      ${list.map(x=>`<div class="conv ${x.id===P.conv?'on':''}" onclick="openConv('${x.id}')">
        <div class="av av-sm">${x.country}</div>
        <div style="flex:1;min-width:0"><div class="cn"><span>${esc(x.who)}</span>${x.unread?'<span class="unread-dot"></span>':''}</div>
        <div class="cp">${esc(x.ctx)}</div>
        <div class="cp">${esc((x.msgs[x.msgs.length-1]||{}).t||'')}</div></div>
      </div>`).join('')}
    </div>
    <div class="thread">
      <div class="thread-head">
        <div class="av av-sm">${c.country}</div>
        <div style="flex:1;min-width:0"><div class="fw6 fs-sm">${esc(c.who)}</div><div class="muted fs-xs">${esc(c.ctx)}</div></div>
        <button class="btn btn-quiet btn-icon" title="Bloquear" onclick="blockConv()">${svg('ban')}</button>
        <button class="btn btn-quiet btn-icon" title="Denunciar" onclick="reportConv()">${svg('flag')}</button>
      </div>
      <div class="thread-body" id="threadBody">
        ${c.msgs.map(m=>m.s==='auto'?`<div class="bub auto">${svg('info')} ${esc(m.t)}</div>`
          :`<div class="bub ${m.s==='me'?'me':'them'}">${esc(m.t)}${m.tm?`<div class="tm">${esc(m.tm)}</div>`:''}</div>`).join('')}
      </div>
      <div class="composer">
        <button class="btn btn-quiet btn-icon" onclick="toast('Anexos disponíveis na versão final')">${svg('clip')}</button>
        <textarea id="msgIn" placeholder="Escreva a sua mensagem…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
        <button class="btn btn-primary btn-icon" onclick="sendMsg()">${svg('send')}</button>
      </div>
    </div>
  </div>`;
};
function openConv(id){P.conv=id;const c=(CONVS[P.role]||[]).find(x=>x.id===id);if(c)c.unread=0;save();renderShell();go('msgs')}
function scrollThread(){const b=el('threadBody');if(b)b.scrollTop=b.scrollHeight}
function sendMsg(){
  const inp=el('msgIn');if(!inp)return;const t=inp.value.trim();if(!t)return;
  const c=(CONVS[P.role]||[]).find(x=>x.id===P.conv);if(!c)return;
  const now=new Date();c.msgs.push({s:'me',t,tm:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')});
  inp.value='';go('msgs');toast('Mensagem enviada ✓','ok2');
}

  const r=R();
  const rows=FATURAS.map(f=>`<tr><td class="fw6">${esc(f.id)}</td><td class="muted fs-sm">${esc(f.date)}</td>
    <td class="fs-sm">${esc(f.desc)}</td><td class="num fw6">${esc(f.amount)}</td>
    <td><span class="pill pill-ok"><i class="dot"></i>${esc(f.st)}</span></td>
    <td><div class="t-actions"><button class="btn btn-quiet btn-icon" onclick="toast('Fatura ${esc(f.id)} descarregada')">${svg('dl')}</button></div></td></tr>`).join('');
  return `${head('Faturação','O seu plano e histórico de pagamentos')}
  <div class="grid g2 mb24" style="align-items:start">
    <div class="card card-pad" style="border-color:var(--accent-soft);background:var(--accent-tint)">
      <div class="eyebrow mb4" style="color:${r.accent}">Plano atual</div>
      <div class="h2 mb8">${esc(r.plan.split(' · ')[0])}</div>
      <div class="num mb16" style="font-size:2rem;color:${r.accent}">${esc(r.plan.split(' · ')[1])}</div>
      <div class="stack gap6 mb16">
        ${{pro:['Perfil público no diretório','Pedidos de consulta ilimitados','Agenda e mensagens','Selo de verificação'],
           empresa:['Vagas ilimitadas','Acesso a candidatos','Mensagens e estatísticas','Perfil de empresa'],
           anunciante:['Até 20 anúncios ativos','Destaque na pesquisa','Contactos ilimitados','Estatísticas por anúncio'],
           organizador:['Eventos ilimitados','Gestão de participantes','Página de organizador','Estatísticas de alcance']}[P.role]
          .map(x=>`<div class="row gap8 fs-sm"><span style="color:${r.accent};width:16px">${svg('check')}</span>${x}</div>`).join('')}
      </div>
      <div class="row gap8"><button class="btn btn-ghost btn-sm flex1" onclick="toast('Gestão de subscrição (demonstração)')">Gerir subscrição</button>
      <button class="btn btn-quiet btn-sm" onclick="cancelSub()">Cancelar</button></div>
    </div>
    <div class="card card-pad">
      <div class="h3 mb4">Método de pagamento</div><p class="muted fs-sm mb16">Próxima cobrança a 10 de setembro de 2026.</p>
      <div class="card card-pad row gap12" style="padding:14px;background:var(--surface-2)">
        ${svg('card')}<div style="flex:1"><div class="fw6 fs-sm">Cartão terminado em 4821</div><div class="muted fs-xs">Validade 09/28</div></div>
        <button class="btn btn-quiet btn-xs" onclick="toast('Alteração de método de pagamento (demonstração)')">Alterar</button>
      </div>
      <div class="callout callout-info mt16">${svg('info')}<div>Os dados de pagamento são tratados por um fornecedor certificado. A Bússola não guarda o número do seu cartão.</div></div>
    </div>
  </div>
  ${tableWrap('Faturas',`${FATURAS.length} documentos`,['Nº','Data','Descrição','Valor','Estado',''],rows)}`;
};
function cancelSub(){openModal(`<div class="modal-pad"><button class="btn btn-quiet btn-icon modal-x" onclick="closeModal()">${svg('x')}</button>
  <h2 class="h2 mb8">Cancelar subscrição?</h2><p class="muted mb24">O seu perfil deixa de aparecer na pesquisa no fim do período já pago. Os seus dados são mantidos caso queira voltar.</p>
  <div class="row gap8"><button class="btn btn-ghost flex1" onclick="closeModal()">Manter plano</button>
  <button class="btn btn-danger flex1" onclick="closeModal();toast('Subscrição cancelada no fim do período','err')">Cancelar</button></div></div>`)}

/* ============================================================
   ARRANQUE
   ============================================================ */
applyTheme();applyAccent();renderShell();go(P.route||'dash');
el('scrim').addEventListener('click',closeModal);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
</body>
</html>
