<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EF">
<title>KEVIMA — your new life, connected</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   KEVIMA — Design System
   Editorial · premium · humano · calmo
   ============================================================ */

/* ---- Tokens ---- */
:root{
  /* Paper & ink (warm neutrals) */
  --paper:#F7F4EF;            /* app background */
  --surface:#FDFCFA;          /* cards */
  --surface-2:#F1ECE3;        /* subtle fill */
  --ink:#1C1A16;             /* primary text */
  --ink-2:#57534A;           /* secondary text */
  --ink-3:#8A8478;           /* muted / captions */
  --line:#E7E1D6;            /* borders */
  --line-2:#EFEAE0;

  /* Accent — terracota (humano, terroso, sem clichê de bandeira) */
  --clay:#C25A3A;
  --clay-deep:#A8432A;
  --clay-soft:#F3E4DB;
  --clay-tint:#FBF1EB;

  /* Suporte */
  --sage:#3E6B5A;            /* progresso / verificado */
  --sage-soft:#E4EEE8;
  --gold:#B4842B;            /* destaque quente */
  --sky:#37618E;            /* links de entidades oficiais */
  --danger:#B23A2E;
  --danger-soft:#F6E3E0;

  /* Tipografia */
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;

  /* Raio & sombra (moderados) */
  --r-sm:8px; --r:14px; --r-lg:20px; --r-xl:28px; --r-full:999px;
  --sh-sm:0 1px 2px rgba(28,26,22,.05);
  --sh:0 4px 20px -8px rgba(28,26,22,.14);
  --sh-lg:0 24px 60px -20px rgba(28,26,22,.24);

  /* Espaçamento */
  --nav-w:264px; --header-h:68px; --bottom-h:64px; --max:1180px;

  /* Movimento */
  --ease:cubic-bezier(.22,.61,.36,1);
  --dur:.42s;
}
[data-theme="dark"]{
  --paper:#16140F;
  --surface:#1E1B15;
  --surface-2:#26221A;
  --ink:#F3EFE6;
  --ink-2:#B8B2A4;
  --ink-3:#867F70;
  --line:#302B22;
  --line-2:#2A251D;
  --clay:#E0794F;
  --clay-deep:#C25A3A;
  --clay-soft:#3A2419;
  --clay-tint:#241812;
  --sage:#6FA98F;
  --sage-soft:#1E2C25;
  --gold:#D0A150;
  --sky:#6E9CCB;
  --danger:#E27366;
  --danger-soft:#331b18;
  --sh-sm:0 1px 2px rgba(0,0,0,.3);
  --sh:0 6px 24px -8px rgba(0,0,0,.5);
  --sh-lg:0 24px 60px -20px rgba(0,0,0,.6);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.011em;
  overflow-x:hidden;
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---- Ícones: tamanho base + overrides ---- */
.star.on svg{fill:currentColor}
/* Conversas — mesmas classes do painel, adaptadas às variáveis da app. */
.msg-wrap{display:grid;grid-template-columns:290px 1fr;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);height:calc(100vh - 190px);min-height:440px}
.conv-list{border-right:1px solid var(--line);overflow-y:auto}
.conv{display:flex;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .14s}
.conv:hover{background:var(--surface-2)}
.conv.on{background:var(--accent-tint);border-left:3px solid var(--clay);padding-left:11px}
.conv .cn{font-weight:600;font-size:.85rem;display:flex;justify-content:space-between;gap:6px}
.conv .cp{color:var(--ink-3);font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread-dot{width:8px;height:8px;background:var(--clay);border-radius:50%;flex:none;align-self:center}
.thread{display:flex;flex-direction:column;min-width:0}
.thread-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.thread-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.bub{max-width:74%;padding:10px 13px;border-radius:16px;font-size:.86rem;line-height:1.45;position:relative}
.bub .tm{font-size:.66rem;opacity:.6;margin-top:4px}
.bub.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.bub.me{background:var(--clay);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.bub.auto{background:var(--sage-soft);color:var(--sage);align-self:center;font-size:.78rem;max-width:88%;text-align:center;border-radius:10px}
.composer{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border:1px solid var(--line);border-radius:16px;padding:9px 13px;font-family:var(--sans);font-size:.86rem;resize:none;background:var(--surface);color:var(--ink);max-height:110px;min-height:38px}
.composer textarea:focus{outline:none;border-color:var(--clay)}

.callout{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);font-size:.84rem;line-height:1.5}
@media(max-width:760px){.msg-wrap{grid-template-columns:1fr;height:auto}
 .conv-list{border-right:none;border-bottom:1px solid var(--line);max-height:190px}
 .thread-body{min-height:280px}}
.i{width:1.15em;height:1.15em;flex:none;vertical-align:middle}
.av svg{width:46%;height:46%}
.photo svg.i{width:34px;height:34px}
.state .ill svg{width:100%;height:100%}
.mappin .p svg.i{width:15px;height:15px}

/* ---- Tipografia ---- */
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.12;letter-spacing:-.02em;color:var(--ink)}
.display{font-size:clamp(2.1rem,5.2vw,3.4rem);font-weight:500;line-height:1.04;letter-spacing:-.03em}
.h1{font-size:clamp(1.7rem,3.6vw,2.4rem)}
.h2{font-size:clamp(1.32rem,2.6vw,1.72rem)}
.h3{font-size:1.16rem;font-weight:600}
.eyebrow{font-family:var(--sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.lead{font-size:1.08rem;color:var(--ink-2);line-height:1.5}
.muted{color:var(--ink-3)}
.serif{font-family:var(--serif)}
a{color:inherit;text-decoration:none}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---- Botões ---- */
.btn{
  font-family:var(--sans);font-size:.92rem;font-weight:550;
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:.72em 1.25em;border-radius:var(--r-full);border:1px solid transparent;
  cursor:pointer;transition:transform .18s var(--ease),background .2s,border-color .2s,color .2s,box-shadow .2s;
  white-space:nowrap;background:none;color:var(--ink);line-height:1;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn svg{width:1.15em;height:1.15em;flex:none}
.btn-primary{background:var(--clay);color:#fff;box-shadow:var(--sh-sm)}
.btn-primary:hover{background:var(--clay-deep);box-shadow:var(--sh)}
.btn-dark{background:var(--ink);color:var(--paper)}
.btn-dark:hover{opacity:.9}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn-quiet{background:transparent;color:var(--ink-2)}
.btn-quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn-lg{padding:.92em 1.6em;font-size:1rem}
.btn-sm{padding:.52em .9em;font-size:.82rem}
.btn-block{width:100%}
.btn-icon{padding:.55em;border-radius:var(--r-full);width:2.5em;height:2.5em}

/* ---- Chips / badges ---- */
.chip{
  display:inline-flex;align-items:center;gap:.4em;font-size:.8rem;font-weight:500;
  padding:.42em .82em;border-radius:var(--r-full);background:var(--surface);
  border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:all .18s var(--ease);white-space:nowrap;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:.35em;font-size:.72rem;font-weight:600;padding:.32em .66em;border-radius:var(--r-full);letter-spacing:.01em}
.badge-clay{background:var(--clay-soft);color:var(--clay-deep)}
.badge-sage{background:var(--sage-soft);color:var(--sage)}
.badge-gold{background:#F6EDD8;color:var(--gold)}
.badge-line{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
[data-theme="dark"] .badge-gold{background:#2b2415}
.verified{display:inline-flex;align-items:center;gap:.3em;color:var(--sage);font-weight:600;font-size:.78rem}
.verified svg{width:1em;height:1em}

/* Marca de país. Substitui bandeiras emoji, que não renderizam no Windows
   e variam de forma entre sistemas — isto é idêntico em todo o lado. */
.cc{display:inline-flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--serif);font-size:.66rem;font-weight:600;letter-spacing:.07em;
  min-width:2.05em;height:1.55em;padding:0 .38em;border:1px solid var(--line);
  border-radius:4px;color:var(--ink-2);background:var(--surface);line-height:1}
.cc-lg{font-size:.78rem;min-width:2.3em;height:1.75em}
.av .cc{border:0;background:none;font-size:.72rem;color:inherit}

/* ---- Cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);transition:border-color .2s,box-shadow .2s,transform .2s var(--ease)}
.card-pad{padding:22px}
.card-hover{cursor:pointer}
.card-hover:hover{border-color:var(--ink-3);box-shadow:var(--sh);transform:translateY(-2px)}

/* ---- Inputs ---- */
.field{display:flex;flex-direction:column;gap:.4em;margin-bottom:14px}
.field label{font-size:.82rem;font-weight:550;color:var(--ink-2)}
.input,.select,textarea.input{
  font-family:var(--sans);font-size:.95rem;color:var(--ink);width:100%;
  padding:.78em 1em;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  transition:border-color .18s,box-shadow .18s;
}
.input::placeholder{color:var(--ink-3)}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
textarea.input{resize:vertical;min-height:96px;line-height:1.5}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap svg.ic{position:absolute;left:14px;width:18px;height:18px;color:var(--ink-3);pointer-events:none}
.search-wrap .input{padding-left:42px}

/* ---- Layout ---- */
.app{display:none}
.app.live{display:block}
.shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--nav-w);flex:none;position:fixed;top:0;left:0;bottom:0;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 16px;z-index:40;
}
.brand{display:flex;align-items:center;gap:.6em;padding:6px 8px 22px;font-family:var(--serif);font-size:1.32rem;font-weight:600;letter-spacing:-.02em}
.brand .mark{width:30px;height:30px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-sec{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:16px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:.75em;padding:.66em .8em;border-radius:var(--r);
  color:var(--ink-2);font-weight:500;font-size:.92rem;cursor:pointer;transition:all .16s var(--ease);position:relative;
}
.nav-item svg{width:19px;height:19px;flex:none;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--ink);color:var(--paper)}
.nav-item.on svg{opacity:1}
.nav-item .dot{margin-left:auto;background:var(--clay);color:#fff;font-size:.68rem;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center}
.nav-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.nav-user{display:flex;align-items:center;gap:.6em;padding:.5em;border-radius:var(--r);cursor:pointer}
.nav-user:hover{background:var(--surface-2)}

.main{flex:1;margin-left:var(--nav-w);min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{
  height:var(--header-h);position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 clamp(18px,4vw,40px);
}
.topbar .gsearch{flex:1;max-width:440px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.content{flex:1;padding:clamp(22px,3.5vw,40px) clamp(18px,4vw,40px) 80px;max-width:var(--max);width:100%;margin:0 auto;animation:fadeUp .5s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* mobile bits hidden on desktop */
.mobile-only{display:none!important}
.bottomnav,.mobtop{display:none}

/* ---- Progress ---- */
.pbar{height:7px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--clay);border-radius:var(--r-full);transition:width .8s var(--ease)}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--clay);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}

/* ---- Avatar ---- */
.av{border-radius:var(--r-full);object-fit:cover;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink-2);overflow:hidden}
.av-sm{width:32px;height:32px;font-size:.8rem}
.av-md{width:44px;height:44px;font-size:.95rem}
.av-lg{width:72px;height:72px;font-size:1.4rem;font-family:var(--serif)}

/* ---- Grids ---- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column}
.section{margin-top:40px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.divider{height:1px;background:var(--line);border:0;margin:0}

/* ---- Toast ---- */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{
  background:var(--ink);color:var(--paper);padding:.85em 1.2em;border-radius:var(--r-full);font-size:.9rem;font-weight:500;
  box-shadow:var(--sh-lg);display:flex;align-items:center;gap:.6em;animation:toastIn .4s var(--ease);max-width:90vw;
}
.toast.err{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* ---- Modal / drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(20,17,12,.44);backdrop-filter:blur(3px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{
  position:fixed;z-index:110;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-lg);width:min(560px,94vw);max-height:88vh;overflow-y:auto;
  left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:all .34s var(--ease);
}
.modal.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.modal-pad{padding:26px}
.modal-x{position:absolute;top:16px;right:16px}

/* drawer (mobile filters / detail) */
.drawer{
  position:fixed;z-index:110;background:var(--surface);left:0;right:0;bottom:0;border-radius:var(--r-xl) var(--r-xl) 0 0;
  max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .38s var(--ease);box-shadow:var(--sh-lg);
}
.drawer.on{transform:translateY(0)}
.drawer-grab{width:40px;height:4px;border-radius:var(--r-full);background:var(--line);margin:12px auto 4px}

/* ---- Empty / states ---- */
.state{text-align:center;padding:56px 20px;max-width:420px;margin:0 auto;animation:fadeUp .5s var(--ease)}
.state .ill{width:64px;height:64px;margin:0 auto 18px;color:var(--ink-3);opacity:.7}
.state h3{margin-bottom:8px}
.state p{color:var(--ink-3);margin-bottom:18px}
.skel{background:linear-gradient(100deg,var(--surface-2) 30%,var(--line-2) 50%,var(--surface-2) 70%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:var(--r)}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---- Checklist ---- */
.check-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.check-item:last-child{border-bottom:0}
.check-box{width:22px;height:22px;border:2px solid var(--line);border-radius:7px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.check-box svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.5);transition:all .2s var(--ease)}
.check-item.done .check-box{background:var(--sage);border-color:var(--sage)}
.check-item.done .check-box svg{opacity:1;transform:none}
.check-item.done .ci-label{color:var(--ink-3);text-decoration:line-through}

/* ---- Timeline (plano) ---- */
.tl{position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:14px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-step{position:relative;padding:0 0 26px}
.tl-step:last-child{padding-bottom:0}
.tl-node{position:absolute;left:-34px;top:0;width:30px;height:30px;border-radius:var(--r-full);background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:.82rem;font-weight:600;color:var(--ink-3);z-index:1}
.tl-step.done .tl-node{background:var(--sage);border-color:var(--sage);color:#fff}
.tl-step.now .tl-node{background:var(--clay);border-color:var(--clay);color:#fff;box-shadow:0 0 0 4px var(--clay-soft)}

/* ---- Tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.7em 1em;font-weight:550;font-size:.92rem;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .18s}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);border-color:var(--clay)}

/* ---- Photo blocks ---- */
.photo{background:var(--surface-2);position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
/* galeria do imóvel */
.galeria{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.galeria::-webkit-scrollbar{display:none}
.galeria img{width:64px;height:48px;object-fit:cover;border-radius:8px;flex:none;cursor:pointer;
  border:2px solid transparent;opacity:.65;transition:opacity .18s,border-color .18s}
.galeria img:hover{opacity:1}
.galeria img.on{opacity:1;border-color:var(--clay)}
.thumb{aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}

/* ---- Map ---- */
.mapwrap{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:
  radial-gradient(circle at 30% 20%,rgba(62,107,90,.06),transparent 40%),
  radial-gradient(circle at 70% 70%,rgba(194,90,58,.06),transparent 40%),var(--surface-2)}
.mappin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:transform .2s var(--ease)}
.mappin:hover{transform:translate(-50%,-108%) scale(1.08);z-index:5}
.mappin .p{width:30px;height:30px;border-radius:var(--r-full) var(--r-full) var(--r-full) 2px;background:var(--clay);border:2px solid var(--surface);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;transform:rotate(45deg)}
.mappin .p svg{transform:rotate(-45deg);width:15px;height:15px;color:#fff}

/* ---- Segmented ---- */
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-full);padding:3px}
.seg button{border:0;background:none;font-family:var(--sans);font-weight:550;font-size:.85rem;color:var(--ink-2);padding:.5em 1em;border-radius:var(--r-full);cursor:pointer;transition:all .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}

/* ---- Command palette ---- */
.cmdk{position:fixed;left:50%;top:12vh;transform:translateX(-50%) translateY(-8px);width:min(600px,94vw);z-index:120;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:all .28s var(--ease);overflow:hidden}
.cmdk.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmdk-in input{border:0;background:none;font-family:var(--sans);font-size:1.05rem;color:var(--ink);width:100%;outline:none}
.cmdk-res{max-height:52vh;overflow-y:auto;padding:8px}
.cmdk-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r);cursor:pointer}
.cmdk-row:hover,.cmdk-row.sel{background:var(--surface-2)}
.cmdk-row .k{margin-left:auto;font-size:.72rem;color:var(--ink-3)}
.cmdk-cat{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:12px 12px 4px}
kbd{font-family:var(--sans);font-size:.72rem;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:.15em .45em;color:var(--ink-2)}

/* ---- Notes / callouts ---- */
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);font-size:.9rem;line-height:1.5}
.callout svg{width:20px;height:20px;flex:none;margin-top:1px}
.callout-warn{background:#F8EEDD;color:#7A5A1E}
[data-theme="dark"] .callout-warn{background:#2a2113;color:var(--gold)}
.callout-info{background:var(--sage-soft);color:var(--sage)}
.callout-clay{background:var(--clay-tint);color:var(--clay-deep)}

.link-official{display:inline-flex;align-items:center;gap:.4em;color:var(--sky);font-weight:550;font-size:.9rem}
.link-official svg{width:1em;height:1em}

/* ---- Onboarding ---- */
/* Abaixo do scrim (100) e do modal (110) de propósito: o ecrã de entrada
   é um overlay sobre a app, mas as caixas de diálogo — como a de entrar
   na conta — têm de aparecer por cima dele. */
.ob{position:fixed;inset:0;z-index:95;background:var(--paper);overflow-y:auto;display:none}
.ob.live{display:block}
.ob-wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:clamp(24px,5vw,48px) 24px}
.ob-top{display:flex;align-items:center;gap:12px;margin-bottom:auto;padding-top:8px}
.ob-prog{flex:1;height:4px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden}
.ob-prog>i{display:block;height:100%;background:var(--clay);transition:width .5s var(--ease)}
.ob-body{margin:auto 0;padding:32px 0;animation:fadeUp .45s var(--ease)}
.ob-body h1{margin-bottom:12px}
.opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;margin-bottom:10px;transition:all .18s var(--ease)}
.opt:hover{border-color:var(--ink-3)}
.opt.on{border-color:var(--clay);background:var(--clay-tint)}
.opt .flag{font-size:1.5rem;line-height:1}
.opt .tick{margin-left:auto;width:22px;height:22px;border-radius:var(--r-full);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:all .2s}
.opt .tick svg{width:13px;height:13px;color:#fff;opacity:0}
.opt.on .tick{background:var(--clay);border-color:var(--clay)}
.opt.on .tick svg{opacity:1}
.ob-foot{padding-top:20px;display:flex;gap:12px;align-items:center}

/* ---- Utilities ---- */
.mt0{margin-top:0}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.mb0{margin-bottom:0}.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.gap4{gap:4px}.gap8{gap:8px}.gap6{gap:6px}.gap16{gap:16px}.gap20{gap:20px}
.fs-sm{font-size:.85rem}.fs-xs{font-size:.78rem}
.fw6{font-weight:600}.fw5{font-weight:550}
.tc{text-align:center}.tr{text-align:right}
.flex1{flex:1}.mla{margin-left:auto}
.hide{display:none!important}
.clay{color:var(--clay)}.sage{color:var(--sage)}
.price{font-family:var(--serif);font-weight:600}
.line-clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scroll-x{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 calc(-1*clamp(18px,4vw,40px));padding-left:clamp(18px,4vw,40px);padding-right:clamp(18px,4vw,40px)}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x>*{flex:none}

/* ============================================================
   ASSISTENTE (camada de IA)
   ============================================================ */
.ai-fab{
  position:fixed;right:22px;bottom:22px;z-index:90;width:56px;height:56px;border-radius:var(--r-full);
  background:var(--ink);color:var(--paper);border:0;cursor:pointer;box-shadow:var(--sh-lg);
  display:flex;align-items:center;justify-content:center;transition:transform .25s var(--ease),background .2s;
}
.ai-fab:hover{transform:scale(1.06)}
.ai-fab:active{transform:scale(.95)}
.ai-fab svg{width:24px;height:24px}

.ai-panel{
  position:fixed;right:22px;bottom:22px;z-index:130;width:min(430px,calc(100vw - 44px));height:min(660px,calc(100vh - 44px));
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;overflow:hidden;
  opacity:0;pointer-events:none;transform:translateY(16px) scale(.97);transform-origin:bottom right;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
}
.ai-panel.on{opacity:1;pointer-events:auto;transform:none}
.ai-head{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--line);flex:none}
.ai-avatar{width:38px;height:38px;border-radius:var(--r-full);background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;flex:none}
.ai-avatar svg{width:19px;height:19px}
.ai-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--paper)}
.ai-foot{flex:none;border-top:1px solid var(--line);padding:12px 14px;background:var(--surface)}
.ai-input{display:flex;gap:8px;align-items:flex-end}
.ai-input textarea{
  flex:1;border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-family:var(--fb,var(--sans,inherit));
  font-size:.92rem;resize:none;background:var(--surface);color:var(--ink);max-height:110px;min-height:40px;line-height:1.4;
}
.ai-input textarea:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}

/* mensagens */
.ai-msg{max-width:88%;font-size:.92rem;line-height:1.55;animation:aiIn .35s var(--ease)}
@keyframes aiIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ai-msg.user{align-self:flex-end;background:var(--clay);color:#fff;padding:10px 14px;border-radius:16px;border-bottom-right-radius:5px}
.ai-msg.bot{align-self:flex-start;width:100%;max-width:100%}
.ai-bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px;padding:14px 16px}
.ai-bubble p+p{margin-top:9px}
.ai-bubble b{font-weight:650}
.ai-bubble ul{list-style:none;margin:10px 0 0;display:flex;flex-direction:column;gap:7px}
.ai-bubble li{display:flex;gap:8px;align-items:flex-start;font-size:.89rem}
.ai-bubble li>span:first-child{color:var(--sage);flex:none;margin-top:2px;width:15px}
.ai-src{display:flex;align-items:center;gap:.4em;font-size:.72rem;color:var(--ink-3);margin-top:10px;padding-top:9px;border-top:1px solid var(--line-2)}
.ai-src svg{width:13px;height:13px}

/* cartões de resultado dentro da resposta */
.ai-cards{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.ai-card{display:flex;gap:11px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer;transition:border-color .18s,transform .18s var(--ease)}
.ai-card:hover{border-color:var(--ink-3);transform:translateX(2px)}
.ai-card .aic-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface);color:var(--ink-2)}
.ai-card .aic-ic svg{width:17px;height:17px}
.ai-card .aic-t{font-weight:600;font-size:.87rem;line-height:1.25}
.ai-card .aic-s{font-size:.76rem;color:var(--ink-3);line-height:1.3}

/* acções */
.ai-acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.ai-act{font-size:.82rem;font-weight:550;padding:.52em .95em;border-radius:var(--r-full);background:var(--ink);color:var(--paper);border:0;cursor:pointer;display:inline-flex;align-items:center;gap:.4em;transition:opacity .18s,transform .16s var(--ease)}
.ai-act:hover{opacity:.88} .ai-act:active{transform:scale(.96)}
.ai-act svg{width:14px;height:14px}
.ai-act.soft{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.ai-act.soft:hover{border-color:var(--ink-3)}

/* aviso jurídico dentro da resposta */
.ai-warn{display:flex;gap:9px;padding:11px 13px;border-radius:var(--r);font-size:.82rem;line-height:1.45;margin-top:11px;background:var(--clay-tint);color:var(--clay-deep)}
.ai-warn svg{width:16px;height:16px;flex:none;margin-top:2px}
.ai-note{display:flex;gap:9px;padding:11px 13px;border-radius:var(--r);font-size:.82rem;line-height:1.45;margin-top:11px;background:var(--sage-soft);color:var(--sage)}
.ai-note svg{width:16px;height:16px;flex:none;margin-top:2px}

/* sugestões */
.ai-sugs{display:flex;flex-wrap:wrap;gap:7px}
.ai-sug{font-size:.82rem;padding:.5em .9em;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:all .18s var(--ease);text-align:left}
.ai-sug:hover{border-color:var(--clay);color:var(--clay);background:var(--clay-tint)}

/* a escrever */
.ai-typing{display:flex;gap:4px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px;width:fit-content}
.ai-typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:aiDot 1.3s infinite}
.ai-typing i:nth-child(2){animation-delay:.18s} .ai-typing i:nth-child(3){animation-delay:.36s}
@keyframes aiDot{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ============================================================
   RESPONSIVO — experiência mobile própria
   ============================================================ */
@media (max-width:900px){
  .sidebar{display:none}
  .main{margin-left:0}
  .desktop-only{display:none!important}
  .mobile-only{display:flex!important}
  .topbar{display:none}
  .mobtop{display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;position:sticky;top:0;z-index:30;
    background:color-mix(in srgb,var(--paper) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .mobtop .brand{padding:0;font-size:1.18rem}
  .content{padding:18px 18px calc(var(--bottom-h) + 34px);max-width:100%}
  .bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(var(--bottom-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:40;
  }
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:.66rem;font-weight:550;cursor:pointer;position:relative;transition:color .18s}
  .bn-item svg{width:23px;height:23px}
  .bn-item.on{color:var(--clay)}
  .bn-item .bdot{position:absolute;top:8px;right:calc(50% - 16px);width:7px;height:7px;background:var(--clay);border-radius:var(--r-full);border:1.5px solid var(--surface)}
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .display{font-size:2rem}
  .modal{border-radius:var(--r-xl);top:auto;bottom:0;left:0;transform:translateY(100%);width:100%;max-width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0}
  .modal.on{transform:translateY(0)}
  .modal-pad{padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
  .cmdk{top:0;left:0;transform:none;width:100%;border-radius:0;height:100vh;max-height:100vh}
  .cmdk.on{transform:none}
  .cmdk-res{max-height:calc(100vh - 70px)}
  .section-head .h2{font-size:1.3rem}
  /* assistente em mobile: acima da bottom-nav, e painel em ecrã inteiro */
  .ai-fab{right:16px;bottom:calc(var(--bottom-h) + 16px + env(safe-area-inset-bottom));width:52px;height:52px}
  .ai-panel{right:0;left:0;bottom:0;top:0;width:100%;height:100%;border-radius:0;transform:translateY(100%);transform-origin:center}
  .ai-panel.on{transform:none}
  .ai-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
@media (max-width:560px){
  .g3,.g4{grid-template-columns:1fr}
  .hide-xs{display:none!important}
}
@media (min-width:901px){.only-mobile-flow{display:none}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const greet=()=>{const h=new Date().getHours();return h<13?'Bom dia':h<20?'Boa tarde':'Boa noite'};

const countryName=()=>{const c=COUNTRIES.find(c=>c.id===S.country);return c?c.name:''};
const countryCode=()=>{const c=COUNTRIES.find(c=>c.id===S.country);return c?c.code:'—'};
/* O ícone da estrela é traçado com fill="none": só a cor não a preenche.
   A classe .on é que a enche, e o atributo perde para a regra CSS. */
const stars=r=>{let s='';for(let i=1;i<=5;i++){const on=i<=Math.round(r);
  s+=`<span class="star${on?' on':''}" style="color:${on?'var(--gold)':'var(--line)'}">${svg('star')}</span>`}
  return `<span class="row" style="gap:1px">${s}</span>`};
function fmtDate(iso){const d=new Date(iso+'T00:00:00');const dias=['dom','seg','ter','qua','qui','sex','sáb'],mes=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];return `${dias[d.getDay()]}, ${d.getDate()} ${mes[d.getMonth()]}`}
function fmtDay(iso){const d=new Date(iso+'T00:00:00');return {d:d.getDate(),m:['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'][d.getMonth()]}}

/* Toasts */
let toastN=0;
function toast(msg,type){const t=document.createElement('div');t.className='toast'+(type==='err'?' err':'');t.innerHTML=`${type==='err'?svg('warn'):svg('check')}<span>${esc((D()&&D()[msg])||msg)}</span>`;el('toasts').appendChild(t);const id=++toastN;setTimeout(()=>{t.style.transition='opacity .3s,transform .3s';t.style.opacity='0';t.style.transform='translateY(10px)';setTimeout(()=>t.remove(),300)},2600)}

/* Modal */
function openModal(html){el('modalBody').innerHTML=html;traduzir(el('modalBody'));el('modal').classList.add('on');el('scrim').classList.add('on');document.body.style.overflow='hidden'}
function closeModal(){el('modal').classList.remove('on');el('scrim').classList.remove('on');document.body.style.overflow=''}

/* Theme */
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme);const m=$('meta[name=theme-color]');if(m)m.content=S.theme==='dark'?'#16140F':'#F7F4EF'}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';applyTheme();save();renderShell()}

function boot(){
  load(); applyTheme();
  if(S.onboarded){ startApp(); } else { renderOnboarding(); }
  sbInit();   // assíncrono e não bloqueante: a app já está a funcionar
  // atalhos
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk()}
    if(e.key==='Escape'){closeModal();closeCmdk()}
  });
  /* Durante a recuperação o modal não se fecha por engano: sem ele a pessoa
     ficava numa sessão de recuperação sem forma de definir a palavra-passe. */
  el('scrim').addEventListener('click',()=>{if(RECUPERACAO)return;closeModal();closeCmdk()});
}

/* Com trinta países a lista deixou de caber num ecrã: pesquisa-se, como
   já se fazia com a cidade. O país escolhido sobe para o topo para não se
   perder de vista depois de filtrar. */
function obPaisFilter(q){
  const list=el('obPaisList'); if(!list)return;
  const t=(q||'').toLowerCase().trim();
  let f=COUNTRIES.filter(c=>!t||c.name.toLowerCase().includes(t)||c.code.toLowerCase()===t);
  if(!t&&obTemp.country){const i=f.findIndex(c=>c.id===obTemp.country);if(i>0)f=[f[i],...f.filter((_,j)=>j!==i)]}

function obCityFilter(q){const list=el('obCityList');if(!list)return;const f=CITIES.filter(c=>c.toLowerCase().includes((q||'').toLowerCase()));list.innerHTML=f.length?f.map(c=>`<div class="opt ${obTemp.city===c?'on':''}" style="margin-bottom:0" onclick="obTemp.city='${c}';drawOb()"><span style="color:var(--ink-3);width:20px">${svg('pin')}</span><span class="fw5">${esc(c)}</span><span class="tick">${svg('check')}</span></div>`).join(''):`<p class="muted fs-sm" style="padding:8px">Escreve o nome da tua cidade e continua.</p>`}
function obToggleSit(id){const i=obTemp.situations.indexOf(id);if(i>=0)obTemp.situations.splice(i,1);else obTemp.situations.push(id);drawOb()}
function obNext(){
  /* No passo 0 o "Começar" abre a escolha de perfil em vez de saltar já
     para as perguntas, que só fazem sentido a quem vem procurar ajuda. */
  if(obStep===0&&!obEscolha){obEscolha=true;drawOb();window.scrollTo(0,0);return}
  if(obStep===1&&!obTemp.name.trim()){toast('Diz-nos como te chamas.','err');return}
  if(obStep===2&&!obTemp.country){toast('Escolhe o teu país de origem.','err');return}
  if(obStep===3&&!obTemp.city){toast('Escolhe a tua cidade.','err');return}
  if(obStep===4&&!obTemp.situations.length){toast('Escolhe pelo menos uma opção.','err');return}
  obStep++;drawOb();window.scrollTo(0,0);
}
function obBack(){
  if(obStep===1){obStep=0;obEscolha=true;drawOb();return}  // volta à escolha, não ao ecrã inicial
  if(obStep>0){obStep--;drawOb()}
  else if(obEscolha){obEscolha=false;drawOb()}
}
/* 'pessoa' segue para o plano de chegada; qualquer outro valor é uma
   categoria de empresa e leva ao painel já com ela escolhida. */
function escolherPerfil(cat){
  if(cat==='pessoa'){obStep=1;drawOb();window.scrollTo(0,0);return}
  location.href='/painel?registar=1'+(cat?'&cat='+encodeURIComponent(cat):'');
}
function obFinish(){
  S.name=obTemp.name.trim();S.country=obTemp.country;S.city=obTemp.city;S.situations=obTemp.situations;S.onboarded=true;
  save();el('ob').classList.remove('live');startApp();toast('Plano criado');
}
/* Marca KEVIMA: azulejo escuro com o K metálico facetado.
   Cada face do K é um polígono com o seu próprio gradiente — é isso que
   dá o aspeto de metal dobrado em vez de uma letra chapada. */
function markK(s,mono){
  const p='k'+Math.random().toString(36).slice(2,7);
  const f=n=>mono?'currentColor':`url(#${p}${n})`;
  const K=`<path d="M132 96h44v320h-44z" fill="${f(1)}"/>
    <path d="M176 96h28v320h-28z" fill="${f(2)}"/>
    <path d="M204 175 256 96h41L204 230z" fill="${f(3)}"/>
    <path d="M297 96h41L204 285v-55z" fill="${f(4)}"/>
    <path d="M204 285 380 416h-55L204 326z" fill="${f(5)}"/>
    <path d="M204 326 325 416h-55l-66-49z" fill="${f(6)}"/>`;
  const abre=`<svg width="${s}" height="${s}" viewBox="0 0 512 512" fill="none" role="img" aria-label="KEVIMA">`;
  if(mono)return abre+K+`</svg>`;
  return abre+`<defs>
      <linearGradient id="${p}t" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3E3E3E"/><stop offset=".36" stop-color="#1B1B1B"/><stop offset="1" stop-color="#070707"/>
      </linearGradient>
      <linearGradient id="${p}r" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9A9A9A" stop-opacity=".75"/><stop offset=".4" stop-color="#9A9A9A" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="${p}1" x1="0" y1="0" x2="1" y2=".2">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#DCDCDC"/><stop offset="1" stop-color="#ADADAD"/>
      </linearGradient>
      <linearGradient id="${p}2" x1="0" y1="0" x2="1" y2=".25">
        <stop offset="0" stop-color="#8E8E8E"/><stop offset="1" stop-color="#5A5A5A"/>
      </linearGradient>
      <linearGradient id="${p}3" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#6B6B6B"/><stop offset="1" stop-color="#A9A9A9"/>
      </linearGradient>
      <linearGradient id="${p}4" x1="0" y1="1" x2=".7" y2="0">
        <stop offset="0" stop-color="#C4C4C4"/><stop offset=".55" stop-color="#F6F6F6"/><stop offset="1" stop-color="#FFFFFF"/>
      </linearGradient>
      <linearGradient id="${p}5" x1="0" y1="0" x2="1" y2=".7">
        <stop offset="0" stop-color="#FBFBFB"/><stop offset=".55" stop-color="#D5D5D5"/><stop offset="1" stop-color="#A2A2A2"/>
      </linearGradient>
      <linearGradient id="${p}6" x1="0" y1="0" x2="1" y2=".7">
        <stop offset="0" stop-color="#8A8A8A"/><stop offset=".6" stop-color="#666666"/><stop offset="1" stop-color="#464646"/>
      </linearGradient>
    </defs>
    <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#${p}t)"/>
    <rect x="17.5" y="17.5" width="477" height="477" rx="116.5" fill="none" stroke="url(#${p}r)" stroke-width="3"/>`+K+`</svg>`;
}
const brandMark=(s)=>markK(s);

 has already started their application with AIMA.","O NIF é o teu número de contribuinte. É dos primeiros documentos a tratar, porque quase tudo o resto depende dele.": "The NIF is your taxpayer number. It's one of the first things to sort out, because almost everything else depends on it.","Qualquer pessoa que vá trabalhar, arrendar casa, abrir conta bancária ou fazer contratos em Portugal.": "Anyone who is going to work, rent a home, open a bank account or sign contracts in Portugal.","O NISS liga-te ao sistema de Segurança Social. É necessário para trabalhar com contrato e aceder a apoios.": "The NISS connects you to the Social Security system. You need it to work under contract and to access benefits.","Quem vai trabalhar em Portugal (por conta de outrem ou própria).": "Anyone who is going to work in Portugal (employed or self-employed).","O número de utente permite-te inscrever num centro de saúde e ter médico de família. O acesso à saúde é um direito.": "The health number lets you register at a health centre and get a family doctor. Access to healthcare is a right.","Quem precisa de aceder a cuidados de saúde no Serviço Nacional de Saúde.": "Anyone who needs to access care through the National Health Service.","Permite reunir a família (cônjuge, filhos e, em certos casos, outros familiares) com quem já reside legalmente.": "Lets you bring your family (spouse, children and, in certain cases, other relatives) to join you if you already live here legally.","Residentes que querem trazer familiares próximos para viverem consigo em Portugal.": "Residents who want to bring close family to live with them in Portugal.","A aquisição de nacionalidade tem requisitos específicos de tempo de residência, conhecimento da língua e ausência de antecedentes relevantes.": "Acquiring nationality has specific requirements on length of residence, language knowledge and absence of a relevant criminal record.","Residentes que reúnem os requisitos legais de tempo e ligação a Portugal.": "Residents who meet the legal requirements on time and connection to Portugal.","Quem tem carta de condução do país de origem e quer conduzir legalmente em Portugal.": "Anyone holding a driving licence from their home country who wants to drive legally in Portugal.","Cartas de alguns países podem ser trocadas; noutros casos pode ser necessário exame. Há prazos a cumprir após fixar residência.": "Licences from some countries can be exchanged; in other cases a test may be required. There are deadlines once you take up residence.","Reúne os documentos": "Gather your documents","Reúne os documentos da tua situação específica": "Gather the documents for your specific situation","Reúne os documentos que comprovam o vínculo": "Gather the documents proving the family tie","Reúne a documentação (com traduções/legalizações)": "Gather the paperwork (with translations/legalisations)","Aguarda ou agenda o teu atendimento na AIMA": "Wait for, or book, your AIMA appointment","Comparece com os originais e cópias": "Attend with originals and copies","Recolhe dados biométricos": "Have your biometric data taken","Aguarda a emissão do título": "Wait for the permit to be issued","Dirige-te a uma Repartição de Finanças ou Loja de Cidadão": "Go to a tax office (Finanças) or a Loja de Cidadão","Apresenta o passaporte": "Show your passport","Indica a tua morada": "Give your address","Recebes o NIF na hora, gratuitamente": "You get your NIF on the spot, free of charge","Pede o NISS através da Segurança Social Direta ou presencialmente": "Request your NISS through Segurança Social Direta or in person","Aguarda a atribuição do número": "Wait for the number to be issued","Dirige-te ao centro de saúde da tua área de residência": "Go to the health centre for your area","Pede a inscrição como utente": "Ask to register as a patient","Solicita a atribuição de médico de família, se disponível": "Ask to be assigned a family doctor, if available","Submete o pedido junto da AIMA": "Submit the application to AIMA","Aguarda a análise": "Wait for it to be assessed","Após aprovação, o familiar trata do visto/entrada": "Once approved, your relative arranges the visa/entry","Confirma se cumpres os requisitos": "Check that you meet the requirements","Preenche o formulário de inscrição": "Fill in the application form","Submete o pedido": "Submit the application","Confirma se o teu país tem acordo de troca": "Check whether your country has an exchange agreement","Submete o pedido ao IMT": "Submit the application to IMT","Aguarda a emissão da carta portuguesa": "Wait for the Portuguese licence to be issued","Deslocação às Finanças agendada": "Trip to the tax office booked","Passaporte válido": "Valid passport","Comprovativo de entrada legal": "Proof of legal entry","Registo criminal": "Criminal record certificate","Registo criminal (país de origem e/ou Portugal)": "Criminal record certificate (home country and/or Portugal)","Comprovativo de meios de subsistência": "Proof of means of subsistence","Comprovativo de morada": "Proof of address","NIF atribuído": "NIF issued","NISS atribuído": "NISS issued","Documento de identificação": "Identity document","Documento de identificação (passaporte)": "Identity document (passport)","Comprovativo de residência": "Proof of residence","Comprovativo de alojamento": "Proof of accommodation","Comprovativo de rendimentos": "Proof of income","Comprovativo de tempo de residência": "Proof of length of residence","Título de residência válido": "Valid residence permit","Título ou comprovativo de residência": "Residence permit or proof of residence","Título de residência do requerente": "Applicant's residence permit","Certidão de nascimento": "Birth certificate","Certificado de língua portuguesa": "Portuguese language certificate","Certificado de conhecimento de língua portuguesa": "Certificate of Portuguese language knowledge","Prova de vínculo familiar": "Proof of family relationship","Documentos que provem o vínculo familiar": "Documents proving the family relationship","Carta de condução original": "Original driving licence","Atestado médico (se pedido)": "Medical certificate (if requested)","Atestado médico, quando exigido": "Medical certificate, where required","Representante fiscal, se aplicável ao teu caso": "Tax representative, if applicable to your case","Lojas AIMA e Espaços Cidadão. O agendamento é feito pelos canais oficiais da AIMA.": "AIMA offices and Espaços Cidadão. Appointments are booked through AIMA's official channels.","Serviço de Finanças (Autoridade Tributária) e Lojas de Cidadão.": "Tax offices (Autoridade Tributária) and Lojas de Cidadão.","Serviços da Segurança Social e Segurança Social Direta (online).": "Social Security offices and Segurança Social Direta (online).","Centro de saúde / Unidade de Saúde Familiar da tua área.": "The health centre / family health unit for your area.","Conservatórias / IRN e canais oficiais.": "Civil registry offices / IRN and official channels.","IMT — Instituto da Mobilidade e dos Transportes.": "IMT — the Institute for Mobility and Transport.","AIMA — Agência para a Integração, Migrações e Asilo": "AIMA — Agency for Integration, Migration and Asylum","IRN — Instituto dos Registos e Notariado": "IRN — Institute of Registries and Notaries","Portal das Finanças": "Portal das Finanças (tax portal)","Segurança Social Direta": "Segurança Social Direta (online social security)","SNS 24": "SNS 24 (health line)","AIMA": "AIMA","AIMA.": "AIMA.","IMT": "IMT","NIF": "NIF","As taxas variam conforme o tipo de título. Consulta os valores oficiais em vigor na AIMA.": "Fees vary by permit type. Check the current official amounts with AIMA.","A atribuição do NIF é gratuita.": "Getting a NIF is free.","Não pagues a terceiros por um NIF — o pedido presencial é gratuito.": "Don't pay anyone for a NIF — applying in person is free.","A inscrição é gratuita. Podem existir taxas moderadoras em certas situações.": "Registering is free. User fees may apply in some situations.","Sujeito a taxas oficiais.": "Official fees apply.","Sujeito a taxas oficiais. Confirma os valores em vigor.": "Official fees apply. Check the current amounts.","Sujeito a taxas do IMT.": "IMT fees apply.","Variável. Guarda todos os comprovativos.": "Varies. Keep every receipt.","Os prazos podem ser longos.": "Waiting times can be long.","Os prazos de resposta dependem do volume de processos. Guarda sempre o comprovativo do teu pedido.": "Response times depend on the volume of cases. Always keep the receipt for your application.","Atribuído normalmente no mesmo dia.": "Usually issued the same day.","Alguns dias úteis, conforme o canal utilizado.": "A few working days, depending on the channel used.","A inscrição costuma ser imediata; a atribuição de médico pode demorar.": "Registration is usually immediate; being assigned a doctor can take longer.","Existe um prazo após a fixação de residência — não deixes expirar.": "There's a deadline once you take up residence — don't let it lapse.","Nunca entregues documentos originais únicos sem cópia. Desconfia de intermediários que prometem \"acelerar\" o processo a troco de dinheiro.": "Never hand over one-of-a-kind original documents without a copy. Be wary of middlemen who promise to \"speed up\" the process for money.","Documentos emitidos no estrangeiro podem precisar de tradução e legalização. Confirma os requisitos antes de submeter.": "Documents issued abroad may need translation and legalisation. Check the requirements before you submit.","O empregador não te pode pedir para \"dispensar\" a Segurança Social — o desconto é um direito teu.": "An employer cannot ask you to \"waive\" Social Security — those contributions are your right.","O acesso a cuidados urgentes e de saúde pública está previsto na lei. Leva sempre o que tiveres.": "Access to urgent and public health care is provided for by law. Always bring whatever documents you have.","Em situação de urgência, o atendimento não pode ser recusado por falta de documentos.": "In an emergency, care cannot be refused for lack of documents.","Este é um processo com muitos detalhes legais. Um erro na documentação pode atrasar meses.": "This process has a lot of legal detail. A mistake in the paperwork can cause months of delay.","É exigido um certificado de conhecimento da língua. Há centros que fazem esta certificação.": "A language certificate is required. There are centres that provide this certification.","Conduzir com carta não reconhecida pode ter consequências legais. Trata da troca dentro do prazo.": "Driving on an unrecognised licence can have legal consequences. Sort out the exchange within the deadline.","O SEF ainda existe?": "Does SEF still exist?","Não. As funções do SEF passaram para a AIMA e para a PSP/GNR. Todos os assuntos de residência são agora tratados pela AIMA.": "No. SEF's functions passed to AIMA and to the PSP/GNR. All residence matters are now handled by AIMA.","Posso trabalhar enquanto aguardo?": "Can I work while I wait?","O comprovativo de pedido de título pode dar acesso a certos direitos. Confirma a tua situação concreta com apoio jurídico.": "The receipt for your permit application may give access to certain rights. Check your specific situation with legal support.","Preciso de representante fiscal?": "Do I need a tax representative?","Depende da tua situação de residência. Muitos residentes já não precisam, mas confirma no atendimento.": "It depends on your residence status. Many residents no longer need one, but check when you go in.","O empregador trata disto?": "Does my employer handle this?","O empregador comunica a admissão, mas o NISS é teu e podes solicitá-lo diretamente.": "Your employer reports your hiring, but the NISS is yours and you can request it directly.","Posso ser recusado sem título de residência?": "Can I be refused without a residence permit?","Que familiares posso incluir?": "Which family members can I include?","Depende do grau de parentesco e da tua situação. É um dos s it still available?","Olá, tenho interesse neste imóvel. Está disponível para visita?": "Hello, I'm interested in this property. Can I arrange a viewing?","Nunca faças pagamentos antes de visitar o imóvel presencialmente.": "Never pay anything before visiting the property in person.","Como evitar burlas no arrendamento": "How to avoid rental scams","Nunca pagues caução, sinal ou \"reserva\" antes de visitares a casa em pessoa.": "Never pay a deposit, holding fee or \"reservation\" before seeing the home in person.","Desconfia de preços muito abaixo do mercado — costuma ser o primeiro sinal de burla.": "Be suspicious of prices well below market rate — it's usually the first sign of a scam.","Confirma a identidade do senhorio e pede sempre contrato escrito.": "Confirm the landlord's identity and always ask for a written contract.","Não envies dinheiro por transferências para o estrangeiro ou apps informais.": "Don't send money by transfer abroad or through informal apps.","Prefere anúncios de anunciantes verificados na plataforma.": "Prefer listings from advertisers verified on the platform.","Se algo te parecer estranho, denuncia o anúncio — proteges-te a ti e aos outros.": "If something feels off, report the listing — you protect yourself and others.","Ajuda-nos a manter a plataforma segura. Qual é o motivo?": "Help us keep the platform safe. What's the reason?","Explica brevemente o teu caso": "Briefly explain your situation","Ex: Cheguei de Angola há 3 meses e preciso de ajuda com o meu título de residência…": "e.g. I arrived from Angola 3 months ago and need help with my residence permit…","O profissional recebe o teu pedido com o teu nome e cidade, e responde através da plataforma. Não partilhes documentos sensíveis nesta fase.": "The professional receives your request with your name and city, and replies through the platform. Don't share sensitive documents at this stage.","Porque é que te queres candidatar?": "Why do you want to apply?","Ex: Tenho 5 anos de mprovativos.": "अलग-अलग। सभी रसीदें सहेजें।", "Os prazos podem ser longos.": "प्रतीक्षा अवधि लंबी हो सकती है।", "Os prazos de resposta dependem do volume de processos. Guarda sempre o comprovativo do teu pedido.": "उत्तर का समय मामलों की संख्या पर निर्भर करता है। अपने आवेदन की रसीद हमेशा सहेजें।", "Atribuído normalmente no mesmo dia.": "आमतौर पर उसी दिन जारी।", "Alguns dias úteis, conforme o canal utilizado.": "कुछ कार्यदिवस, माध्यम के अनुसार।", "A inscrição costuma ser imediata; a atribuição de médico pode demorar.": "पंजीकरण आमतौर पर तुरंत होता है; डॉक्टर मिलने में समय लग सकता है।", "Existe um prazo após a fixação de residência — não deixes expirar.": "निवास शुरू करने के बाद एक समय-सीमा है — उसे समाप्त न होने दें।", "Nunca entregues documentos originais únicos sem cópia. Desconfia de intermediários que prometem \"acelerar\" o processo a troco de dinheiro.": "अपने इकलौते मूल दस्तावेज़ बिना प्रति के कभी न दें। पैसे लेकर प्रक्रिया \"तेज़\" करने का वादा करने वालों से सावधान रहें।", "Documentos emitidos no estrangeiro podem precisar de tradução e legalização. Confirma os requisitos antes de submeter.": "विदेश में जारी दस्तावेज़ों के लिए अनुवाद और वैधीकरण की ज़रूरत हो सकती है। जमा करने से पहले शर्तें जाँचें।", "O empregador não te pode pedir para \"dispensar\" a Segurança Social — o desconto é um direito teu.": "नियोक्ता आपसे सामाजिक सुरक्षा \"छोड़ने\" के लिए नहीं कह सकता — वह अंशदान आपका अधिकार है।", "O acesso a cuidados urgentes e de saúde pública está previsto na lei. Leva sempre o que tiveres.": "आपातकालीन और सार्वजनिक स्वास्थ्य सेवा तक पहुँच क़ानून में है। जो दस्तावेज़ हों, हमेशा साथ ले जाएँ।", "Em situação de urgência, o atendimento não pode ser recusado por falta de documentos.": "आपातकाल में दस्तावेज़ न होने पर इलाज से इनकार नहीं किया जा सकता।", "Este é um processo com muitos detalhes legais. Um erro na documentação pode atrasar meses.": "इस प्रक्रिया में कई क़ानूनी बारीकियाँ हैं। दस्तावेज़ों में एक ग़लती महीनों की देरी करा सकती है।", "É exigido um certificado de conhecimento da língua. Há centros que fazem esta certificação.": "भाषा प्रमाणपत्र आवश्यक है। कुछ केंद्र यह प्रमाणन करते हैं।", "Conduzir com carta não reconhecida pode ter consequências legais. Trata da troca dentro do prazo.": "अमान्य लाइसेंस से गाड़ी चलाने के क़ानूनी परिणाम हो सकते हैं। समय-सीमा के भीतर आदान-प्रदान कराएँ।", "O SEF ainda existe?": "क्या SEF अब भी है?", "Não. As funções do SEF passaram para a AIMA e para a PSP/GNR. Todos os assuntos de residência são agora tratados pela AIMA.": "नहीं। SEF के कार्य AIMA और PSP/GNR को सौंप दिए गए। निवास से जुड़े सभी मामले अब AIMA देखता है।", "Posso trabalhar enquanto aguardo?": "क्या मैं प्रतीक्षा के दौरान काम कर सकता हूँ?", "O comprovativo de pedido de título pode dar acesso a certos direitos. Confirma a tua situação concreta com apoio jurídico.": "परमिट आवेदन की रसीद से कुछ अधिकार मिल सकते हैं। अपनी विशिष्ट स्थिति क़ानूनी सहायता से जाँचें।", "Preciso de representante fiscal?": "क्या मुझे कर प्रतिनिधि चाहिए?", "Depende da tua situação de residência. Muitos residentes já não precisam, mas confirma no atendimento.": "यह आपकी निवास स्थिति पर निर्भर करता है। कई निवासियों को अब ज़रूरत नहीं, पर कार्यालय में पुष्टि करें।", "O empregador trata disto?": "क्या नियोक्ता यह करता है?", "O empregador comunica a admissão, mas o NISS é teu e podes solicitá-lo diretamente.": "नियोक्ता आपकी नियुक्ति की सूचना देता है, पर NISS आपका है और आप सीधे आवेदन कर सकते हैं।", "Posso ser recusado sem título de residência?": "क्या निवास परमिट के बिना मुझे मना किया जा सकता है?", "Que familiares posso incluir?": "मैं किन परिजनों को शामिल कर सकता हूँ?", "Depende do grau de parentesco e da tua situação. É um dos casos em que vale a pena falar com um profissional.": "यह रिश्ते और आपकी स्थिति पर निर्भर करता है। यह उन मामलों में है जहाँ पेशेवर से बात करना उचित है।", "Que nível de português preciso?": "मुझे पुर्तगाली का कौन-सा स्तर चाहिए?", "A minha carta é reconhecida?": "क्या मेरा लाइसेंस मान्य है?", "Depende do país emissor e dos acordos em vigor. Confirma no IMT antes de conduzir.": "यह जारी करने वाले देश और मौजूदा समझौतों पर निर्भर करता है। गाड़ी चलाने से पहले IMT से पुष्टि करें।", "Encontra o teu próximo trabalho.": "अपनी अगली नौकरी खोजें।", "Encontra um lugar para viver.": "रहने की जगह खोजें।", "Encontra profissionais de confiança.": "भरोसेमंद पेशेवर खोजें।", "Advogados e solicitadores com experiência em imigração, com credenciais confirmadas.": "प्रवासन में अनुभवी वकील और सॉलिसिटर, सत्यापित प्रमाणपत्रों के साथ।", "Todos os profissionais com": "सभी पेशेवर जिन पर", "tiveram as credenciais confirmadas pela nossa equipa.": "लिखा है, उनके प्रमाणपत्र हमारी टीम ने जाँचे हैं।", "O que existe à tua volta.": "आपके आसपास क्या है।", "Bancos, saúde, telecomunicações, associações e apoio social, perto de ti.": "बैंक, स्वास्थ्य, दूरसंचार, संगठन और सामाजिक सहायता, आपके पास।", "Eventos perto de ti": "आपके पास के कार्यक्रम", "Os eventos em que vais participar.": "वे कार्यक्रम जिनमें आप जाएँगे।", "Perguntas respondidas por quem já passou por isto.": "उन लोगों के उत्तर जो इससे गुज़र चुके हैं।", "Grupos por país e por cidade. As respostas ficam para quem chegar a seguir.": "देश और शहर के अनुसार समूह। उत्तर उनके लिए रहते हैं जो बाद में आएँगे।", "Posições aproximadas. Toca num marcador para ver detalhes.": "अनुमानित स्थान। विवरण के लिए किसी चिह्न पर टैप करें।", "O que oferecem": "वे क्या देते हैं", "O que precisas": "आपको क्या चाहिए", "Olá, tenho interesse neste imóvel. Ainda está disponível?": "नमस्ते, मुझे इस आवास में रुचि है। क्या यह अब भी उपलब्ध है?", "Olá, tenho interesse neste imóvel. Está disponível para visita?": "नमस्ते, मुझे इस आवास में रुचि है। क्या मैं देखने आ सकता हूँ?", "Nunca faças pagamentos antes de visitar o imóvel presencialmente.": "आवास को स्वयं देखे बिना कभी भुगतान न करें।", "Como evitar burlas no arrendamento": "किराए में धोखाधड़ी से कैसे बचें", "Nunca pagues caução, sinal ou \"reserva\" antes de visitares a casa em pessoa.": "घर को स्वयं देखे बिना कभी जमानत, अग्रिम या \"बुकिंग\" राशि न दें।", "Desconfia de preços muito abaixo do mercado — costuma ser o primeiro sinal de burla.": "बाज़ार से बहुत कम क़ीमत पर संदेह करें — यह आमतौर पर धोखाधड़ी का पहला संकेत है।", "Confirma a identidade do senhorio e pede sempre contrato escrito.": "मकान मालिक की पहचान जाँचें और हमेशा लिखित अनुबंध माँगें।", "Não envies dinheiro por transferências para o estrangeiro ou apps informais.": "विदेश में ट्रांसफ़र या अनौपचारिक ऐप्स से पैसे न भेजें।", "Prefere anúncios de anunciantes verificados na plataforma.": "मंच पर सत्यापित विज्ञापनदाताओं के विज्ञापन चुनें।", "Se algo te parecer estranho, denuncia o anúncio — proteges-te a ti e aos outros.": "कुछ अजीब लगे तो विज्ञापन की रिपोर्ट करें — इससे आप और दूसरे सुरक्षित रहते हैं।", "Ajuda-nos a manter a plataforma segura. Qual é o motivo?": "मंच को सुरक्षित रखने में मदद करें। कारण क्या है?", "Explica brevemente o teu caso": "अपनी स्थिति संक्षेप में बताएँ", "O profissional recebe o teu pedido com o teu nome e cidade, e responde através da plataforma. Não partilhes documentos sensíveis nesta fase.": "पेशेवर को आपका अनुरोध आपके नाम और शहर के साथ मिलता है, और वे मंच से उत्तर देते हैं। इस चरण में संवेदनशील दस्तावेज़ साझा न करें।", "Porque é que te queres candidatar?": "आप आवेदन क्यों करना चाहते हैं?", "Tenho interesse nesta vaga e estou disponível para começar.": "मुझे इस नौकरी में रुचि है और मैं शुरू करने को तैयार हूँ।", "A empresa recebe o teu nome, cidade e esta mensagem. Nunca pagues para te candidatares.": "कंपनी को आपका नाम, शहर और यह संदेश मिलता है। नौकरी के आवेदन के लिए कभी पैसे न दें।", "As tuas conversas": "आपकी बातचीत", "Falas aqui com quem aceitou o teu pedido, candidatura ou contacto.": "यहाँ आप उनसे बात करते हैं जिन्होंने आपका अनुरोध, आवेदन या संपर्क स्वीकार किया।", "Entra para veres as tuas conversas": "अपनी बातचीत देखने के लिए साइन इन करें", "As conversas com profissionais ficam guardadas na tua conta.": "पेशेवरों से बातचीत आपके खाते में सहेजी जाती है।", "Ainda sem conversas": "अभी कोई बातचीत नहीं", "Quando um profissional, senhorio, empreg izas.": "Безпечне місце для життя, поки ви влаштовуєтеся.", "Oportunidades adequadas à tua experiência e zona.": "Можливості, що відповідають вашому досвіду й району.", "NIF, NISS, número de utente e o teu título de residência.": "NIF, NISS, медичний номер і ваш дозвіл на проживання.", "Banco, saúde, telecomunicações e apoio social perto de ti.": "Банк, здоров'я, зв'язок і соціальна підтримка поруч.", "Comunidade, grupos e pessoas que já passaram por aqui.": "Спільнота, групи й люди, які вже це пройшли.", "Centro de documentação": "Центр документів", "Organiza a tua documentação.": "Впорядкуйте свої документи.", "Guias claros, passo a passo, para tratares do que precisas sem te perderes.": "Зрозумілі покрокові інструкції, щоб зробити потрібне й не заплутатися.", "A KEVIMA não substitui aconselhamento jurídico. Estas informações podem mudar — confirma sempre nas entidades oficiais.": "KEVIMA не замінює юридичну консультацію. Ця інформація може змінюватися — завжди перевіряйте в офіційних установах.", "Esta informação é apenas orientação.": "Ця інформація має лише орієнтовний характер.", "Para a análise do teu caso concreto, fala com um profissional qualificado.": "Для аналізу вашої конкретної справи зверніться до кваліфікованого фахівця.", "Autorização de Residência (AIMA)": "Дозвіл на проживання (AIMA)", "Número de Identificação Fiscal (NIF)": "Податковий номер (NIF)", "NISS — Número de Segurança Social": "NISS — номер соціального страхування", "Número de Utente / Acesso ao SNS": "Медичний номер / доступ до SNS", "Reagrupamento Familiar": "Возз'єднання сім'ї", "Nacionalidade Portuguesa": "Португальське громадянство", "Troca da Carta de Condução": "Обмін водійського посвідчення", "Segurança Social": "Соціальне страхування", "Carta de condução": "Водійське посвідчення", "O título de residência é o documento central da tua situação legal. Desde 2023, os pedidos e renovações são tratados pela AIMA (que substituiu o SEF).": "Дозвіл на проживання — головний документ вашого правового статусу. З 2023 року заяви та поновлення опрацьовує AIMA (яка замінила SEF).", "Qualquer pessoa estrangeira que pretenda residir legalmente em Portugal e já tenha iniciado o pedido junto da AIMA.": "Будь-який іноземець, який хоче законно проживати в Португалії і вже подав заяву до AIMA.", "O NIF é o teu número de contribuinte. É dos primeiros documentos a tratar, porque quase tudo o resto depende dele.": "NIF — це ваш податковий номер. Його варто оформити одним із перших, бо майже все інше залежить від нього.", "Qualquer pessoa que vá trabalhar, arrendar casa, abrir conta bancária ou fazer contratos em Portugal.": "Будь-хто, хто працюватиме, орендуватиме житло, відкриватиме рахунок чи укладатиме договори в Португалії.", "O NISS liga-te ao sistema de Segurança Social. É necessário para trabalhar com contrato e aceder a apoios.": "NISS підключає вас до системи соціального страхування. Він потрібен для роботи за договором і доступу до допомоги.", "Quem vai trabalhar em Portugal (por conta de outrem ou própria).": "Ті, хто працюватиме в Португалії (за наймом або самозайнято).", "O número de utente permite-te inscrever num centro de saúde e ter médico de família. O acesso à saúde é um direito.": "Медичний номер дозволяє зареєструватися в центрі здоров'я і мати сімейного лікаря. Доступ до медицини — це право.", "Quem precisa de aceder a cuidados de saúde no Serviço Nacional de Saúde.": "Ті, кому потрібна медична допомога в Національній службі здоров'я.", "Permite reunir a família (cônjuge, filhos e, em certos casos, outros familiares) com quem já reside legalmente.": "Дозволяє возз'єднати сім'ю (подружжя, дітей, а в певних випадках і інших родичів) з тим, хто вже проживає законно.", "Residentes que querem trazer familiares próximos para viverem consigo em Portugal.": "Резиденти, які хочуть привезти близьких родичів жити з ними в Португалії.", "A aquisição de nacionalidade tem requisitos específicos de tempo de residência, conhecimento da língua e ausência de antecedentes relevantes.": "Отримання громадянства має конкретні вимоги щодо тривалості проживання, знання мови та відсутності судимостей.", "Residentes que reúnem os requisitos legais de tempo e ligação a Portugal.": "Резиденти, які відповідають правовим вимогам щодо часу та зв'язку з Португалією.", "Quem tem carta de condução do país de origem e quer conduzir legalmente em Portugal.": "Ті, хто має водійське посвідчення своєї країни і хоче законно керувати авто в Португалії.", "Cartas de alguns países podem ser trocadas; noutros casos pode ser necessário exame. Há prazos a cumprir após fixar residência.": "Посвідчення деяких країн можна обміняти; в інших випадках може знадобитися іспит. Після початку проживання діють терміни.", "Reúne os documentos": "Зберіть документи", "Reúne os documentos da tua situação específica": "Зберіть документи для вашої конкретної ситуації", "Reúne os documentos que comprovam o vínculo": "Зберіть документи, що підтверджують родинний зв'язок", "Reúne a documentação (com traduções/legalizações)": "Зберіть документи (з перекладами/легалізацією)", "Aguarda ou agenda o teu atendimento na AIMA": "Очікуйте або запишіться на прийом до AIMA", "Comparece com os originais e cópias": "Прийдіть з оригіналами та копіями", "Recolhe dados biométricos": "Здайте біометричні дані", "Aguarda a emissão do título": "Очікуйте видачі дозволу", "Dirige-te a uma Repartição de Finanças ou Loja de Cidadão": "Зверніться до податкової (Finanças) або Loja de Cidadão", "Apresenta o passaporte": "Пред'явіть паспорт", "Indica a tua morada": "Вкажіть свою адресу", "Recebes o NIF na hora, gratuitamente": "Ви отримуєте NIF одразу, безкоштовно", "Pede o NISS através da Segurança Social Direta ou presencialmente": "Подайте на NISS через Segurança Social Direta або особисто", "Aguarda a atribuição do número": "Очікуйте присвоєння номера", "Dirige-te ao centro de saúde da tua área de residência": "Зверніться до центру здоров'я за місцем проживання", "Pede a inscrição como utent іть посередникам за NIF — особисте звернення безкоштовне.", "A inscrição é gratuita. Podem existir taxas moderadoras em certas situações.": "Реєстрація безкоштовна. У деяких випадках може стягуватися символічна плата.", "Sujeito a taxas oficiais.": "Стягуються офіційні збори.", "Sujeito a taxas oficiais. Confirma os valores em vigor.": "Стягуються офіційні збори. Перевірте чинні суми.", "Sujeito a taxas do IMT.": "Стягуються збори IMT.", "Variável. Guarda todos os comprovativos.": "Різна. Зберігайте всі квитанції.", "Os prazos podem ser longos.": "Терміни очікування можуть бути довгими.", "Os prazos de resposta dependem do volume de processos. Guarda sempre o comprovativo do teu pedido.": "Терміни відповіді залежать від кількості справ. Завжди зберігайте квитанцію про подання заяви.", "Atribuído normalmente no mesmo dia.": "Зазвичай видається того ж дня.", "Alguns dias úteis, conforme o canal utilizado.": "Кілька робочих днів, залежно від каналу.", "A inscrição costuma ser imediata; a atribuição de médico pode demorar.": "Реєстрація зазвичай миттєва; призначення лікаря може зайняти час.", "Existe um prazo após a fixação de residência — não deixes expirar.": "Після початку проживання діє термін — не дайте йому спливти.", "Nunca entregues documentos originais únicos sem cópia. Desconfia de intermediários que prometem \"acelerar\" o processo a troco de dinheiro.": "Ніколи не віддавайте єдині оригінали без копій. Остерігайтеся посередників, які обіцяють «прискорити» процес за гроші.", "Documentos emitidos no estrangeiro podem precisar de tradução e legalização. Confirma os requisitos antes de submeter.": "Документи, видані за кордоном, можуть потребувати перекладу та легалізації. Перевірте вимоги перед поданням.", "O empregador não te pode pedir para \"dispensar\" a Segurança Social — o desconto é um direito teu.": "Роботодавець не може просити вас «відмовитися» від соціального страхування — ці внески є вашим правом.", "O acesso a cuidados urgentes e de saúde pública está previsto na lei. Leva sempre o que tiveres.": "Доступ до невідкладної та громадської медичної допомоги передбачений законом. Завжди беріть із собою документи, які маєте.", "Em situação de urgência, o atendimento não pode ser recusado por falta de documentos.": "У невідкладній ситуації в допомозі не можуть відмовити через брак документів.", "Este é um processo com muitos detalhes legais. Um erro na documentação pode atrasar meses.": "Це процес із багатьма юридичними деталями. Помилка в документах може затримати справу на місяці.", "É exigido um certificado de conhecimento da língua. Há centros que fazem esta certificação.": "Потрібен сертифікат про знання мови. Є центри, які проводять таку сертифікацію.", "Conduzir com carta não reconhecida pode ter consequências legais. Trata da troca dentro do prazo.": "Керування авто з невизнаним посвідченням може мати правові наслідки. Оформіть обмін у визначений строк.", "O SEF ainda existe?": "Чи існує ще SEF?", "Não. As funções do SEF passaram para a AIMA e para a PSP/GNR. Todos os assuntos de residência são agora tratados pela AIMA.": "Ні. Функції SEF передані AIMA та PSP/GNR. Усі питання проживання тепер веде AIMA.", "Posso trabalhar enquanto aguardo?": "Чи можу я працювати, поки чекаю?", "O comprovativo de pedido de título pode dar acesso a certos direitos. Confirma a tua situação concreta com apoio jurídico.": "Квитанція про подання заяви може давати певні права. Перевірте свою конкретну ситуацію з юристом.", "Preciso de representante fiscal?": "Чи потрібен мені податковий представник?", "Depende da tua situação de residência. Muitos residentes já não precisam, mas confirma no atendimento.": "Залежить від вашого статусу проживання. Багатьом резидентам він уже не потрібен, але перевірте на прийомі.", "O empregador trata disto?": "Чи оформлює це роботодавець?", "O empregador comunica a admissão, mas o NISS é teu e podes solicitá-lo diretamente.": "Роботодавець повідомляє про прийом на роботу, але NISS — ваш, і ви можете подати на нього самі.", "Posso ser recusado sem título de residência?": "Чи можуть мені відмовити без дозволу на проживання?", "Que familiares posso incluir?": "Яких родичів я можу включити?", "Depende do grau de parentesco e da tua situação. É um dos casos em que vale a pena falar com um profissional.": "Залежить від ступеня спорідненості та вашої ситуації. Це той випадок, коли варто поговорити з фахівцем.", "Que nível de português preciso?": "Який рівень португальської мені потрібен?", "A minha carta é reconhecida?": "Чи визнається моє посвідчення?", "Depende do país emissor e dos acordos em vigor. Confirma no IMT antes de conduzir.": "Залежить від країни видачі та чинних угод. Перевірте в IMT, перш ніж сідати за кермо.", "Encontra o teu próximo trabalho.": "Знайдіть свою наступну роботу.", "Encontra um lugar para viver.": "Знайдіть житло.", "Encontra profissionais de confiança.": "Знайдіть фахівців, яким можна довіряти.", "Advogados e solicitadores com experiência em imigração, com credenciais confirmadas.": "Адвокати та юристи з досвідом у міграційних справах, із перевіреними документами.", "Todos os profissionais com": "Усі фахівці з позначкою", "tiveram as credenciais confirmadas pela nossa equipa.": "пройшли перевірку документів нашою командою.", "O que existe à tua volta.": "Що є навколо вас.", "Bancos, saúde, telecomunicações, associações e apoio social, perto de ti.": "Банки, здоров'я, зв'язок, організації та соціальна підтримка поруч із вами.", "Eventos perto de ti": "Події поруч", "Os eventos em que vais participar.": "Події, у яких ви візьмете участь.", "Perguntas respondidas por quem já passou por isto.": "Відповіді від тих, хто це вже пройшов.", "Grupos por país e por cidade. As respostas ficam para quem chegar a seguir.": "Групи за країною та містом. Відповіді залишаються для тих, хто приїде після вас.", "Posições aproximadas. Toca num marcador para ver detalhes.": "Приблизні розташування. Торкніться позначки, щоб побачити деталі.", "O que oferecem": const D=()=>T[S.lang]||null;
function traduzir(root){
  if(!root||!D())return;
  const dic=D();
  /* data-notr marca o que nunca se traduz — os nomes dos próprios idiomas
     no selector. Traduzi-los escondia o português de quem o procura. */
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>
    n.parentElement&&n.parentElement.closest('[data-notr]')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nos=[]; let n;
  while(n=w.nextNode())nos.push(n);
  nos.forEach(no=>{
    const bruto=no.nodeValue, t=bruto.trim();
    if(!t)return;
    const traduzido=dic[t]||porPadrao(t);
    if(traduzido)no.nodeValue=bruto.replace(t,traduzido);
  });
  root.querySelectorAll('[placeholder]').forEach(e=>{
    const v=dic[e.placeholder]; if(v)e.placeholder=v});
  root.querySelectorAll('[title]').forEach(e=>{
    const v=dic[e.title]; if(v)e.title=v});
  root.querySelectorAll('[aria-label]').forEach(e=>{
    const v=dic[e.getAttribute('aria-label')]; if(v)e.setAttribute('aria-label',v)});
}

function porPadrao(t){

  const g=t.match(/^(Bom dia|Boa tarde|Boa noite), (.+)$/);
  if(g){const m=(SAUDACOES[S.lang]||{})[g[1]]; if(m)return m+', '+g[2]}

  for(const [re,rep] of (PADROES[S.lang]||[])){
    if(rep===null)continue;
    if(re.test(t)){
      let r=t.replace(re,rep);
      /* singular/plural do inglês: "1 job" e não "1 jobs" */
      if(S.lang==='en'){r=r.replace(/^1 (\w+)s\b/,'1 $1');r=r.replace('$2','s')}
      return r;
    }
  }
  return null;
}

/* ============================================================
   CONTACTOS SOBRE ANÚNCIOS
   ------------------------------------------------------------
   Candidatar-se a uma vaga, contactar sobre um quarto e inscrever-se
   num evento são o mesmo gesto: responder a um anúncio. Antes, nenhum
   deles gravava seja o que for.
   ============================================================ */
let CONTACTO_PENDENTE=null;
function lcErro(m){const d=el('lcErro');if(d)d.innerHTML=`<div class="callout" style="background:var(--danger-soft);color:var(--danger);margin-bottom:12px">${svg('warn')}<div>${esc(m)}</div></div>`}
async function enviarContacto(listingId,tipo,textoFixo){
  const campo={home:'hostMsg',job:'jobMsg',event:'evMsg'}[tipo];
  const texto=(textoFixo||((el(campo)||{}).value||'')).trim();
  if(texto.length<5){lcErro('Escreve uma mensagem para acompanhar o contacto.');return}
  if(!SB_ON){lcErro('Sem ligação ao servidor. Tenta daqui a pouco.');return}
  if(!signedIn()){
    CONTACTO_PENDENTE={listingId,tipo,texto};
    closeModal();toast('Cria conta para poderes receber a resposta');
    return contaModal('criar');
  }
  const btn=el('lcBtn');if(btn){btn.disabled=true;btn.textContent='A enviar…'}
  try{
    /* A empresa vem do anúncio, não do ecrã: é também o que a política de
       escrita confirma do lado do servidor. */
    const {data:l,error:e1}=await sb.from('listings').select('company_id').eq('id',listingId).maybeSingle();
    if(e1||!l)throw e1||new Error('anúncio não encontrado');
    const {error}=await sb.from('listing_contacts').insert({
      listing_id:listingId, company_id:l.company_id, user_id:SB_USER.id, message:texto,
      contact_name:S.name||null, contact_city:S.city||null,
      contact_country:(COUNTRIES.find(c=>c.id===S.country)||{}).name||null});
    if(error&&error.code==='23505'){closeModal();return toast('Já tinhas contactado sobre este anúncio')}
    if(error)throw error;
    if(tipo==='job')S.appliedJobs[listingId]='Candidatura enviada';
    if(tipo==='event'&&!S.savedEvents.includes(listingId))S.savedEvents.push(listingId);
    save();closeModal();
    toast(tipo==='job'?'Candidatura enviada':tipo==='event'?'Inscrição enviada':'Mensagem enviada','ok2');
    go(S.route);
  }catch(e){
    console.warn('contacto:',e&&e.message);
    lcErro('Não foi possível enviar. Tenta novamente.');
    if(btn){btn.disabled=false;btn.innerHTML=svg('send')+' Enviar'}
  }
}

  <h2 class="h2 mb4">Denunciar anúncio</h2><p class="muted mb16">Ajuda-nos a manter a plataforma segura. Qual é o motivo?</p>

async function guardarAvaliacao(){
  const erro=m=>{el('avErro').innerHTML=`<div class="callout" style="background:var(--danger-soft);color:var(--danger);margin-bottom:12px">${svg('warn')}<div>${esc(m)}</div></div>`};
