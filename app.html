<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EF">
<title>KEVIMA — your new life, connected</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   KEVIMA — Design System
   Editorial · premium · humano · calmo
   ============================================================ */

/* ---- Tokens ---- */
:root{
  /* Paper & ink (warm neutrals) */
  --paper:#F7F4EF;            /* app background */
  --surface:#FDFCFA;          /* cards */
  --surface-2:#F1ECE3;        /* subtle fill */
  --ink:#1C1A16;             /* primary text */
  --ink-2:#57534A;           /* secondary text */
  --ink-3:#8A8478;           /* muted / captions */
  --line:#E7E1D6;            /* borders */
  --line-2:#EFEAE0;

  /* Accent — terracota (humano, terroso, sem clichê de bandeira) */
  --clay:#C25A3A;
  --clay-deep:#A8432A;
  --clay-soft:#F3E4DB;
  --clay-tint:#FBF1EB;

  /* Suporte */
  --sage:#3E6B5A;            /* progresso / verificado */
  --sage-soft:#E4EEE8;
  --gold:#B4842B;            /* destaque quente */
  --sky:#37618E;            /* links de entidades oficiais */
  --danger:#B23A2E;
  --danger-soft:#F6E3E0;

  /* Tipografia */
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;

  /* Raio & sombra (moderados) */
  --r-sm:8px; --r:14px; --r-lg:20px; --r-xl:28px; --r-full:999px;
  --sh-sm:0 1px 2px rgba(28,26,22,.05);
  --sh:0 4px 20px -8px rgba(28,26,22,.14);
  --sh-lg:0 24px 60px -20px rgba(28,26,22,.24);

  /* Espaçamento */
  --nav-w:264px; --header-h:68px; --bottom-h:64px; --max:1180px;

  /* Movimento */
  --ease:cubic-bezier(.22,.61,.36,1);
  --dur:.42s;
}
[data-theme="dark"]{
  --paper:#16140F;
  --surface:#1E1B15;
  --surface-2:#26221A;
  --ink:#F3EFE6;
  --ink-2:#B8B2A4;
  --ink-3:#867F70;
  --line:#302B22;
  --line-2:#2A251D;
  --clay:#E0794F;
  --clay-deep:#C25A3A;
  --clay-soft:#3A2419;
  --clay-tint:#241812;
  --sage:#6FA98F;
  --sage-soft:#1E2C25;
  --gold:#D0A150;
  --sky:#6E9CCB;
  --danger:#E27366;
  --danger-soft:#331b18;
  --sh-sm:0 1px 2px rgba(0,0,0,.3);
  --sh:0 6px 24px -8px rgba(0,0,0,.5);
  --sh-lg:0 24px 60px -20px rgba(0,0,0,.6);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.011em;
  overflow-x:hidden;
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---- Ícones: tamanho base + overrides ---- */
.i{width:1.15em;height:1.15em;flex:none;vertical-align:middle}
.av svg{width:46%;height:46%}
.photo svg.i{width:34px;height:34px}
.state .ill svg{width:100%;height:100%}
.mappin .p svg.i{width:15px;height:15px}

/* ---- Tipografia ---- */
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.12;letter-spacing:-.02em;color:var(--ink)}
.display{font-size:clamp(2.1rem,5.2vw,3.4rem);font-weight:500;line-height:1.04;letter-spacing:-.03em}
.h1{font-size:clamp(1.7rem,3.6vw,2.4rem)}
.h2{font-size:clamp(1.32rem,2.6vw,1.72rem)}
.h3{font-size:1.16rem;font-weight:600}
.eyebrow{font-family:var(--sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.lead{font-size:1.08rem;color:var(--ink-2);line-height:1.5}
.muted{color:var(--ink-3)}
.serif{font-family:var(--serif)}
a{color:inherit;text-decoration:none}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---- Botões ---- */
.btn{
  font-family:var(--sans);font-size:.92rem;font-weight:550;
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:.72em 1.25em;border-radius:var(--r-full);border:1px solid transparent;
  cursor:pointer;transition:transform .18s var(--ease),background .2s,border-color .2s,color .2s,box-shadow .2s;
  white-space:nowrap;background:none;color:var(--ink);line-height:1;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn svg{width:1.15em;height:1.15em;flex:none}
.btn-primary{background:var(--clay);color:#fff;box-shadow:var(--sh-sm)}
.btn-primary:hover{background:var(--clay-deep);box-shadow:var(--sh)}
.btn-dark{background:var(--ink);color:var(--paper)}
.btn-dark:hover{opacity:.9}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn-quiet{background:transparent;color:var(--ink-2)}
.btn-quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn-lg{padding:.92em 1.6em;font-size:1rem}
.btn-sm{padding:.52em .9em;font-size:.82rem}
.btn-block{width:100%}
.btn-icon{padding:.55em;border-radius:var(--r-full);width:2.5em;height:2.5em}

/* ---- Chips / badges ---- */
.chip{
  display:inline-flex;align-items:center;gap:.4em;font-size:.8rem;font-weight:500;
  padding:.42em .82em;border-radius:var(--r-full);background:var(--surface);
  border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:all .18s var(--ease);white-space:nowrap;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:.35em;font-size:.72rem;font-weight:600;padding:.32em .66em;border-radius:var(--r-full);letter-spacing:.01em}
.badge-clay{background:var(--clay-soft);color:var(--clay-deep)}
.badge-sage{background:var(--sage-soft);color:var(--sage)}
.badge-gold{background:#F6EDD8;color:var(--gold)}
.badge-line{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
[data-theme="dark"] .badge-gold{background:#2b2415}
.verified{display:inline-flex;align-items:center;gap:.3em;color:var(--sage);font-weight:600;font-size:.78rem}
.verified svg{width:1em;height:1em}

/* Marca de país. Substitui bandeiras emoji, que não renderizam no Windows
   e variam de forma entre sistemas — isto é idêntico em todo o lado. */
.cc{display:inline-flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--serif);font-size:.66rem;font-weight:600;letter-spacing:.07em;
  min-width:2.05em;height:1.55em;padding:0 .38em;border:1px solid var(--line);
  border-radius:4px;color:var(--ink-2);background:var(--surface);line-height:1}
.cc-lg{font-size:.78rem;min-width:2.3em;height:1.75em}
.av .cc{border:0;background:none;font-size:.72rem;color:inherit}

/* ---- Cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);transition:border-color .2s,box-shadow .2s,transform .2s var(--ease)}
.card-pad{padding:22px}
.card-hover{cursor:pointer}
.card-hover:hover{border-color:var(--ink-3);box-shadow:var(--sh);transform:translateY(-2px)}

/* ---- Inputs ---- */
.field{display:flex;flex-direction:column;gap:.4em;margin-bottom:14px}
.field label{font-size:.82rem;font-weight:550;color:var(--ink-2)}
.input,.select,textarea.input{
  font-family:var(--sans);font-size:.95rem;color:var(--ink);width:100%;
  padding:.78em 1em;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  transition:border-color .18s,box-shadow .18s;
}
.input::placeholder{color:var(--ink-3)}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
textarea.input{resize:vertical;min-height:96px;line-height:1.5}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap svg.ic{position:absolute;left:14px;width:18px;height:18px;color:var(--ink-3);pointer-events:none}
.search-wrap .input{padding-left:42px}

/* ---- Layout ---- */
.app{display:none}
.app.live{display:block}
.shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--nav-w);flex:none;position:fixed;top:0;left:0;bottom:0;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 16px;z-index:40;
}
.brand{display:flex;align-items:center;gap:.6em;padding:6px 8px 22px;font-family:var(--serif);font-size:1.32rem;font-weight:600;letter-spacing:-.02em}
.brand .mark{width:30px;height:30px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-sec{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:16px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:.75em;padding:.66em .8em;border-radius:var(--r);
  color:var(--ink-2);font-weight:500;font-size:.92rem;cursor:pointer;transition:all .16s var(--ease);position:relative;
}
.nav-item svg{width:19px;height:19px;flex:none;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--ink);color:var(--paper)}
.nav-item.on svg{opacity:1}
.nav-item .dot{margin-left:auto;background:var(--clay);color:#fff;font-size:.68rem;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center}
.nav-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.nav-user{display:flex;align-items:center;gap:.6em;padding:.5em;border-radius:var(--r);cursor:pointer}
.nav-user:hover{background:var(--surface-2)}

.main{flex:1;margin-left:var(--nav-w);min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{
  height:var(--header-h);position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 clamp(18px,4vw,40px);
}
.topbar .gsearch{flex:1;max-width:440px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.content{flex:1;padding:clamp(22px,3.5vw,40px) clamp(18px,4vw,40px) 80px;max-width:var(--max);width:100%;margin:0 auto;animation:fadeUp .5s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* mobile bits hidden on desktop */
.mobile-only{display:none!important}
.bottomnav,.mobtop{display:none}

/* ---- Progress ---- */
.pbar{height:7px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--clay);border-radius:var(--r-full);transition:width .8s var(--ease)}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--clay);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}

/* ---- Avatar ---- */
.av{border-radius:var(--r-full);object-fit:cover;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink-2);overflow:hidden}
.av-sm{width:32px;height:32px;font-size:.8rem}
.av-md{width:44px;height:44px;font-size:.95rem}
.av-lg{width:72px;height:72px;font-size:1.4rem;font-family:var(--serif)}

/* ---- Grids ---- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column}
.section{margin-top:40px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.divider{height:1px;background:var(--line);border:0;margin:0}

/* ---- Toast ---- */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{
  background:var(--ink);color:var(--paper);padding:.85em 1.2em;border-radius:var(--r-full);font-size:.9rem;font-weight:500;
  box-shadow:var(--sh-lg);display:flex;align-items:center;gap:.6em;animation:toastIn .4s var(--ease);max-width:90vw;
}
.toast.err{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* ---- Modal / drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(20,17,12,.44);backdrop-filter:blur(3px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{
  position:fixed;z-index:110;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-lg);width:min(560px,94vw);max-height:88vh;overflow-y:auto;
  left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:all .34s var(--ease);
}
.modal.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.modal-pad{padding:26px}
.modal-x{position:absolute;top:16px;right:16px}

/* drawer (mobile filters / detail) */
.drawer{
  position:fixed;z-index:110;background:var(--surface);left:0;right:0;bottom:0;border-radius:var(--r-xl) var(--r-xl) 0 0;
  max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .38s var(--ease);box-shadow:var(--sh-lg);
}
.drawer.on{transform:translateY(0)}
.drawer-grab{width:40px;height:4px;border-radius:var(--r-full);background:var(--line);margin:12px auto 4px}

/* ---- Empty / states ---- */
.state{text-align:center;padding:56px 20px;max-width:420px;margin:0 auto;animation:fadeUp .5s var(--ease)}
.state .ill{width:64px;height:64px;margin:0 auto 18px;color:var(--ink-3);opacity:.7}
.state h3{margin-bottom:8px}
.state p{color:var(--ink-3);margin-bottom:18px}
.skel{background:linear-gradient(100deg,var(--surface-2) 30%,var(--line-2) 50%,var(--surface-2) 70%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:var(--r)}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---- Checklist ---- */
.check-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.check-item:last-child{border-bottom:0}
.check-box{width:22px;height:22px;border:2px solid var(--line);border-radius:7px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.check-box svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.5);transition:all .2s var(--ease)}
.check-item.done .check-box{background:var(--sage);border-color:var(--sage)}
.check-item.done .check-box svg{opacity:1;transform:none}
.check-item.done .ci-label{color:var(--ink-3);text-decoration:line-through}

/* ---- Timeline (plano) ---- */
.tl{position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:14px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-step{position:relative;padding:0 0 26px}
.tl-step:last-child{padding-bottom:0}
.tl-node{position:absolute;left:-34px;top:0;width:30px;height:30px;border-radius:var(--r-full);background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:.82rem;font-weight:600;color:var(--ink-3);z-index:1}
.tl-step.done .tl-node{background:var(--sage);border-color:var(--sage);color:#fff}
.tl-step.now .tl-node{background:var(--clay);border-color:var(--clay);color:#fff;box-shadow:0 0 0 4px var(--clay-soft)}

/* ---- Tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.7em 1em;font-weight:550;font-size:.92rem;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .18s}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);border-color:var(--clay)}

/* ---- Photo blocks ---- */
.photo{background:var(--surface-2);position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
/* galeria do imóvel */
.galeria{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.galeria::-webkit-scrollbar{display:none}
.galeria img{width:64px;height:48px;object-fit:cover;border-radius:8px;flex:none;cursor:pointer;
  border:2px solid transparent;opacity:.65;transition:opacity .18s,border-color .18s}
.galeria img:hover{opacity:1}
.galeria img.on{opacity:1;border-color:var(--clay)}
.thumb{aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}

/* ---- Map ---- */
.mapwrap{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:
  radial-gradient(circle at 30% 20%,rgba(62,107,90,.06),transparent 40%),
  radial-gradient(circle at 70% 70%,rgba(194,90,58,.06),transparent 40%),var(--surface-2)}
.mappin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:transform .2s var(--ease)}
.mappin:hover{transform:translate(-50%,-108%) scale(1.08);z-index:5}
.mappin .p{width:30px;height:30px;border-radius:var(--r-full) var(--r-full) var(--r-full) 2px;background:var(--clay);border:2px solid var(--surface);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;transform:rotate(45deg)}
.mappin .p svg{transform:rotate(-45deg);width:15px;height:15px;color:#fff}

/* ---- Segmented ---- */
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-full);padding:3px}
.seg button{border:0;background:none;font-family:var(--sans);font-weight:550;font-size:.85rem;color:var(--ink-2);padding:.5em 1em;border-radius:var(--r-full);cursor:pointer;transition:all .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}

/* ---- Command palette ---- */
.cmdk{position:fixed;left:50%;top:12vh;transform:translateX(-50%) translateY(-8px);width:min(600px,94vw);z-index:120;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:all .28s var(--ease);overflow:hidden}
.cmdk.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmdk-in input{border:0;background:none;font-family:var(--sans);font-size:1.05rem;color:var(--ink);width:100%;outline:none}
.cmdk-res{max-height:52vh;overflow-y:auto;padding:8px}
.cmdk-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r);cursor:pointer}
.cmdk-row:hover,.cmdk-row.sel{background:var(--surface-2)}
.cmdk-row .k{margin-left:auto;font-size:.72rem;color:var(--ink-3)}
.cmdk-cat{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:12px 12px 4px}
kbd{font-family:var(--sans);font-size:.72rem;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:.15em .45em;color:var(--ink-2)}

/* ---- Notes / callouts ---- */
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);font-size:.9rem;line-height:1.5}
.callout svg{width:20px;height:20px;flex:none;margin-top:1px}
.callout-warn{background:#F8EEDD;color:#7A5A1E}
[data-theme="dark"] .callout-warn{background:#2a2113;color:var(--gold)}
.callout-info{background:var(--sage-soft);color:var(--sage)}
.callout-clay{background:var(--clay-tint);color:var(--clay-deep)}

.link-official{display:inline-flex;align-items:center;gap:.4em;color:var(--sky);font-weight:550;font-size:.9rem}
.link-official svg{width:1em;height:1em}

/* ---- Onboarding ---- */
.ob{position:fixed;inset:0;z-index:300;background:var(--paper);overflow-y:auto;display:none}
.ob.live{display:block}
.ob-wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:clamp(24px,5vw,48px) 24px}
.ob-top{display:flex;align-items:center;gap:12px;margin-bottom:auto;padding-top:8px}
.ob-prog{flex:1;height:4px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden}
.ob-prog>i{display:block;height:100%;background:var(--clay);transition:width .5s var(--ease)}
.ob-body{margin:auto 0;padding:32px 0;animation:fadeUp .45s var(--ease)}
.ob-body h1{margin-bottom:12px}
.opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;margin-bottom:10px;transition:all .18s var(--ease)}
.opt:hover{border-color:var(--ink-3)}
.opt.on{border-color:var(--clay);background:var(--clay-tint)}
.opt .flag{font-size:1.5rem;line-height:1}
.opt .tick{margin-left:auto;width:22px;height:22px;border-radius:var(--r-full);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:all .2s}
.opt .tick svg{width:13px;height:13px;color:#fff;opacity:0}
.opt.on .tick{background:var(--clay);border-color:var(--clay)}
.opt.on .tick svg{opacity:1}
.ob-foot{padding-top:20px;display:flex;gap:12px;align-items:center}

/* ---- Utilities ---- */
.mt0{margin-top:0}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.mb0{margin-bottom:0}.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.gap4{gap:4px}.gap8{gap:8px}.gap6{gap:6px}.gap16{gap:16px}.gap20{gap:20px}
.fs-sm{font-size:.85rem}.fs-xs{font-size:.78rem}
.fw6{font-weight:600}.fw5{font-weight:550}
.tc{text-align:center}.tr{text-align:right}
.flex1{flex:1}.mla{margin-left:auto}
.hide{display:none!important}
.clay{color:var(--clay)}.sage{color:var(--sage)}
.price{font-family:var(--serif);font-weight:600}
.line-clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scroll-x{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 calc(-1*clamp(18px,4vw,40px));padding-left:clamp(18px,4vw,40px);padding-right:clamp(18px,4vw,40px)}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x>*{flex:none}

/* ============================================================
   ASSISTENTE (camada de IA)
   ============================================================ */
.ai-fab{
  position:fixed;right:22px;bottom:22px;z-index:90;width:56px;height:56px;border-radius:var(--r-full);
  background:var(--ink);color:var(--paper);border:0;cursor:pointer;box-shadow:var(--sh-lg);
  display:flex;align-items:center;justify-content:center;transition:transform .25s var(--ease),background .2s;
}
.ai-fab:hover{transform:scale(1.06)}
.ai-fab:active{transform:scale(.95)}
.ai-fab svg{width:24px;height:24px}

.ai-panel{
  position:fixed;right:22px;bottom:22px;z-index:130;width:min(430px,calc(100vw - 44px));height:min(660px,calc(100vh - 44px));
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;overflow:hidden;
  opacity:0;pointer-events:none;transform:translateY(16px) scale(.97);transform-origin:bottom right;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
}
.ai-panel.on{opacity:1;pointer-events:auto;transform:none}
.ai-head{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--line);flex:none}
.ai-avatar{width:38px;height:38px;border-radius:var(--r-full);background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;flex:none}
.ai-avatar svg{width:19px;height:19px}
.ai-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--paper)}
.ai-foot{flex:none;border-top:1px solid var(--line);padding:12px 14px;background:var(--surface)}
.ai-input{display:flex;gap:8px;align-items:flex-end}
.ai-input textarea{
  flex:1;border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-family:var(--fb,var(--sans,inherit));
  font-size:.92rem;resize:none;background:var(--surface);color:var(--ink);max-height:110px;min-height:40px;line-height:1.4;
}
.ai-input textarea:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}

/* mensagens */
.ai-msg{max-width:88%;font-size:.92rem;line-height:1.55;animation:aiIn .35s var(--ease)}
@keyframes aiIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ai-msg.user{align-self:flex-end;background:var(--clay);color:#fff;padding:10px 14px;border-radius:16px;border-bottom-right-radius:5px}
.ai-msg.bot{align-self:flex-start;width:100%;max-width:100%}
.ai-bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px;padding:14px 16px}
.ai-bubble p+p{margin-top:9px}
.ai-bubble b{font-weight:650}
.ai-bubble ul{list-style:none;margin:10px 0 0;display:flex;flex-direction:column;gap:7px}
.ai-bubble li{display:flex;gap:8px;align-items:flex-start;font-size:.89rem}
.ai-bubble li>span:first-child{color:var(--sage);flex:none;margin-top:2px;width:15px}
.ai-src{display:flex;align-items:center;gap:.4em;font-size:.72rem;color:var(--ink-3);margin-top:10px;padding-top:9px;border-top:1px solid var(--line-2)}
.ai-src svg{width:13px;height:13px}

/* cartões de resultado dentro da resposta */
.ai-cards{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.ai-card{display:flex;gap:11px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer;transition:border-color .18s,transform .18s var(--ease)}
.ai-card:hover{border-color:var(--ink-3);transform:translateX(2px)}
.ai-card .aic-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface);color:var(--ink-2)}
.ai-card .aic-ic svg{width:17px;height:17px}
.ai-card .aic-t{font-weight:600;font-size:.87rem;line-height:1.25}
.ai-card .aic-s{font-size:.76rem;color:var(--ink-3);line-height:1.3}

/* acções */
.ai-acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.ai-act{font-size:.82rem;font-weight:550;padding:.52em .95em;border-radius:var(--r-full);background:var(--ink);color:var(--paper);border:0;cursor:pointer;display:inline-flex;align-items:center;gap:.4em;transition:opacity .18s,transform .16s var(--ease)}
.ai-act:hover{opacity:.88} .ai-act:active{transform:scale(.96)}
.ai-act svg{width:14px;height:14px}
.ai-act.soft{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.ai-act.soft:hover{border-color:var(--ink-3)}

/* aviso jurídico dentro da resposta */
.ai-warn{display:flex;gap:9px;padding:11px 13px;border-radius:var(--r);font-size:.82rem;line-height:1.45;margin-top:11px;background:var(--clay-tint);color:var(--clay-deep)}
.ai-warn svg{width:16px;height:16px;flex:none;margin-top:2px}
.ai-note{display:flex;gap:9px;padding:11px 13px;border-radius:var(--r);font-size:.82rem;line-height:1.45;margin-top:11px;background:var(--sage-soft);color:var(--sage)}
.ai-note svg{width:16px;height:16px;flex:none;margin-top:2px}

/* sugestões */
.ai-sugs{display:flex;flex-wrap:wrap;gap:7px}
.ai-sug{font-size:.82rem;padding:.5em .9em;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:all .18s var(--ease);text-align:left}
.ai-sug:hover{border-color:var(--clay);color:var(--clay);background:var(--clay-tint)}

/* a escrever */
.ai-typing{display:flex;gap:4px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px;width:fit-content}
.ai-typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:aiDot 1.3s infinite}
.ai-typing i:nth-child(2){animation-delay:.18s} .ai-typing i:nth-child(3){animation-delay:.36s}
@keyframes aiDot{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ============================================================
   RESPONSIVO — experiência mobile própria
   ============================================================ */
@media (max-width:900px){
  .sidebar{display:none}
  .main{margin-left:0}
  .desktop-only{display:none!important}
  .mobile-only{display:flex!important}
  .topbar{display:none}
  .mobtop{display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;position:sticky;top:0;z-index:30;
    background:color-mix(in srgb,var(--paper) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .mobtop .brand{padding:0;font-size:1.18rem}
  .content{padding:18px 18px calc(var(--bottom-h) + 34px);max-width:100%}
  .bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(var(--bottom-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:40;
  }
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:.66rem;font-weight:550;cursor:pointer;position:relative;transition:color .18s}
  .bn-item svg{width:23px;height:23px}
  .bn-item.on{color:var(--clay)}
  .bn-item .bdot{position:absolute;top:8px;right:calc(50% - 16px);width:7px;height:7px;background:var(--clay);border-radius:var(--r-full);border:1.5px solid var(--surface)}
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .display{font-size:2rem}
  .modal{border-radius:var(--r-xl);top:auto;bottom:0;left:0;transform:translateY(100%);width:100%;max-width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0}
  .modal.on{transform:translateY(0)}
  .modal-pad{padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
  .cmdk{top:0;left:0;transform:none;width:100%;border-radius:0;height:100vh;max-height:100vh}
  .cmdk.on{transform:none}
  .cmdk-res{max-height:calc(100vh - 70px)}
  .section-head .h2{font-size:1.3rem}
  /* assistente em mobile: acima da bottom-nav, e painel em ecrã inteiro */
  .ai-fab{right:16px;bottom:calc(var(--bottom-h) + 16px + env(safe-area-inset-bottom));width:52px;height:52px}
  .ai-panel{right:0;left:0;bottom:0;top:0;width:100%;height:100%;border-radius:0;transform:translateY(100%);transform-origin:center}
  .ai-panel.on{transform:none}
  .ai-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
@media (max-width:560px){
  .g3,.g4{grid-template-columns:1fr}
  .hide-xs{display:none!important}
}
@media (min-width:901px){.only-mobile-flow{display:none}}
</style>
</head>

    </div>`;
  } else if(obStep===3){
    body=`<div class="ob-body">
      <div class="eyebrow mb8">Passo 3 de 4</div>
      <h1 class="h1">Onde estás em Portugal?</h1>
      <p class="lead mt8 mb16">A tua cidade ajuda-nos a mostrar o que está perto de ti.</p>

  } else if(obStep===4){
    body=`<div class="ob-body">
      <div class="eyebrow mb8">Passo 4 de 4</div>

        <span class="tick">${svg('check')}</span></div>`).join('')}
    </div>`;
  } else if(obStep===5){
    // Gerar plano
    body=`<div class="ob-body">
      <div class="eyebrow mb12" style="color:var(--clay)">O teu plano em Portugal</div>

        <div class="muted fs-sm">${esc(p.desc)}</div></div>`).join('')}</div>
    </div>`;
  }
  const showBack=obStep>0&&obStep<5;
  const foot=obStep===0?'':`<div class="ob-foot">

function obCityFilter(q){const list=el('obCityList');if(!list)return;const f=CITIES.filter(c=>c.toLowerCase().includes((q||'').toLowerCase()));list.innerHTML=f.length?f.map(c=>`<div class="opt ${obTemp.city===c?'on':''}" style="margin-bottom:0" onclick="obTemp.city='${c}';drawOb()"><span style="color:var(--ink-3);width:20px">${svg('pin')}</span><span class="fw5">${esc(c)}</span><span class="tick">${svg('check')}</span></div>`).join(''):`<p class="muted fs-sm" style="padding:8px">Escreve o nome da tua cidade e continua.</p>`}
function obToggleSit(id){const i=obTemp.situations.indexOf(id);if(i>=0)obTemp.situations.splice(i,1);else obTemp.situations.push(id);drawOb()}
function obNext(){
  if(obStep===1&&!obTemp.name.trim()){toast('Diz-nos como te chamas.','err');return}
  if(obStep===2&&!obTemp.country){toast('Escolhe o teu país de origem.','err');return}
  if(obStep===3&&!obTemp.city){toast('Escolhe a tua cidade.','err');return}
  if(obStep===4&&!obTemp.situations.length){toast('Escolhe pelo menos uma opção.','err');return}
  obStep++;drawOb();window.scrollTo(0,0);
}
function obBack(){if(obStep>0){obStep--;drawOb()}}
function obFinish(){
  S.name=obTemp.name.trim();S.country=obTemp.country;S.city=obTemp.city;S.situations=obTemp.situations;S.onboarded=true;
  save();el('ob').classList.remove('live');startApp();toast('Plano criado');
}

      <div class="search-wrap">${svg('pin','ic')}<input class="input" placeholder="Localização (ex: Lisboa, Setúbal)" id="jobLoc" oninput="jobF.q2=this.value;renderJobList()"></div>
    </div>
    <div class="row wrap gap6">
      <span class="chip ${!jobF.sector?'on':''}" onclick="jobF.sector='';go('jobs')">Todos os setores</span>
      ${JOB_SECTORS.slice(0,8).map(s=>`<span class="chip ${jobF.sector===s?'on':''}" onclick="jobF.sector='${jobF.sector===s?'':s}';go('jobs')">${esc(s)}</span>`).join('')}
      <span class="chip ${jobF.noexp?'on':''}" onclick="jobF.noexp=!jobF.noexp;go('jobs')">${svg('check')} Sem experiência</span>
    </div>
  </div>
  <div id="jobList"></div>
  `;
};
function filterJobs(){return vagas().filter(j=>{
  const q=(jobF.q||'').toLowerCase(),q2=(jobF.q2||'').toLowerCase();
  if(q&&!(j.role.toLowerCase().includes(q)||j.company.toLowerCase().includes(q)||j.sector.toLowerCase().includes(q)))return false;
  if(q2&&!(j.city.toLowerCase().includes(q2)||j.area.toLowerCase().includes(q2)))return false;
  if(jobF.sector&&j.sector!==jobF.sector)return false;
  if(jobF.noexp&&j.exp)return false;
  return true;
})}
function renderJobList(){
  const l=filterJobs();const t=el('jobList');if(!t)return;
  t.innerHTML=`<div class="row between mb12"><span class="muted fs-sm">${l.length} ${l.length===1?'vaga encontrada':'vagas encontradas'}</span></div>`+
    (l.length?`<div class="grid g2">${l.map(jobCard).join('')}</div>`
    :emptyState('search','Não encontrámos vagas assim','Tenta alargar a pesquisa ou remover alguns filtros.',`<button class="btn btn-ghost" onclick="jobF={q:'',q2:'',sector:'',noexp:false};go('jobs')">${svg('reload')} Limpar filtros</button>`));
}
function toggleSaveJob(id){const i=S.savedJobs.indexOf(id);if(i>=0){S.savedJobs.splice(i,1);toast('Removido dos guardados')}else{S.savedJobs.push(id);toast('Vaga guardada')}save();if(S.route==='jobs')renderJobList();else if(S.route==='applications')go('applications')}
function openJob(id){
  const j=vagas().find(x=>x.id===id);if(!j)return;
  const saved=S.savedJobs.includes(id),applied=S.appliedJobs[id];
  openModal(`<div class="modal-pad">
    <button class="btn btn-quiet btn-icon modal-x" onclick="closeModal()">${svg('x')}</button>
    <div class="av av-lg" style="background:var(--surface-2);color:var(--ink-2);border-radius:16px;width:52px;height:52px">${svg('briefcase')}</div>

    <div class="muted mb12">${esc(j.company)} · ${esc(j.area)}, ${esc(j.city)}</div>
    <div class="row wrap gap6 mb16">
      <span class="badge badge-clay">${svg('euro')} ${esc(j.salary)}</span>
      <span class="badge badge-line">${esc(j.type)}</span>
      <span class="badge badge-line">${svg('clock')} ${esc(j.schedule)}</span>
      ${!j.exp?'<span class="badge badge-sage">Sem experiência</span>':'<span class="badge badge-line">Experiência necessária</span>'}
    </div>
    <p class="mb16">${esc(j.desc)}</p>
    <div class="eyebrow mb8">Requisitos</div>
    <ul style="list-style:none;display:flex;flex-direction:column;gap:6px" class="mb16">${j.req.map(r=>`<li class="row gap8"><span class="clay" style="width:16px;flex:none">${svg('check')}</span>${esc(r)}</li>`).join('')}</ul>
    <div class="eyebrow mb8">O que oferecem</div>

    <div class="row gap8">
      <button class="btn btn-ghost btn-icon" onclick="toggleSaveJob('${j.id}');closeModal()" style="color:${saved?'var(--clay)':''}">${svg('bookmark')}</button>
      <button class="btn btn-primary flex1 btn-lg" onclick="applyJob('${j.id}')">${applied?'Candidatura enviada':'Candidatar-me'}</button>
    </div>

function applyJob(id){

  S.appliedJobs[id]='Candidatura enviada';const si=S.savedJobs.indexOf(id);if(si>=0)S.savedJobs.splice(si,1);
  save();closeModal();toast('Candidatura enviada');go('applications');
}

  const applied=Object.keys(S.appliedJobs).map(id=>({j:vagas().find(x=>x.id===id),st:S.appliedJobs[id]})).filter(x=>x.j);

/* Exportação RGPD: junta o estado local e, havendo conta, o que está no servidor. */
async function exportarDados(){
  const pacote={
    exportado_em:new Date().toISOString(),
    origem:'KEVIMA',
    conta:signedIn()?{email:SB_USER.email,id:SB_USER.id}:null,
    perfil:{nome:S.name,pais:countryName(),cidade:S.city,situacoes:S.situations},
    plano:{concluidos:Object.keys(S.planDone).filter(k=>S.planDone[k]),total:PLAN.length},
    documentacao:S.docChecks,
    guardados:{vagas:S.savedJobs,casas:S.savedHomes,eventos:S.savedEvents,grupos:S.joinedGroups,profissionais:S.contactedPros},
    candidaturas:S.appliedJobs,
    perguntas_sem_resposta:S.aiUnknown||[]
  };
  if(signedIn()){
    try{
      const uid=SB_USER.id;
      const [{data:g},{data:c}]=await Promise.all([
        sb.from('saved_items').select('kind,item_id').eq('user_id',uid),
        sb.from('applications').select('job_id,status,created_at').eq('user_id',uid)]);
      pacote.servidor={guardados:g||[],candidaturas:c||[]};
    }catch(e){pacote.servidor={erro:'não foi possível ler do servidor'}}
  }
  const blob=new Blob([JSON.stringify(pacote,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='bussola-os-meus-dados.json';
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Dados exportados');
}

/* Apagar ficheiros do utilizador. Apagar a conta não os leva atrás:
   não há cascata de auth.users para storage. Sem isto, documentos de
   identidade ficavam no servidor depois de a pessoa pedir para sair. */
async function apagarFicheiros(uid){
  for(const balde of ['documentos','avatars']){
    try{
      const {data}=await sb.storage.from(balde).list(uid,{limit:100});
      if(data&&data.length){
        await sb.storage.from(balde).remove(data.map(f=>`${uid}/${f.name}`));
      }
    }catch(e){console.warn('limpar '+balde+' falhou:',e&&e.message)}
  }
}
async function apagarConfirmado(){
  if(signedIn()){
    try{
      const uid=SB_USER.id;
      await apagarFicheiros(uid);            // ficheiros primeiro: depois do signOut já não há permissão
      await Promise.all([
        sb.from('plan_progress').delete().eq('user_id',uid),
        sb.from('doc_checklist').delete().eq('user_id',uid),
        sb.from('saved_items').delete().eq('user_id',uid),
        sb.from('applications').delete().eq('user_id',uid),
      ]);

function openCmdk(){el('cmdk').classList.add('on');el('scrim').classList.add('on');document.body.style.overflow='hidden';

function cmdkFilter(q){
  const idx=searchIndex();q=(q||'').toLowerCase().trim();
  cmdkResults=q?idx.filter(i=>(i.t+' '+i.s+' '+i.cat).toLowerCase().includes(q)).slice(0,20):idx.filter(i=>i.cat==='Ir para');

}
function cmdkKey(e){
  if(e.key==='ArrowDown'){e.preventDefault();cmdkSel=Math.min(cmdkSel+1,cmdkResults.length-1);cmdkPaint()}
  else if(e.key==='ArrowUp'){e.preventDefault();cmdkSel=Math.max(cmdkSel-1,0);cmdkPaint()}
  else if(e.key==='Enter'){e.preventDefault();cmdkGo(cmdkSel)}
}
function cmdkPaint(){$$('.cmdk-row').forEach(r=>{const on=+r.dataset.i===cmdkSel;r.classList.toggle('sel',on);if(on)r.scrollIntoView({block:'nearest'})})}
function cmdkGo(i){const r=cmdkResults[i];if(!r)return;closeCmdk();setTimeout(()=>r.go(),120)}

function tempoDesde(iso){
  if(!iso)return 'recente';
  const d=Math.floor((Date.now()-new Date(iso))/86400000);
  return d<=0?'hoje':d===1?'há 1 dia':'há '+d+' dias';
}

/* ---------- Sincronização ---------- */
function syncSoon(){ if(!signedIn())return; clearTimeout(syncTimer); syncTimer=setTimeout(syncPush,1200) }
async function syncPush(){
  if(!signedIn()||SB_SYNCING)return; SB_SYNCING=true;
  const uid=SB_USER.id;
  /* O cliente devolve o erro no resultado em vez de o lançar, por isso
     um try/catch sozinho não apanha falhas de base de dados. */
  const check=async(p)=>{const r=await p; if(r&&r.error)throw r.error; return r};
  try{
    await check(sb.from('profiles').upsert({id:uid,name:S.name,country_id:S.country,city:S.city,situations:S.situations,updated_at:new Date().toISOString()}));
    const passos=Object.keys(S.planDone).filter(k=>S.planDone[k]).map(step_id=>({user_id:uid,step_id}));
    if(passos.length)await check(sb.from('plan_progress').upsert(passos));
    const checks=[];
    Object.entries(S.docChecks).forEach(([doc_id,itens])=>Object.entries(itens).forEach(([i,v])=>{
      if(v)checks.push({user_id:uid,doc_id,item_index:+i,done:true})}));
    if(checks.length)await check(sb.from('doc_checklist').upsert(checks));
    const guardados=[
      ...S.savedJobs.map(id=>({user_id:uid,kind:'job',item_id:id})),
      ...S.savedHomes.map(id=>({user_id:uid,kind:'home',item_id:id})),
      ...S.savedEvents.map(id=>({user_id:uid,kind:'event',item_id:id})),
      ...S.joinedGroups.map(id=>({user_id:uid,kind:'group',item_id:id})),
      ...S.contactedPros.map(id=>({user_id:uid,kind:'pro',item_id:id})),
    ];
    if(guardados.length)await check(sb.from('saved_items').upsert(guardados));
    const cands=Object.entries(S.appliedJobs).map(([job_id,status])=>({user_id:uid,job_id,status}));
    if(cands.length)await check(sb.from('applications').upsert(cands,{onConflict:'user_id,job_id'}));
  }catch(e){
    await sessaoOrfa(e);
    console.warn('sync push falhou:',e&&e.message);
  }
  SB_SYNCING=false;
}

/* Uma sessão pode sobreviver ao utilizador: se a conta for apagada
   noutro dispositivo ou por um administrador, o token continua válido
   mas já não há linha em auth.users. Sem isto, cada gravação falhava
   em silêncio e a pessoa só descobria que perdeu tudo mais tarde. */
async function sessaoOrfa(e){
  const codigo=e&&(e.code||e.details);
  const fk=String(codigo||'').includes('23503')||/foreign key constraint/i.test(String(e&&e.message));
  if(!fk)return false;
  try{await sb.auth.signOut()}catch(_){}
  SB_USER=null; renderShell();
  toast('A tua conta já não existe no servidor. Continuas a usar a app neste dispositivo.','err');
  return true;
}
async function syncPull(){
  if(!signedIn())return;
  const uid=SB_USER.id;
  try{
    const [{data:prof},{data:passos},{data:checks},{data:guard},{data:cands}]=await Promise.all([
      sb.from('profiles').select('*').eq('id',uid).maybeSingle(),
      sb.from('plan_progress').select('step_id').eq('user_id',uid),
      sb.from('doc_checklist').select('doc_id,item_index,done').eq('user_id',uid),
      sb.from('saved_items').select('kind,item_id').eq('user_id',uid),
      sb.from('applications').select('job_id,status').eq('user_id',uid),
    ]);
    // perfil: o servidor só ganha se tiver dados (não apagar o que é local)
    if(prof){
      if(prof.name)S.name=prof.name;
      if(prof.country_id)S.country=prof.country_id;
      if(prof.city)S.city=prof.city;
      if(prof.situations&&prof.situations.length)S.situations=prof.situations;
      S.onboarded=true;
    }
    // união: nunca perder progresso de nenhum dos lados
    (passos||[]).forEach(p=>S.planDone[p.step_id]=true);
    (checks||[]).forEach(c=>{if(c.done){S.docChecks[c.doc_id]=S.docChecks[c.doc_id]||{};S.docChecks[c.doc_id][c.item_index]=true}});
    const porTipo=k=>(guard||[]).filter(g=>g.kind===k).map(g=>g.item_id);
    const uniao=(a,b)=>[...new Set([...(a||[]),...b])];
    S.savedJobs=uniao(S.savedJobs,porTipo('job'));
    S.savedHomes=uniao(S.savedHomes,porTipo('home'));
    S.savedEvents=uniao(S.savedEvents,porTipo('event'));
    S.joinedGroups=uniao(S.joinedGroups,porTipo('group'));
    S.contactedPros=uniao(S.contactedPros,porTipo('pro'));
    (cands||[]).forEach(c=>{if(!S.appliedJobs[c.job_id])S.appliedJobs[c.job_id]=c.status});
    save();
  }catch(e){ await sessaoOrfa(e); console.warn('sync pull falhou:',e&&e.message) }
}

/* ============================================================
   ASSISTENTE — camada de IA ancorada (grounded)
   ------------------------------------------------------------
   Princípio: sobre procedimentos oficiais, o assistente SÓ pode
   dizer o que está no conteúdo validado da plataforma (DOCS e
   restantes dados). Não gera texto livre sobre requisitos legais,
   por isso não os pode inventar. Quando o caso exige análise
   profissional, encaminha em vez de opinar.

   Para ligar um modelo real: ver aiAskModel() no fim do bloco.
   ============================================================ */
let AI_OPEN=false, AI_MSGS=[], AI_H=[], AI_BUSY=false;
const aiNorm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\s€]/g,' ').replace(/\s+/g,' ').trim();
const aiHas=(q,ws)=>ws.some(w=>q.includes(aiNorm(w)));
const aiDoc=id=>DOCS.find(d=>d.id===id);
function aiHandler(fn){AI_H.push(fn);return AI_H.length-1}

/* ---------- Painel ---------- */
function aiToggle(){AI_OPEN?aiClose():aiOpen()}
function aiOpen(){
  AI_OPEN=true;el('aiPanel').classList.add('on');el('aiFab').classList.add('hide');
  if(!AI_MSGS.length)aiGreet();
  aiRender();setTimeout(()=>{const t=el('aiIn');if(t&&window.innerWidth>900)t.focus()},260);
}
function aiClose(){AI_OPEN=false;el('aiPanel').classList.remove('on');el('aiFab').classList.remove('hide')}
function aiGreet(){
  const nome=firstName();
  const feito=planDoneCount(),falta=PLAN.find(p=>!S.planDone[p.id]);
  AI_MSGS.push({r:'bot',a:{
    text:`<p>Olá${nome?', '+esc(nome):''}. <b>Como posso ajudar?</b></p>`+
      `<p>Posso explicar-te processos de documentação, encontrar trabalho e casa na tua zona, ou ajudar-te a falar com um profissional.</p>`+
      (falta?`<p class="muted fs-sm">O teu plano vai em ${feito} de ${PLAN.length} passos — o próximo é <b>${esc(falta.title)}</b>.</p>`:''),
    sugs:['Cheguei ontem a Portugal. O que devo tratar primeiro?','Quero procurar trabalho em '+(S.city||'Lisboa'),'Preciso encontrar um quarto até 500€','Quero falar com um advogado']
  }});
}
function aiRender(){
  const p=el('aiPanel');
  p.innerHTML=`
    <div class="ai-head">
      <div class="ai-avatar">${svg('compass')}</div>
      <div style="flex:1;min-width:0">
        <div class="fw6" style="font-size:.95rem">Assistente da KEVIMA</div>
        <div class="muted fs-xs">Responde com base no conteúdo verificado</div>
      </div>
      <button class="btn btn-quiet btn-icon" onclick="aiReset()" title="Recomeçar conversa">${svg('reload')}</button>
      <button class="btn btn-quiet btn-icon" onclick="aiClose()" aria-label="Fechar">${svg('x')}</button>
    </div>
    <div class="ai-body" id="aiBody">
      ${AI_MSGS.map(aiMsgHTML).join('')}
      ${AI_BUSY?`<div class="ai-typing"><i></i><i></i><i></i></div>`:''}
    </div>
    <div class="ai-foot">
      <div class="ai-input">
        <textarea id="aiIn" rows="1" placeholder="Escreve a tua pergunta…" oninput="aiGrow(this)"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();aiSend()}"></textarea>
        <button class="btn btn-primary btn-icon" onclick="aiSend()" aria-label="Enviar">${svg('send')}</button>
      </div>
      <p class="muted fs-xs mt8" style="text-align:center">Orientação, não aconselhamento jurídico.</p>
    </div>`;
  aiScroll();
}
function aiMsgHTML(m){
  if(m.r==='user')return `<div class="ai-msg user">${esc(m.t)}</div>`;
  const a=m.a;
  return `<div class="ai-msg bot"><div class="ai-bubble">
    ${a.text||''}
    ${a.cards&&a.cards.length?`<div class="ai-cards">${a.cards.map(c=>`
      <div class="ai-card" onclick="AI_H[${c.h}]()">
        <div class="aic-ic">${svg(c.ic)}</div>
        <div style="flex:1;min-width:0"><div class="aic-t">${esc(c.t)}</div><div class="aic-s">${esc(c.s)}</div></div>
        ${svg('chevr','')}
      </div>`).join('')}</div>`:''}
    ${a.warn?`<div class="ai-warn">${svg('info')}<div>${a.warn}</div></div>`:''}
    ${a.note?`<div class="ai-note">${svg('shield')}<div>${a.note}</div></div>`:''}
    ${a.acts&&a.acts.length?`<div class="ai-acts">${a.acts.map(x=>`<button class="ai-act ${x.soft?'soft':''}" onclick="AI_H[${x.h}]()">${x.l}</button>`).join('')}</div>`:''}
    ${a.src?`<div class="ai-src">${svg('shield')} ${esc(a.src)}</div>`:''}
  </div>
  ${a.sugs&&a.sugs.length?`<div class="ai-sugs mt12">${a.sugs.map(s=>`<button class="ai-sug" onclick="aiAsk('${esc(s).replace(/'/g,"\\'")}')">${esc(s)}</button>`).join('')}</div>`:''}
  </div>`;
}
function aiGrow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,110)+'px'}
function aiScroll(){const b=el('aiBody');if(b)b.scrollTop=b.scrollHeight}
function aiReset(){AI_MSGS=[];AI_H=[];aiGreet();aiRender()}
function aiSend(){const t=el('aiIn');if(!t)return;const v=t.value.trim();if(!v)return;t.value='';t.style.height='auto';aiAsk(v)}
function aiAsk(q){
  if(AI_BUSY)return;
  AI_MSGS.push({r:'user',t:q});AI_BUSY=true;aiRender();
  aiResolve(q).then(a=>{AI_BUSY=false;AI_MSGS.push({r:'bot',a});aiRender()});
}
/* Tenta o modelo (Edge Function). Se não houver rede, chave ou resposta
   utilizável, cai no motor ancorado local — que responde sempre. */
let AI_REMOTO=true;   // desliga-se se a função não estiver configurada
async function aiResolve(q){
  if(SB_ON&&sb&&AI_REMOTO){
    try{
      const r=await aiAskModel(q);
      if(r&&r.resposta)return aiFromModel(r,q);
    }catch(e){
      // Se o assistente não está configurado, não vale a pena voltar a tentar
      // nesta sessão — poupa ~1 arranque a frio por pergunta.
      if(String(e&&e.message)==='nao_configurado')AI_REMOTO=false;
    }
  }
  // pausa curta só para o indicador "a escrever" ter tempo de registar
  await new Promise(r=>setTimeout(r,240+Math.random()*160));
  return aiAnswer(q);
}
/* Converte a resposta do modelo no mesmo formato de cartões e acções
   que o motor local usa, para a experiência ser indistinguível. */
function aiFromModel(r,q){
  const base=aiAnswer(q);                    // reaproveita cartões/acções ancorados
  const texto=String(r.resposta).split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join('');
  if(r.escalar)return Object.assign({},aiEscalate(q),{text:texto});
  if(r.respondido===false){
    if(q&&q.trim()){S.aiUnknown=(S.aiUnknown||[]);S.aiUnknown.push({q:q.trim(),t:Date.now()});save()}
    return Object.assign({},aiUnknown(''),{text:texto});
  }
  return Object.assign({},base,{text:texto,src:base.src||'Conteúdo verificado da KEVIMA'});
}

/* ---------- Extractores ---------- */
function aiCityOf(q){const n=aiNorm(q);return CITIES.find(c=>n.includes(aiNorm(c)))||null}
function aiPriceOf(q){const m=aiNorm(q).match(/(\d{2,4})\s*(?:€|euros?|eur)?/);if(!m)return null;const v=+m[1];return v>=80&&v<=3000?v:null}

/* ---------- Construtores de resposta ancorada ---------- */
const AI_DISCLAIMER='Esta informação é orientação com base no conteúdo verificado da KEVIMA. Para o teu caso concreto, fala com um profissional qualificado.';
function aiDocAnswer(id,lead){
  const d=aiDoc(id);if(!d)return aiUnknown('');
  return {
    text:`${lead?`<p>${lead}</p>`:''}<p><b>${esc(d.title)}</b> — ${esc(d.summary)}</p>`+
      `<p class="fs-sm muted" style="margin-top:9px"><b>O que precisas de levar:</b></p>`+
      `<ul>${d.need.slice(0,5).map(n=>`<li><span>${svg('check')}</span>${esc(n)}</li>`).join('')}</ul>`+
      `<p class="fs-sm" style="margin-top:10px"><b>Onde tratar:</b> ${esc(d.where)}</p>`+
      `<p class="fs-sm"><b>Custo:</b> ${esc(d.cost)}</p>`+
      `<p class="fs-sm"><b>Prazos:</b> ${esc(d.deadline)}</p>`,
    cards:[{ic:d.icon,t:d.title,s:'Ver o processo completo, passo a passo e checklist',h:aiHandler(()=>{aiClose();openDoc(d.id)})}],
    acts:[{l:'Encontrar apoio jurídico',h:aiHandler(()=>{aiClose();go('pros')}),soft:true}],
    warn:AI_DISCLAIMER,
    src:'Centro de documentação · '+d.cat
  };
}
function aiJobsAnswer(q){
  const city=aiCityOf(q)||S.city;
  let list=vagas().filter(j=>j.city===city);
  const alargou=!list.length; if(alargou)list=vagas().slice();
  const semExp=list.filter(j=>!j.exp);
  const top=(semExp.length?semExp:list).slice(0,3);
  return {
    text:`<p>${alargou?`Não encontrei vagas em <b>${esc(city)}</b> neste momento, por isso alarguei a pesquisa.`:`Encontrei <b>${list.length} ${list.length===1?'vaga':'vagas'}</b> em ${esc(city)}.`}</p>`+
      (semExp.length?`<p class="fs-sm">${semExp.length} ${semExp.length===1?'não exige':'não exigem'} experiência — costuma ser o melhor ponto de partida para quem chegou há pouco.</p>`:''),
    cards:top.map(j=>({ic:'work',t:j.role,s:`${j.company} · ${j.city} · ${j.salary}`,h:aiHandler(()=>{aiClose();openJob(j.id)})})),
    acts:[{l:'Ver todas as vagas',h:aiHandler(()=>{aiClose();jobF={q:'',q2:'',sector:'',noexp:false};go('jobs')})},
          {l:'Só sem experiência',h:aiHandler(()=>{aiClose();jobF={q:'',q2:'',sector:'',noexp:true};go('jobs')}),soft:true}],
    note:'Nunca pagues para te candidatares a um emprego. Nenhuma empresa séria cobra por uma vaga.',
    src:'Bolsa de trabalho da KEVIMA'
  };
}
function aiHomesAnswer(q){
  const city=aiCityOf(q)||S.city, max=aiPriceOf(q);
  let list=casas().filter(h=>(!city||h.city===city)&&(!max||h.price<=max));
  let nota='';
  if(!list.length&&max){list=casas().filter(h=>h.price<=max);nota=`Não encontrei nada em ${esc(city)} até ${max}€, mas há opções noutras zonas.`}
  if(!list.length){list=casas().slice().sort((a,b)=>a.price-b.price);nota='Não encontrei nada dentro desses critérios — aqui ficam as opções mais baratas disponíveis.'}
  return {
    text:`<p>${nota||`Encontrei <b>${list.length} ${list.length===1?'opção':'opções'}</b>${city?' em '+esc(city):''}${max?' até '+max+'€':''}.`}</p>`,
    cards:list.slice(0,3).map(h=>({ic:'home2',t:h.title,s:`${h.price}€/mês · ${h.area}, ${h.city}${h.verified?' · Verificado':''}`,h:aiHandler(()=>{aiClose();openHome(h.id)})})),
    acts:[{l:'Ver toda a habitação',h:aiHandler(()=>{aiClose();homeF={q:'',type:'',max:0};go('homes')})},
          {l:'Como evitar burlas',h:aiHandler(()=>{aiClose();scamGuide()}),soft:true}],
    note:'Regra que te protege sempre: nunca pagues caução, sinal ou reserva antes de veres a casa em pessoa.',
    src:'Anúncios de habitação da KEVIMA'
  };
}
function aiProsAnswer(q,motivo){
  const n=aiNorm(q);
  let list=profis().slice();
  if(aiHas(n,['nacionalidade']))list=profis().filter(p=>p.spec.includes('Nacionalidade'));
  else if(aiHas(n,['familia','reagrupamento','esposa','marido','filho','filhos']))list=profis().filter(p=>p.spec.includes('Reagrupamento familiar'));
  else if(aiHas(n,['trabalho','contrato','despedi','patrao','salario']))list=profis().filter(p=>p.spec.includes('Direito do Trabalho'));
  if(!list.length)list=profis().slice();
  const local=list.filter(p=>p.city===S.city);
  const top=(local.length?local:list).slice(0,3);
  return {
    text:`<p>${motivo||'Posso ajudar-te a encontrar apoio jurídico.'}</p>`+
      `<p class="fs-sm">Estes profissionais têm as credenciais confirmadas pela equipa da KEVIMA${local.length?` e atendem em ${esc(S.city)}`:''}.</p>`,
    cards:top.map(p=>({ic:'law',t:p.name,s:`${p.prof} · ${p.city} · ${p.price}`,h:aiHandler(()=>{aiClose();openPro(p.id)})})),
    acts:[{l:'Ver todos os profissionais',h:aiHandler(()=>{aiClose();proF={q:'',spec:'',mode:''};go('pros')})}],
    src:'Diretório de profissionais verificados'
  };
}
function aiEscalate(q){
  return {
    text:`<p><b>Esta situação pode depender do teu caso.</b> Posso ajudar-te a encontrar um profissional.</p>`+
      `<p>Não te vou dar uma resposta jurídica, porque prazos, recursos e situações irregulares dependem de detalhes que só um advogado ou solicitador pode avaliar contigo — e uma resposta errada aqui podia prejudicar-te a sério.</p>`,
    cards:profis().filter(p=>p.spec.includes('Direito de Imigração')).slice(0,2).map(p=>({
      ic:'law',t:p.name,s:`${p.prof} · ${p.city} · ${p.avail}`,h:aiHandler(()=>{aiClose();openPro(p.id)})})),
    acts:[{l:'Ver apoio jurídico',h:aiHandler(()=>{aiClose();proF={q:'',spec:'Direito de Imigração',mode:''};go('pros')})},
          {l:'Serviços de apoio gratuito',h:aiHandler(()=>{aiClose();svcF='Apoio social';go('services')}),soft:true}],
    note:'Há apoio gratuito: os balcões CNAIM têm atendimento e mediadores culturais sem custo.',
    src:'Encaminhamento para profissional qualificado'
  };
}
function aiUnknown(q){
  if(q&&q.trim()){S.aiUnknown=(S.aiUnknown||[]);S.aiUnknown.push({q:q.trim(),t:Date.now()});save()}
  return {
    text:`<p><b>Ainda não sei responder a isso.</b></p>`+
      `<p>Prefiro dizer-te que não sei do que arriscar dar-te informação errada — sobretudo em assuntos que podem afectar a tua situação legal.</p>`+
      `<p class="fs-sm muted">Registámos a tua pergunta. É assim que decidimos o que acrescentar à KEVIMA a seguir.</p>`,
    acts:[{l:'Falar com um profissional',h:aiHandler(()=>{aiClose();go('pros')})},
          {l:'Ver a documentação',h:aiHandler(()=>{aiClose();docCatFilter='';go('docs')}),soft:true},
          {l:'Perguntar à comunidade',h:aiHandler(()=>{aiClose();commTab='feed';go('community')}),soft:true}],
    sugs:['O que devo tratar primeiro?','Como peço o NIF?','Quero procurar trabalho']
  };
}

/* ---------- Motor de intenções ---------- */
function aiAnswer(raw){
  const q=aiNorm(raw);
  if(!q)return aiUnknown('');

  /* 1. Casos que exigem profissional — sempre primeiro */
  /* radicais curtos de propósito: falhar aqui é pior do que encaminhar a mais */
  if(aiHas(q,['deport','expuls','indeferi','recus','recorr','recurso','tribunal','detid','detenc','juiz',
              'ilegal','irregular','sem documentos','sem papeis','perdi o prazo','prazo expir','expirou','caduc',
              'multa','coima','contraordenac','processo contra','notificad','notificac','despacho','intimac',
              'mandaram me sair','tenho de sair','vou ser mandado','o meu caso','o meu processo','fui parado']))
    return aiEscalate(raw);

  /* 2. Saudações e capacidades */
  if(aiHas(q,['ola','ole','bom dia','boa tarde','boa noite','oi ']) && q.length<26)
    return {text:`<p>Olá${firstName()?', '+esc(firstName()):''}. Diz-me o que precisas de resolver e eu trato de te apontar o caminho.</p>`,
      sugs:['O que devo tratar primeiro?','Quero procurar trabalho','Preciso de casa','Quero falar com um advogado']};
  if(aiHas(q,['o que sabes','o que podes','ajuda','como funcionas','o que fazes']))
    return {text:`<p>Posso ajudar-te com:</p><ul>`+
      `<li><span>${svg('check')}</span><b>Documentação</b> — NIF, NISS, título de residência, reagrupamento, nacionalidade, saúde, carta de condução</li>`+
      `<li><span>${svg('check')}</span><b>Trabalho</b> — vagas na tua zona, incluindo sem experiência</li>`+
      `<li><span>${svg('check')}</span><b>Casa</b> — quartos e apartamentos dentro do teu orçamento</li>`+
      `<li><span>${svg('check')}</span><b>Profissionais</b> — advogados e solicitadores verificados</li>`+
      `<li><span>${svg('check')}</span><b>Eventos e comunidade</b> — o que acontece perto de ti</li></ul>`+
      `<p class="fs-sm muted" style="margin-top:10px">Sobre procedimentos oficiais respondo só com o que está verificado na plataforma. Se não souber, digo que não sei.</p>`,
      src:'Capacidades do assistente'};

  /* 3. Primeiros passos / plano */
  if(aiHas(q,['cheguei','acabei de chegar','primeiro','por onde comeco','por onde começar','recem chegado','aterrei','o que devo tratar','o que fazer primeiro'])){
    const falta=PLAN.find(p=>!S.planDone[p.id])||PLAN[0];
    return {
      text:`<p>A ordem que costuma funcionar melhor:</p>`+
        `<ul>${PLAN.map((p,i)=>`<li><span>${S.planDone[p.id]?svg('check'):'<b>'+p.n+'</b>'}</span><b>${esc(p.title)}</b> — ${esc(p.desc)}</li>`).join('')}</ul>`+
        `<p style="margin-top:10px">Começa pelo <b>NIF</b>: é gratuito e tratas dele no mesmo dia nas Finanças. Quase tudo o resto depende dele: arrendar casa, assinar contrato, abrir conta.</p>`,
      cards:[{ic:'card',t:'Como pedir o NIF',s:'Gratuito · atribuído no próprio dia',h:aiHandler(()=>{aiClose();openDoc('nif')})},
             {ic:'compass',t:'O teu plano de chegada',s:`Próximo passo: ${falta.title}`,h:aiHandler(()=>{aiClose();go('plan')})}],
      warn:AI_DISCLAIMER,
      src:'Plano de chegada · Centro de documentação'
    };
  }
  if(aiHas(q,['meu plano','o plano','progresso','em que passo']))
    return {text:`<p>Vais em <b>${planDoneCount()} de ${PLAN.length}</b> passos.</p>`+
      `<ul>${PLAN.map(p=>`<li><span>${S.planDone[p.id]?svg('check'):svg('clock')}</span>${esc(p.title)}</li>`).join('')}</ul>`,
      acts:[{l:'Abrir o meu plano',h:aiHandler(()=>{aiClose();go('plan')})}],src:'O teu plano'};

  /* 4. Documentação — ancorada em DOCS */
  if(aiHas(q,['nif','contribuinte','financas','numero fiscal']))
    return aiDocAnswer('nif','O NIF é normalmente o primeiro documento a tratar.');
  if(aiHas(q,['niss','seguranca social','descontos']))
    return aiDocAnswer('niss','Precisas do NISS para trabalhar com contrato.');
  if(aiHas(q,['residencia','aima','sef','titulo','regularizar','legalizar','autorizacao'])){
    const a=aiDocAnswer('aima-res','Os pedidos de residência são tratados pela AIMA — o SEF já não existe.');
    return a;
  }
  if(aiHas(q,['reagrupamento','trazer a familia','trazer familia','minha esposa','meu marido','meus filhos','trazer o meu']))
    return aiDocAnswer('reagr','O reagrupamento familiar permite reunires a tua família contigo.');
  if(aiHas(q,['nacionalidade','passaporte portugues','ser portugues','cidadania']))
    return aiDocAnswer('nacio','A nacionalidade tem requisitos de tempo de residência e de língua.');
  if(aiHas(q,['saude','medico','centro de saude','utente','sns','hospital','doente']))
    return aiDocAnswer('sns','O acesso a cuidados de saúde é um direito.');
  if(aiHas(q,['carta de conducao','conduzir','carta de condu','imt','conducao']))
    return aiDocAnswer('carta','Há prazos a cumprir depois de fixares residência.');
  if(aiHas(q,['documento','documentacao','papeis','legalizacao']))
    return {text:`<p>O centro de documentação tem ${DOCS.length} processos explicados passo a passo, cada um com a sua checklist.</p>`,
      cards:DOCS.slice(0,4).map(d=>({ic:d.icon,t:d.title,s:d.cat,h:aiHandler(()=>{aiClose();openDoc(d.id)})})),
      acts:[{l:'Ver tudo',h:aiHandler(()=>{aiClose();docCatFilter='';go('docs')})}],
      warn:AI_DISCLAIMER,src:'Centro de documentação'};

  /* 5. Burlas — antes de trabalho/casa: a segurança tem precedência
        sobre a intenção aparente ("querem enganar-me com um quarto") */
  if(aiHas(q,['burla','golpe','aldrab','enganar','engan','pediram me dinheiro','pediu me dinheiro','desconfio','desconfiar','fraude','roubar','suspeito','parece me estranho','e seguro']))
    return {text:`<p>Sinais mais comuns de burla:</p>`+
      `<ul>${['Pedem sinal ou caução antes de te deixarem ver a casa','Preço muito abaixo do mercado para a zona','Só comunicam por mensagem e recusam encontro presencial','Pedem transferência para o estrangeiro ou por aplicações informais','Metem pressa para decidires "hoje"','Cobram-te para te candidatares a um emprego']
        .map(t=>`<li><span>${svg('warn')}</span>${esc(t)}</li>`).join('')}</ul>`+
      `<p style="margin-top:10px">Se algum destes sinais aparecer, <b>pára e não pagues nada</b>.</p>`,
      acts:[{l:'Guia completo',h:aiHandler(()=>{aiClose();scamGuide()})},
            {l:'Denunciar um anúncio',h:aiHandler(()=>{aiClose();go('homes')}),soft:true}],
      note:'Se já perdeste dinheiro, podes apresentar queixa às autoridades. Um profissional ou um balcão CNAIM pode orientar-te sobre como.',
      src:'Guia de segurança da KEVIMA'};

  /* 6. Trabalho */
  if(aiHas(q,['trabalho','emprego','vaga','vagas','trabalhar','contratar','contrato de trabalho','ganhar dinheiro','estagio']))
    return aiJobsAnswer(raw);

  /* 6. Casa */
  if(aiHas(q,['casa','quarto','arrendar','arrendamento','apartamento','alojamento','viver','morar','t1','t2','renda']))
    return aiHomesAnswer(raw);

  /* 7. Profissionais */
  if(aiHas(q,['advogado','advogada','solicitador','apoio juridico','juridico','consulta']))
    return aiProsAnswer(raw,'Profissionais com credenciais confirmadas pela equipa da KEVIMA.');

  /* 9. Serviços */
  if(aiHas(q,['banco','conta bancaria','cartao sim','telemovel','internet','telecomunicacoes','servico','associacao','apoio social','cnaim'])){
    const list=SERVICES.filter(s=>s.city===S.city||s.city==='Nacional');
    return {text:`<p>Serviços que costumam vir primeiro${S.city?' em '+esc(S.city):''}.</p>`,
      cards:(list.length?list:SERVICES).slice(0,3).map(s=>({ic:s.icon,t:s.name,s:`${s.cat} · ${s.city}`,h:aiHandler(()=>{aiClose();openService(s.id)})})),
      acts:[{l:'Ver todos os serviços',h:aiHandler(()=>{aiClose();svcF='';go('services')})}],
      src:'Diretório de serviços'};
  }

  /* 10. Eventos e comunidade */
  if(aiHas(q,['evento','eventos','festa','musica','kizomba','acontece','fazer no fim de semana']))
    return {text:`<p>Nos próximos dias:</p>`,
      cards:eventosL().slice(0,3).map(e=>({ic:'event',t:e.title,s:`${fmtDate(e.date)} · ${e.city} · ${e.price}`,h:aiHandler(()=>{aiClose();openEvent(e.id)})})),
      acts:[{l:'Ver todos os eventos',h:aiHandler(()=>{aiClose();evF='';go('events')})}],src:'Agenda da KEVIMA'};
  if(aiHas(q,['comunidade','conhecer pessoas','grupo','grupos','sozinho','sozinha','amigos','conterraneos']))
    return {text:`<p>Grupos mais activos na tua zona:</p>`,
      cards:GROUPS.slice(0,3).map(g=>({ic:'people',t:g.name,s:`${g.members.toLocaleString('pt-PT')} membros · ${g.city}`,h:aiHandler(()=>{aiClose();commTab='groups';go('community')})})),
      acts:[{l:'Entrar na comunidade',h:aiHandler(()=>{aiClose();commTab='feed';go('community')})}],src:'Comunidade da KEVIMA'};

  /* 11. Estudar / negócio — encaminhamento honesto */
  if(aiHas(q,['estudar','universidade','curso','escola','equivalencia','faculdade']))
    return {text:`<p>Ainda não tenho conteúdo verificado sobre estudos e equivalências — é uma das áreas que vamos acrescentar.</p>`+
      `<p>Entretanto, os balcões de apoio ao migrante orientam sobre equivalências de habilitações, e há formação certificada de português.</p>`,
      acts:[{l:'Ver serviços de apoio',h:aiHandler(()=>{aiClose();svcF='Apoio social';go('services')})},
            {l:'Perguntar à comunidade',h:aiHandler(()=>{aiClose();commTab='feed';go('community')}),soft:true}],
      src:'Área ainda em construção'};
  if(aiHas(q,['negocio','abrir empresa','empresa','empreender','atividade','trabalhar por conta propria','recibos verdes']))
    return {text:`<p>Ainda não tenho um guia verificado sobre abertura de actividade — prefiro não improvisar sobre obrigações fiscais.</p>`+
      `<p>Há contabilistas na plataforma e um grupo de empreendedores PALOP com gente que já passou por isso.</p>`,
      cards:SERVICES.filter(s=>s.cat==='Contabilidade').map(s=>({ic:s.icon,t:s.name,s:`${s.cat} · ${s.city}`,h:aiHandler(()=>{aiClose();openService(s.id)})})),
      acts:[{l:'Empreendedores PALOP',h:aiHandler(()=>{aiClose();commTab='groups';go('community')}),soft:true}],
      src:'Área ainda em construção'};

  /* 12. Não sabe — honesto */
  return aiUnknown(raw);
}

/* ------------------------------------------------------------
   COSTURA PARA MODELO REAL
   ------------------------------------------------------------
   Quando existir backend, criar uma Edge Function `ai-assistant`
   (a chave NUNCA no frontend) e trocar aiAsk() para chamar isto.
   O contexto enviado é o conteúdo verificado — o modelo reescreve,
   resume e desambigua, mas não inventa: o system prompt obriga-o a
   responder só a partir do contexto e a encaminhar quando não houver.
------------------------------------------------------------ */
function aiBuildContext(q){
  return {
    pergunta:q,
    utilizador:{cidade:S.city,pais:countryName(),situacoes:S.situations,plano:`${planDoneCount()}/${PLAN.length}`},
    documentacao:DOCS.map(d=>({id:d.id,titulo:d.title,cat:d.cat,resumo:d.summary,precisa:d.need,passos:d.steps,onde:d.where,custo:d.cost,prazos:d.deadline,alerta:d.alert,faq:d.faq})),
    trabalho:vagas().map(j=>({id:j.id,cargo:j.role,empresa:j.company,cidade:j.city,salario:j.salary,semExperiencia:!j.exp})),
    habitacao:casas().map(h=>({id:h.id,titulo:h.title,cidade:h.city,preco:h.price,tipo:h.type,verificado:h.verified})),
    profissionais:profis().map(p=>({id:p.id,nome:p.name,prof:p.prof,cidade:p.city,especialidades:p.spec,idiomas:p.langs,preco:p.price})),
    servicos:SERVICES.map(s=>({id:s.id,nome:s.name,cat:s.cat,cidade:s.city,desc:s.desc})),
    eventos:eventosL().map(e=>({id:e.id,titulo:e.title,cat:e.cat,data:e.date,hora:e.time,cidade:e.city,local:e.venue,preco:e.price}))
    /* as regras vivem no system prompt da Edge Function, fora do alcance do cliente */
  };
}
async function aiAskModel(q){
  const {data}=await sb.auth.getSession();
  const token=data?.session?.access_token||SB_ANON;   // sessão do utilizador, ou anon key
  const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),9000);
  try{
    const r=await fetch(SB_URL+'/functions/v1/ai-assistant',{
      method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SB_ANON},
      body:JSON.stringify(aiBuildContext(q))
    });
    if(r.status===503)throw new Error('nao_configurado');
    if(r.status===429){const j=await r.json().catch(()=>({}));throw new Error(j.mensagem||'limite')}
    if(!r.ok)throw new Error('indisponivel_'+r.status);
    return await r.json();
  } finally { clearTimeout(timer) }
}

   ARRANQUE
