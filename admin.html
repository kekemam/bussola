<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EF">
<title>Bússola · Consola de administração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BÚSSOLA · ADMIN — mesma identidade, consola profissional
   ============================================================ */
:root{
  --paper:#F5F1EA; --surface:#FDFCFA; --surface-2:#F0EBE1; --surface-3:#E9E3D7;
  --ink:#1C1A16; --ink-2:#57534A; --ink-3:#8A8478; --line:#E5DFD3; --line-2:#EEE9DF;
  --clay:#C25A3A; --clay-deep:#A8432A; --clay-soft:#F3E4DB; --clay-tint:#FBF1EB;
  --sage:#3E6B5A; --sage-soft:#E4EEE8; --gold:#B4842B; --gold-soft:#F6EDD8;
  --sky:#37618E; --sky-soft:#E3EAF2; --danger:#B23A2E; --danger-soft:#F6E3E0;
  --amber:#B4842B;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px; --r-full:999px;
  --sh-sm:0 1px 2px rgba(28,26,22,.05);
  --sh:0 4px 20px -8px rgba(28,26,22,.16);
  --sh-lg:0 24px 60px -20px rgba(28,26,22,.26);
  --nav-w:248px; --max:1320px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --paper:#141210; --surface:#1D1A15; --surface-2:#252119; --surface-3:#2E2920;
  --ink:#F3EFE6; --ink-2:#B8B2A4; --ink-3:#847E70; --line:#2E2920; --line-2:#282219;
  --clay:#E0794F; --clay-deep:#C25A3A; --clay-soft:#3A2419; --clay-tint:#241812;
  --sage:#6FA98F; --sage-soft:#1E2C25; --gold:#D0A150; --gold-soft:#2B2415;
  --sky:#6E9CCB; --sky-soft:#1B2531; --danger:#E27366; --danger-soft:#331B18;
  --sh-sm:0 1px 2px rgba(0,0,0,.3); --sh:0 6px 24px -8px rgba(0,0,0,.5); --sh-lg:0 24px 60px -20px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.15;letter-spacing:-.02em}
.h1{font-size:clamp(1.5rem,3vw,2rem)} .h2{font-size:1.4rem} .h3{font-size:1.08rem;font-weight:600}
.eyebrow{font-family:var(--sans);font-size:.7rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)} .fw6{font-weight:600} .fw5{font-weight:550}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:inherit;text-decoration:none}
.i{width:1.15em;height:1.15em;flex:none;vertical-align:middle}
svg{stroke-linecap:round;stroke-linejoin:round}

/* botões */
.btn{font-family:var(--sans);font-size:.86rem;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.62em 1.05em;border-radius:var(--r-full);border:1px solid transparent;cursor:pointer;transition:transform .16s var(--ease),background .18s,border-color .18s,color .18s;white-space:nowrap;background:none;color:var(--ink);line-height:1}
.btn:active{transform:scale(.97)}
.btn .i{width:1.1em;height:1.1em}
.btn-primary{background:var(--clay);color:#fff}
.btn-primary:hover{background:var(--clay-deep)}
.btn-dark{background:var(--ink);color:var(--paper)} .btn-dark:hover{opacity:.9}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)} .btn-ghost:hover{border-color:var(--ink-3)}
.btn-quiet{background:transparent;color:var(--ink-2)} .btn-quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn-sm{padding:.46em .8em;font-size:.8rem}
.btn-xs{padding:.34em .62em;font-size:.75rem}
.btn-icon{padding:.5em;width:2.3em;height:2.3em;border-radius:var(--r)}
.btn-danger{background:var(--danger-soft);color:var(--danger)} .btn-danger:hover{background:var(--danger);color:#fff}
.btn-sage{background:var(--sage-soft);color:var(--sage)} .btn-sage:hover{background:var(--sage);color:#fff}
.btn-block{width:100%}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:.4em;font-size:.72rem;font-weight:600;padding:.3em .6em;border-radius:var(--r-full);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-pend{background:var(--gold-soft);color:var(--amber)}
.pill-anal{background:var(--sky-soft);color:var(--sky)}
.pill-ok{background:var(--sage-soft);color:var(--sage)}
.pill-rej{background:var(--danger-soft);color:var(--danger)}
.pill-susp{background:var(--surface-3);color:var(--ink-2)}
.pill-live{background:var(--sage-soft);color:var(--sage)}
/* Marca de país. Substitui bandeiras emoji, que não renderizam no Windows
   e variam de forma entre sistemas — isto é idêntico em todo o lado. */
.cc{display:inline-flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--serif);font-size:.64rem;font-weight:600;letter-spacing:.07em;
  min-width:2.05em;height:1.5em;padding:0 .36em;border:1px solid var(--line);
  border-radius:4px;color:var(--ink-2);background:var(--surface);line-height:1}

.tag{display:inline-flex;align-items:center;gap:.35em;font-size:.72rem;font-weight:550;padding:.28em .58em;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

/* layout */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--nav-w);flex:none;position:fixed;inset:0 auto 0 0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.sb-brand{display:flex;align-items:center;gap:.55em;padding:18px 18px 14px;font-family:var(--serif);font-size:1.18rem;font-weight:600}
.sb-badge{font-family:var(--sans);font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--clay);border:1px solid var(--clay-soft);background:var(--clay-tint);padding:.2em .45em;border-radius:5px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px 16px;scrollbar-width:thin}
.sb-sec{font-size:.64rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 5px}
.sb-item{display:flex;align-items:center;gap:.7em;padding:.56em .7em;border-radius:var(--r);color:var(--ink-2);font-weight:500;font-size:.86rem;cursor:pointer;transition:all .14s var(--ease);margin-bottom:1px}
.sb-item .i{width:17px;height:17px;opacity:.8}
.sb-item:hover{background:var(--surface-2);color:var(--ink)}
.sb-item.on{background:var(--ink);color:var(--paper)}
.sb-item.on .i{opacity:1}
.sb-item .c{margin-left:auto;font-size:.68rem;font-weight:700;background:var(--clay);color:#fff;min-width:17px;height:17px;padding:0 5px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center}
.sb-item.on .c{background:var(--paper);color:var(--ink)}
.sb-foot{border-top:1px solid var(--line);padding:10px}
.sb-user{display:flex;align-items:center;gap:.6em;padding:.5em;border-radius:var(--r);cursor:pointer}
.sb-user:hover{background:var(--surface-2)}

.main{flex:1;margin-left:var(--nav-w);min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 84%,transparent);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 clamp(16px,3vw,32px)}
.content{flex:1;padding:clamp(20px,3vw,32px);max-width:var(--max);width:100%;margin:0 auto;animation:fadeUp .4s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}

.av{border-radius:var(--r-full);object-fit:cover;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink-2);overflow:hidden}
.av-xs{width:26px;height:26px;font-size:.68rem}
.av-sm{width:34px;height:34px;font-size:.78rem}
.av-md{width:44px;height:44px;font-size:.92rem}

/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.card-pad{padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;align-items:center} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column} .flex1{flex:1} .mla{margin-left:auto}
.section{margin-top:26px} .divider{height:1px;background:var(--line);border:0}
.gap6{gap:6px}.gap8{gap:8px}.gap16{gap:16px}.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.fs-sm{font-size:.82rem}.fs-xs{font-size:.74rem}.tc{text-align:center}.tr{text-align:right}
.clay{color:var(--clay)}.sage{color:var(--sage)}.danger{color:var(--danger)}.sky{color:var(--sky)}.gold{color:var(--gold)}
.hide{display:none!important}

/* KPI stat tiles */
.stat{padding:18px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);position:relative;overflow:hidden}
.stat .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.stat .v{font-family:var(--serif);font-size:1.9rem;font-weight:600;line-height:1;letter-spacing:-.02em}
.stat .l{color:var(--ink-3);font-size:.8rem;margin-top:5px}
.stat .d{position:absolute;top:18px;right:18px;font-size:.74rem;font-weight:650;display:inline-flex;align-items:center;gap:.2em}
.up{color:var(--sage)} .down{color:var(--danger)}

/* table */
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead th{text-align:left;font-size:.68rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
.t-actions{display:flex;gap:5px;justify-content:flex-end}
.tbl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}

/* inputs */
.input,.select{font-family:var(--sans);font-size:.86rem;color:var(--ink);width:100%;padding:.6em .85em;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .16s,box-shadow .16s}
.input:focus,.select:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
.input::placeholder{color:var(--ink-3)}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap .i{position:absolute;left:12px;width:16px;height:16px;color:var(--ink-3);pointer-events:none}
.search-wrap .input{padding-left:36px}
.field{display:flex;flex-direction:column;gap:.35em;margin-bottom:12px}
.field label{font-size:.78rem;font-weight:550;color:var(--ink-2)}
textarea.input{resize:vertical;min-height:80px}

/* chips / segmented */
.chip{display:inline-flex;align-items:center;gap:.35em;font-size:.78rem;font-weight:500;padding:.4em .8em;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.65em .95em;font-weight:550;font-size:.86rem;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink-2)} .tab.on{color:var(--ink);border-color:var(--clay)}

/* charts */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bars .b .bar{width:100%;max-width:36px;background:var(--clay);border-radius:6px 6px 3px 3px;transition:height .8s var(--ease);position:relative}
.bars .b .bar.alt{background:var(--surface-3)}
.bars .b .lb{font-size:.68rem;color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.progrow{display:flex;align-items:center;gap:12px;padding:9px 0}
.progrow .pl{width:120px;font-size:.82rem;flex:none}
.progrow .pt{flex:1;height:8px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden}
.progrow .pt i{display:block;height:100%;background:var(--clay);border-radius:var(--r-full);transition:width .8s var(--ease)}
.progrow .pv{width:52px;text-align:right;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}

/* feed */
.feed-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.feed-item:last-child{border-bottom:0}
.feed-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}

/* queue (moderação) */
.q-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}
.q-card.gone{opacity:0;transform:scale(.97);transition:all .3s var(--ease);pointer-events:none}

/* toast / modal */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:.8em 1.15em;border-radius:var(--r-full);font-size:.86rem;font-weight:500;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:.55em;animation:tin .35s var(--ease)}
.toast.err{background:var(--danger)} .toast.ok2{background:var(--sage)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:rgba(20,17,12,.44);backdrop-filter:blur(3px);z-index:100;opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:110;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-lg);width:min(560px,94vw);max-height:88vh;overflow-y:auto;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:all .3s var(--ease)}
.modal.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.modal-pad{padding:24px}
.modal-x{position:absolute;top:14px;right:14px}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);font-size:.84rem;line-height:1.5}
.callout .i{width:18px;height:18px;flex:none;margin-top:1px}
.callout-info{background:var(--sky-soft);color:var(--sky)}
.callout-warn{background:var(--gold-soft);color:var(--amber)}
.callout-sage{background:var(--sage-soft);color:var(--sage)}

/* mobile */
.menu-btn{display:none}
@media (max-width:960px){
  .sidebar{transform:translateX(-100%);transition:transform .3s var(--ease);box-shadow:var(--sh-lg)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .menu-btn{display:inline-flex}
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:1fr} .g2{grid-template-columns:1fr}
  .content{padding:16px}
  .modal{top:auto;bottom:0;left:0;transform:translateY(100%);width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;max-width:100%}
  .modal.on{transform:translateY(0)}
  .hide-m{display:none!important}
}
@media (max-width:560px){.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="scrim" class="scrim"></div>
<div id="modal" class="modal"><div id="modalBody"></div></div>
<div id="toasts" class="toasts"></div>
<script>
/* ============================================================
   BÚSSOLA · ADMIN
   ============================================================ */
const I={
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 6a3 3 0 0 1 0 6M21 20a6 6 0 0 0-4-5.6"/>',
  law:'<path d="M12 3v18"/><path d="M6 7h12"/><path d="m5 7-2 5a3 3 0 0 0 6 0z"/><path d="m19 7-2 5a3 3 0 0 0 6 0z"/><path d="M8 21h8"/>',
  building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M10 21v-4h4v4"/>',
  work:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
  home:'<path d="M4 11 12 5l8 6"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/>',
  event:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  content:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/>',
  doc:'<path d="M7 3h10l0 18H7z"/><path d="M10 8h4M10 12h4M10 16h2"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-6.5A8 8 0 1 1 21 12z"/>',
  flag:'<path d="M4 21V4M4 4c3-1.5 7 1.5 10 0s6-1 6-1v11s-3 .5-6 1-7-1.5-10 0"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 7.5 8 9 4.5-1.5 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  chart:'<path d="M4 20V4M4 20h16"/><rect x="7" y="12" width="3" height="5"/><rect x="12" y="8" width="3" height="9"/><rect x="17" y="5" width="3" height="12"/>',
  bell:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
  check:'<path d="m4 12 5 5L20 6"/>',
  x:'<path d="M6 6 18 18M18 6 6 18"/>',
  chevr:'<path d="m9 6 6 6-6 6"/>',
  chevd:'<path d="m6 9 6 6 6-6"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>',

let qFilter='';
R.reports=()=>{
  const list=QUEUE.filter(q=>!qFilter||q.type===qFilter);
  const types=[...new Set(QUEUE.map(q=>q.type))];
  return `${head('Denúncias e moderação',`${QUEUE.length} itens à espera de decisão · ordenados por urgência`,`
    <button class="btn btn-ghost btn-sm" onclick="showLog()">${svg('history')} Histórico de ações</button>`)}
  <div class="row gap6 wrap mb16">
    <span class="chip ${!qFilter?'on':''}" onclick="qFilter='';go('reports')">Tudo (${QUEUE.length})</span>
    ${types.map(t=>`<span class="chip ${qFilter===t?'on':''}" onclick="qFilter='${t}';go('reports')">${esc(t)} (${QUEUE.filter(q=>q.type===t).length})</span>`).join('')}
  </div>
  ${list.length?`<div class="grid g2" id="qGrid">${list.map(qCard).join('')}</div>`
   :`<div class="card card-pad tc" style="padding:56px 20px">
      <div style="color:var(--sage);width:44px;margin:0 auto 14px">${svg('check')}</div>
      <div class="h3 mb4">Fila limpa</div><p class="muted">Não há nada à espera de moderação. Bom trabalho.</p></div>`}`;
};
function qCard(q){
  return `<div class="q-card" id="q_${q.id}">
    <div class="row between">
      <div class="row gap6"><span class="tag">${esc(q.type)}</span><span class="pill pill-rej"><i class="dot"></i>${q.reports} ${q.reports===1?'denúncia':'denúncias'}</span></div>
      <span class="muted fs-xs">${esc(q.time)}</span>
    </div>
    <div><div class="fw6">${esc(q.title)}</div><div class="muted fs-xs">por ${esc(q.by)}</div></div>
    <div class="callout callout-warn">${svg('warn')}<div><b>${esc(q.reason)}.</b> ${esc(q.detail)}</div></div>
    <div class="row gap6 wrap">
      <button class="btn btn-sage btn-sm" onclick="resolveQ('${q.id}','Aprovado')">${svg('check')} Aprovar</button>
      <button class="btn btn-danger btn-sm" onclick="resolveQ('${q.id}','Rejeitado')">${svg('x')} Rejeitar</button>
      <button class="btn btn-ghost btn-sm" onclick="resolveQ('${q.id}','Suspenso')">${svg('pause')} Suspender</button>
      <button class="btn btn-ghost btn-sm" onclick="resolveQ('${q.id}','Eliminado')">${svg('trash')} Eliminar</button>
      <button class="btn btn-quiet btn-sm mla" onclick="askInfo('${q.id}')">${svg('send')} Pedir informação</button>
    </div>
  </div>`;
}
function resolveQ(id,action){
  const q=QUEUE.find(x=>x.id===id);if(!q)return;
  const card=el('q_'+id);if(card)card.classList.add('gone');
  logAction(action+' ('+q.type.toLowerCase()+')',q.title);
  setTimeout(()=>{QUEUE=QUEUE.filter(x=>x.id!==id);renderShell();go('reports')},280);
  toast(action+' · ação registada no histórico',action==='Aprovado'?'ok2':'err');
}
function askInfo(id){const q=QUEUE.find(x=>x.id===id);
  openModal(`<div class="modal-pad"><button class="btn btn-quiet btn-icon modal-x" onclick="closeModal()">${svg('x')}</button>
  <h2 class="h2 mb4">Pedir informação</h2><p class="muted fs-sm mb16">Sobre "${esc(q.title)}"</p>
  <div class="field"><label>Mensagem para ${esc(q.by)}</label><textarea class="input">Olá, para podermos analisar o seu caso precisamos de informação adicional. Pode enviar-nos comprovativos que confirmem os dados do anúncio?</textarea></div>
  <button class="btn btn-primary btn-block" onclick="closeModal();toast('Pedido de informação enviado','ok2')">${svg('send')} Enviar pedido</button></div>`)}
function showLog(){
  openModal(`<div class="modal-pad"><button class="btn btn-quiet btn-icon modal-x" onclick="closeModal()">${svg('x')}</button>
  <h2 class="h2 mb4">Histórico de ações</h2><p class="muted fs-sm mb16">Registo de auditoria de todas as decisões administrativas.</p>
  ${ACTIONLOG.map(a=>`<div class="feed-item"><div class="feed-ic" style="background:var(--surface-2);color:var(--ink-2)">${svg('history')}</div>
    <div style="flex:1"><div class="fs-sm"><b>${esc(a.admin)}</b> — ${esc(a.action)} <b>${esc(a.target)}</b></div><div class="muted fs-xs">${esc(a.time)}</div></div></div>`).join('')}
  <div class="callout callout-info mt16">${svg('shield')}<div>O histórico é imutável e mantido para auditoria e conformidade.</div></div></div>`)}

/* ============================================================
   VERIFICAÇÕES
   ============================================================ */
R.verif=()=>{
  const rows=VERIF.map(v=>`<tr>
    <td><div class="fw6">${esc(v.name)}</div><div class="muted fs-xs">${esc(v.type)}</div></td>
    <td class="fs-sm">${esc(v.doc)}</td>
    <td class="muted fs-sm">${esc(v.time)}</td>
    <td>${statusPill(v.status)}</td>
    <td><div class="t-actions">
      ${v.status!=='ok'?`<button class="btn btn-sage btn-xs" onclick="setVerif('${v.id}','ok')">${svg('check')} Verificar</button>`:''}
      ${v.status==='pend'?`<button class="btn btn-ghost btn-xs" onclick="setVerif('${v.id}','anal')">Analisar</button>`:''}
      ${v.status!=='rej'?`<button class="btn btn-danger btn-xs" onclick="setVerif('${v.id}','rej')">${svg('x')}</button>`:''}
    </div></td>
  </tr>`).join('');
  const counts=['pend','anal','ok','rej'].map(s=>VERIF.filter(v=>v.status===s).length);
  return `${head('Verificações','Confirmação de credenciais e documentos das entidades')}
  <div class="grid g4 mb16">
    ${[['Pendentes',counts[0],'clock','var(--gold)'],['Em análise',counts[1],'eye','var(--sky)'],['Verificados',counts[2],'shield','var(--sage)'],['Rejeitados',counts[3],'ban','var(--danger)']]
      .map(([l,v,ic,c])=>`<div class="stat"><div class="ic" style="background:color-mix(in srgb,${c} 14%,transparent);color:${c}">${svg(ic)}</div><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}
  </div>
  ${tableWrap('Pedidos de verificação',`${VERIF.length} registos`,[{l:'Entidade'},{l:'Documentos'},{l:'Atualizado'},{l:'Estado'},{l:''}],rows)}
  <div class="callout callout-info mt16">${svg('info')}<div>O selo <b>Verificado</b> aparece no perfil público e é um dos principais sinais de confiança para os utilizadores. Verifica sempre o documento original antes de aprovar.</div></div>`;
};
function setVerif(id,st){const v=VERIF.find(x=>x.id===id);v.status=st;
  const p=PROS.find(x=>x.name===v.name);if(p)p.status=st;
  logAction(st==='ok'?'Verificou':st==='rej'?'Rejeitou verificação de':'Pôs em análise',v.name);
  v.time=st==='ok'?'Verificado agora':st==='rej'?'Rejeitado':'Em análise';
  go('verif');renderShell();toast(st==='ok'?'Entidade verificada':st==='rej'?'Verificação rejeitada':'Movido para análise',st==='ok'?'ok2':st==='rej'?'err':'')}

    <div class="eyebrow mb4">Funil</div><div class="h3 mb16">Do visitante ao utilizador ativo</div>

    <div class="card card-pad"><div class="eyebrow mb4">Aquisição</div><div class="h3 mb16">Países de origem</div>${bar(ORIGINS,'v',Math.max(...ORIGINS.map(o=>o.v)))}</div>

R.payments=()=>{

    <div class="card card-pad"><div class="h3 mb16">Planos</div>
      ${PLANS.map(p=>`<div class="row between" style="padding:11px 0;border-bottom:1px solid var(--line-2)">
